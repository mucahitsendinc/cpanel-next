<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cpanel-next</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
  --fg:#e6e8ee; --dim:#8b93a5; --accent:#4ea1ff; --ok:#3ecf8e; --warn:#f5b544; --bad:#ff6b6b;
  --radius:10px;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f6f7f9; --panel:#fff; --panel2:#f0f2f5; --line:#dfe3ea;
         --fg:#1b1f27; --dim:#666e7d; --accent:#0b6bcb; --ok:#12855a; --warn:#a86800; --bad:#c0392b; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent)}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;padding:7px 13px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.danger{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:600}
button.link{background:none;border:none;padding:2px 4px;color:var(--accent);text-decoration:underline}
input,select{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
label{display:block;margin:12px 0 5px;color:var(--dim);font-size:12px;
  text-transform:uppercase;letter-spacing:.5px}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;
  background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;flex-wrap:wrap}
header .brand{font-weight:700;letter-spacing:-.3px}
header .spacer{flex:1}
main{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;margin-bottom:18px}
.card h2{margin:0 0 4px;font-size:15px}
.card p.sub{margin:0 0 14px;color:var(--dim);font-size:13px}
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.tabs button{border-radius:999px}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--dim);font-weight:600;font-size:11px;
  text-transform:uppercase;letter-spacing:.5px;padding:6px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;
  border:1px solid var(--line);color:var(--dim)}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px}
.kv dt{color:var(--dim)}
.kv dd{margin:0}
.log{background:#0a0c10;color:#d5dae4;border-radius:8px;padding:12px;
  height:340px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12px;white-space:pre-wrap;word-break:break-word}
.log .s{color:#4ea1ff}
.log .e{color:#ff6b6b}
.log .w{color:#f5b544}
.log .d{color:#3ecf8e}
.msg{padding:11px 13px;border-radius:8px;margin-bottom:14px;font-size:13px}
.msg.err{background:rgba(255,107,107,.12);border:1px solid var(--bad)}
.msg.warn{background:rgba(245,181,68,.12);border:1px solid var(--warn)}
.msg.info{background:rgba(78,161,255,.10);border:1px solid var(--accent)}
.center{max-width:400px;margin:12vh auto}
.browse{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.browse div{padding:7px 11px;cursor:pointer;border-bottom:1px solid var(--line);font-size:13px}
.browse div:last-child{border-bottom:none}
.browse div:hover{background:var(--panel2)}
.hide{display:none}
.muted{color:var(--dim)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
progress{width:100%;height:6px}

/* ---------------------------------------------------------------------------
 * Rehberlik katmanı.
 *
 * Arayüz çalışıyordu ama bir cPanel/Node bilgisi VARSAYIYORDU: ekranda altı
 * sekme, jargonlu sütun başlıkları ve tek satır açıklama yoktu. Aşağıdaki
 * sınıflar o boşluğu dolduruyor — her bölümün bir alt başlığı, her boş
 * listenin bir "şimdi ne yapmalıyım" kartı, her teknik terimin bir cümlesi.
 * ------------------------------------------------------------------------ */

/* Bölüm başlığı: büyük başlık + tek satır açıklama */
.sec{margin:0 0 14px}
.sec h2{margin:0 0 3px;font-size:16px;letter-spacing:-.2px}
.sec p{margin:0;color:var(--dim);font-size:13px}

/* Alan altı yardım metni — etiketin altında, girdinin üstünde */
.help{color:var(--dim);font-size:12px;margin:4px 0 0;line-height:1.45}

/* Hızlı işlem kutuları */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;
  padding:13px 14px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--panel2);cursor:pointer;text-decoration:none;color:inherit;width:100%}
.tile:hover{border-color:var(--accent)}
.tile b{font-size:13px;font-weight:600}
.tile span{font-size:11.5px;color:var(--dim);line-height:1.35}
.tile .ico{font-size:17px;line-height:1;margin-bottom:3px}

/* Uygulama kartı — yoğun tablo yerine */
.app{border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;margin-bottom:10px;
  background:var(--panel2)}
.app .top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.app .name{font-weight:600;font-size:14px}
.app .meta{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 12px;font-size:12px;color:var(--dim)}
.app .meta b{font-weight:500;color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* Durum noktası */
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dim);
  margin-right:6px;vertical-align:middle}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(62,207,142,.18)}
.dot.off{background:var(--warn);box-shadow:0 0 0 3px rgba(245,181,68,.18)}

/* Boş durum — "liste boş" demek yetmiyor, ne yapılacağını da söylemeli */
.empty{text-align:center;padding:30px 20px;border:1px dashed var(--line);border-radius:var(--radius)}
.empty .ico{font-size:26px;opacity:.55}
.empty h3{margin:10px 0 5px;font-size:14px}
.empty p{margin:0 auto 15px;max-width:430px;color:var(--dim);font-size:13px}

/* Sihirbaz adım şeridi */
.steps{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;padding:8px 13px;border:1px solid var(--line);
  border-radius:999px;font-size:12.5px;color:var(--dim);background:var(--panel)}
.step .n{display:grid;place-items:center;width:19px;height:19px;border-radius:50%;
  background:var(--line);color:var(--fg);font-size:11px;font-weight:600}
.step.on{border-color:var(--accent);color:var(--fg)}
.step.on .n{background:var(--accent);color:#fff}
.step.done{color:var(--ok);border-color:var(--ok)}
.step.done .n{background:var(--ok);color:#fff}

/* Numaralı anlatım (karşılama ekranı) */
.howto{counter-reset:h;margin:0;padding:0;list-style:none}
.howto li{counter-increment:h;position:relative;padding:0 0 14px 34px;font-size:13px}
.howto li::before{content:counter(h);position:absolute;left:0;top:0;width:22px;height:22px;
  display:grid;place-items:center;border-radius:50%;background:var(--panel2);
  border:1px solid var(--line);font-size:11px;font-weight:600}
.howto li b{display:block;margin-bottom:2px;font-size:13.5px}
.howto li span{color:var(--dim)}

/* Üst araç çubuğu — cPanel'in kendi ekranlarına bağlantılar */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.toolbar a{text-decoration:none}
.wide{max-width:720px}
</style>

/* ------------------------------------------------------------------ api */
async function api(pathname, opts = {}) {
  const res = await fetch('/api/' + pathname, {
    ...opts,
    headers: { 'X-CN-Token': TOKEN, 'Content-Type': 'application/json', ...(opts.headers || {}) },
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || ('HTTP ' + res.status));
    err.hint = data.hint;
    throw err;
  }
  return data;
}
const post = (p, body) => api(p, { method: 'POST', body: JSON.stringify(body || {}) });

/* ----------------------------------------------------------------- util */
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return n;
};
const bytes = (n) => {
  const u = ['B', 'KB', 'MB', 'GB'];
  let v = Number(n || 0), i = 0;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return v.toFixed(v >= 100 || i === 0 ? 0 : 1) + ' ' + u[i];
};
const app = document.getElementById('app');
const clear = (n) => { while (n.firstChild) n.removeChild(n.firstChild); };

let ST = { locked: true, profiles: [], profile: null, tab: 'overview', overview: null, deploy: {} };

function showError(container, err) {
  container.prepend(el('div', { class: 'msg err' },
    el('strong', {}, err.message),
    err.hint ? el('div', { class: 'muted' }, err.hint) : null));
}

/** Seçili hesabın şifresi kasada var mı — otomatik giriş buna bağlı. */
function autoLogin() {
  const p = ST.profiles.find((x) => x.name === ST.profile);
  return Boolean(p && p.hasPassword);
}

/**
 * cPanel ekranına giden adres.
 *
 * Şifre kasadaysa yerel `/sso` sayfasından geçiyor: o sayfa cPanel'in giriş
 * formuna POST edip oturumu AÇIYOR ve hedefe düşüyor. Şifre yoksa doğrudan
 * cPanel giriş sayfasına `goto_uri` ile gidiliyor — kullanıcı şifresini
 * cPanel'e yazıyor ve yine doğru yere varıyor.
 *
 * `fallback` sunucunun ürettiği şifresiz adres; ikisi de aynı hedefe çıkıyor.
 */
function cpanelUrl(target, params, fallback) {
  if (!autoLogin()) return fallback || '#';
  const q = new URLSearchParams({ t: TOKEN, profile: ST.profile, target });
  for (const [k, v] of Object.entries(params || {})) if (v) q.set(k, v);
  return '/sso?' + q.toString();
}

/* ---------------------------------------------------------------- render */
async function boot() {
  const st = await api('status');
  ST.locked = st.locked;
  ST.profiles = st.profiles;
  LANG = st.lang || LANG;
  if (!ST.profile && st.profiles.length) ST.profile = st.profiles[0].name;
  // Terminalden bir proje dizininde açıldıysa o projeyi hazır seç ve
  // doğrudan yayınla sekmesine düş — kullanıcı zaten onun için geldi.
  if (st.initialProject && !ST.deploy.path) {
    ST.deploy = { path: st.initialProject.path };
    ST.tab = 'deploy';
  }
  /*
   * Hiç hesap yoksa açılacak bir kasa da yok.
   *
   * Kasa her zaman kilitli başladığı için burada yalnızca `locked`'a bakmak,
   * yeni kullanıcıyı "Kasayı aç" ekranına hapsediyordu: girdiği her şifre
   * `no profiles` hatası veriyordu ve ileri gitmenin yolu yoktu.
   */
  if (!st.hasProfiles) return renderWelcome();
  ST.locked ? renderUnlock() : renderMain();
}

function renderUnlock(errMsg) {
  clear(app);
  const box = el('div', { class: 'center' });
  const input = el('input', { type: 'password', autofocus: 'true' });
  const btn = el('button', { class: 'primary', style: 'width:100%;margin-top:14px' }, s('unlock'));

  const submit = async () => {
    btn.disabled = true;
    try {
      const r = await post('unlock', { master: input.value });
      ST.locked = false; ST.profiles = r.profiles;
      ST.profile = r.profiles[0]?.name ?? null;
      renderMain();
    } catch (err) {
      btn.disabled = false;
      renderUnlock(err.message);
    }
  };
  btn.addEventListener('click', submit);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });

  box.append(
    el('div', { class: 'card' },
      el('h2', {}, 'cpanel-next'),
      el('p', { class: 'sub' }, s('masterHint')),
      errMsg ? el('div', { class: 'msg err' }, errMsg) : null,
      el('label', {}, s('master')), input, btn));
  app.append(box);
  setTimeout(() => input.focus(), 30);
}

/**
 * Karşılama ekranı — hiç hesap bağlanmamışken.
 *
 * Eskiden bu durumda kullanıcı doğrudan AYARLAR sekmesine düşüyordu: altı
 * sekme, bir form ve hiçbir açıklama. Aracın ne yaptığını, şifresinin ne
 * olacağını ve sırada ne olduğunu bilmeyen biri için anlaşılır değildi.
 */
function renderWelcome() {
  clear(app);
  const main = el('main', { class: 'wide' });

  main.append(el('div', { class: 'card' },
    el('div', { class: 'sec' },
      el('h2', { style: 'font-size:20px' }, s('welcomeTitle')),
      el('p', {}, s('welcomeLead'))),
    el('ol', { class: 'howto', style: 'margin-top:18px' },
      el('li', {}, el('b', {}, s('how1')), el('span', {}, s('how1d'))),
      el('li', {}, el('b', {}, s('how2')), el('span', {}, s('how2d'))),
      el('li', {}, el('b', {}, s('how3')), el('span', {}, s('how3d'))))));

  // Hesap ekleme formunu ayarlardan taşımıyoruz, oraya YÖNLENDİRİYORUZ —
  // tek bir form, tek bir doğru yer.
  const box = el('div', {});
  main.append(box);
  app.append(main);
  // İlk hesapta ana şifre de burada belirleniyor: kasa henüz yok.
  renderAddProfile(box, { autofocus: true, askMaster: true, onDone: () => boot() });
}

function renderMain() {
  clear(app);
  if (!ST.profiles.length) return renderWelcome();
  const sel = el('select', { style: 'width:auto;min-width:230px',
    onchange: (e) => { ST.profile = e.target.value; ST.overview = null; renderMain(); } },
    ...ST.profiles.map((p) => el('option', { value: p.name, selected: p.name === ST.profile },
      p.user + '@' + p.host)));

  const langBtn = el('button', { onclick: async () => {
    LANG = LANG === 'tr' ? 'en' : 'tr';
    await post('lang', { lang: LANG });
    renderMain();
  } }, LANG === 'tr' ? 'EN' : 'TR');

  /*
   * Üstte hangi YEREL projede olduğumuz yazıyor; tıklayınca proje seçiciye
   * dönülüyor. Araç birden çok projeden çalıştırıldığında hangisine baktığını
   * bilmek şart.
   */
  const projBtn = el('button', {
    style: 'max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap',
    title: ST.deploy.path || s('switchProject'),
    onclick: () => { ST.deploy = {}; ST.tab = 'deploy'; renderMain(); },
  }, '📁 ' + (ST.deploy.path ? ST.deploy.path.split('/').filter(Boolean).pop() : s('switchProject')));

  app.append(el('header', {},
    el('span', { class: 'brand' }, 'cpanel-next'), sel,
    el('span', { class: 'spacer' }), projBtn, el('span', { class: 'spacer' }), langBtn,
    el('button', { onclick: async () => { await post('lock'); ST.locked = true; renderUnlock(); } }, s('lock')),
    el('button', { onclick: async () => {
      const r = await post('exit');
      if (r.jobs && !confirm(s('jobRunning'))) return;
      document.body.innerHTML = '';
      document.body.append(el('div', { class: 'center' },
        el('div', { class: 'card' }, el('h2', {}, 'cpanel-next'), el('p', { class: 'sub' }, s('closed')))));
      stopHeartbeat();
    } }, s('backToTerminal'))));

  const main = el('main', {});
  /*
   * Sekmeler ALANLARA göre, işlemlere göre değil.
   *
   * Eskiden "Yedekler" ve "Kayıtlar" ayrı iki sekmeydi; ikisi de "ne oldu,
   * geri alabilir miyim" sorusunun parçası. Tek bir "Geçmiş" altında
   * birleştirmek, e-posta ve FTP eklendikten sonra sekme sayısının
   * yönetilebilir kalmasını sağlıyor.
   */
  const TABS = ['overview', 'deploy', 'database', 'mail', 'ftp', 'history', 'settings'];
  const tabs = el('div', { class: 'tabs' },
    ...TABS.map((k) =>
      el('button', {
        class: ST.tab === k ? 'on' : '',
        // Sekme adı tek başına ne olduğunu anlatmıyor; başlık ipucu ve altındaki
        // satır bunu kapatıyor.
        title: s('tab' + k[0].toUpperCase() + k.slice(1) + 'Sub'),
        onclick: () => { ST.tab = k; renderMain(); },
      }, s(k))));
  main.append(tabs);
  main.append(el('p', { class: 'help', style: 'margin:-8px 0 18px 4px' },
    s('tab' + ST.tab[0].toUpperCase() + ST.tab.slice(1) + 'Sub')));

  const body = el('div', {});
  main.append(body);
  app.append(main);

  ({ overview: viewOverview, deploy: viewDeploy, database: viewDatabase, mail: viewMail,
     ftp: viewFtp, history: viewHistory, settings: viewSettings })[ST.tab](body);
}

 * Panel.
 *
 * Eskiden burası üç yoğun tabloydu: "Rejim", "Belge kökü", "Sahip: dış" gibi
 * başlıklar bir cPanel/Node bilgisi varsayıyordu ve hiçbirinin yanında bir
 * açıklama yoktu. Şimdi önce NE YAPABİLECEĞİN (hızlı işlemler), sonra
 * SİTELERİN kart olarak, en sonda ayrıntı olarak domain tablosu geliyor.
 */
async function viewOverview(root, refresh) {
  root.append(el('div', { class: 'card' }, s('working')));
  try {
    if (!ST.overview || refresh) ST.overview = await api('overview/' + encodeURIComponent(ST.profile) + (refresh ? '?refresh=1' : ''));
  } catch (err) { clear(root); return showError(root, err); }
  const o = ST.overview;
  clear(root);

  const reload = () => { const r = root; clear(r); viewOverview(r, true); };
  const jobOut = el('div', {});

  /* --- hızlı işlemler: cPanel'in kendi ekranları da dahil --- */
  const link = (href, ico, title, sub) =>
    el('a', { class: 'tile', href, target: '_blank', rel: 'noreferrer' },
      el('span', { class: 'ico' }, ico), el('b', {}, title),
      el('span', {}, sub + (autoLogin() ? ' · ⚡' : '')));

  const L = o.links ?? {};
  root.append(el('div', { class: 'card' },
    el('div', { class: 'sec' },
      el('h2', {}, o.profile.user + '@' + o.profile.host),
      el('p', {}, o.regimeLabel + ' · ' + s('quota') + ' ' + o.apps.length + '/' + (o.maxApps ?? '∞'))),
    el('div', { class: 'tiles' },
      el('button', { class: 'tile', onclick: () => { ST.deploy = {}; ST.tab = 'deploy'; renderMain(); } },
        el('span', { class: 'ico' }, '🚀'), el('b', {}, s('newDeploy')), el('span', {}, s('newDeploySub'))),
      link(cpanelUrl('phpmyadmin', {}, L.phpMyAdmin), '🗄️', 'phpMyAdmin', s('openPmaSub')),
      link(cpanelUrl('files', {}, L.files), '📂', s('openFiles'), s('openFilesSub')),
      link(cpanelUrl('cpanel', {}, L.cpanel), '🎛️', s('openCpanel'), s('openCpanelSub'))),
    el('p', { class: 'help', style: 'margin-top:12px' },
      autoLogin() ? s('autoLoginNote') : s('externalNote'))));

  /* --- uygulamalar: tablo değil, kart --- */
  const appsCard = el('div', { class: 'card' },
    el('div', { class: 'row' },
      el('div', { class: 'sec', style: 'flex:1' },
        el('h2', {}, s('apps')), el('p', {}, s('appsSub'))),
      el('button', { onclick: reload }, s('refresh'))));

  if (!o.apps.length) {
    appsCard.append(el('div', { class: 'empty' },
      el('div', { class: 'ico' }, '🚀'),
      el('h3', {}, s('noAppsTitle')),
      el('p', {}, s('noAppsBody')),
      el('button', { class: 'primary', onclick: () => { ST.deploy = {}; ST.tab = 'deploy'; renderMain(); } },
        s('newDeploy'))));
  } else {
    for (const a of o.apps) appsCard.append(appCard(a, jobOut, reload));
  }
  root.append(appsCard);

  /* --- domainler: ayrıntı, en altta --- */
  const subOut = el('div', {});
  const domCard = el('div', { class: 'card' },
    el('div', { class: 'row' },
      el('div', { class: 'sec', style: 'flex:1' },
        el('h2', {}, s('domains')), el('p', {}, s('domainsSub'))),
      el('button', { onclick: () => askNewSubdomain(subOut, o, root) }, '+ ' + s('newSubdomain'))),
    subOut);

  if (!o.domains.length) {
    domCard.append(el('div', { class: 'empty' },
      el('div', { class: 'ico' }, '🌐'),
      el('h3', {}, s('noDomainsTitle')),
      el('p', {}, s('noDomainsBody'))));
  } else {
    domCard.append(el('table', {},
      el('thead', {}, el('tr', {}, el('th', {}, s('domain')), el('th', {}, s('type')),
        el('th', {}, s('docroot')), el('th', {}, s('app')))),
      el('tbody', {}, ...o.domains.map((d) => {
        const a = o.apps.find((x) => x.domain === d.domain);
        return el('tr', {},
          el('td', {}, el('a', { href: 'https://' + d.domain, target: '_blank', rel: 'noreferrer' }, d.domain)),
          el('td', {}, el('span', { class: 'pill' }, d.typeLabel)),
          el('td', { class: 'mono muted' }, d.docroot || s('none')),
          el('td', { class: 'mono' }, a ? a.name : s('none')));
      }))));
  }
  root.append(domCard);

  // ⚠ Bu satır eksikti: kap oluşturuluyor, düğmeler ona yazıyor ama DOM'a hiç
  // eklenmiyordu. Sonuç: düğmeye basınca devre dışı kalıyor ve HİÇBİR ŞEY
  // görünmüyordu.
  root.append(jobOut);
}

/** Tek bir uygulamanın kartı: durumu, adresi ve yapılabilecek her şey. */
function appCard(a, jobOut, reload) {
  const on = /start|run/i.test(String(a.status ?? (a.enabled ? 'started' : 'stopped')));

  // Bu işler CloudLinux'ta worker'dan geçiyor ve 5-60 sn sürebiliyor;
  // kullanıcı ne olduğunu görmeli. Hepsi iş olarak koşup log akıtıyor.
  const act = (action) => async (e) => {
    e.target.disabled = true;
    try {
      const r = await post('app-action', { profile: ST.profile, appRoot: a.path, action });
      renderJob(jobOut, r.jobId, reload);
    } catch (err) { e.target.disabled = false; showError(jobOut, err); }
  };

  return el('div', { class: 'app' },
    el('div', { class: 'top' },
      el('span', { class: 'name' }, el('span', { class: 'dot ' + (on ? 'on' : 'off') }), a.name),
      a.domain
        ? el('a', { href: 'https://' + a.domain, target: '_blank', rel: 'noreferrer' }, a.domain)
        : el('span', { class: 'muted' }, s('none')),
      el('span', { class: 'pill ' + (on ? 'ok' : 'warn') }, on ? s('running') : s('stopped')),
      a.owned ? el('span', { class: 'pill ok' }, s('mine')) : el('span', { class: 'pill' }, s('external'))),

    el('div', { class: 'meta' },
      el('span', {}, s('folder') + ': ', el('b', {}, '~/' + a.path)),
      a.nodeVersion ? el('span', {}, 'Node: ', el('b', {}, a.nodeVersion)) : null,
      a.ownerProject ? el('span', {}, s('linkedTo') + ': ', el('b', {}, a.ownerProject)) : null),

    el('div', { class: 'row' },
      el('button', {
        class: a.ownerProject ? 'primary' : '',
        title: a.ownerProject || s('noLink'),
        onclick: () => startUpdate(jobOut, a, reload),
      }, '⬆ ' + s('update')),
      el('button', { onclick: act('restart') }, '↻ ' + s('restart')),
      el('button', { onclick: act(on ? 'stop' : 'start') }, on ? '⏹ ' + s('stop') : '▶ ' + s('start')),
      el('a', {
        href: cpanelUrl('files', { dir: a.path }, a.filesUrl),
        target: '_blank', rel: 'noreferrer',
      }, el('button', {}, '📂 ' + s('appFiles'))),
      el('button', {
        title: s('changeProject'),
        onclick: () => {
          // Hedef sabit (domain + app-root), yalnızca KAYNAK klasör yeniden
          // seçiliyor. Uygulamayı başka bir yerel projeye bağlamak ya da makine
          // değiştirdikten sonra yeniden eşlemek için.
          ST.deploy = { path: null, domain: a.domain, appRoot: a.path, relink: a.name };
          ST.tab = 'deploy';
          renderMain();
        },
      }, s('changeProject')),
      el('button', { title: s('backupDownloadSub'), onclick: async (e) => {
        e.target.disabled = true;
        clear(jobOut);
        try {
          const r = await post('files-download', { profile: ST.profile, path: a.path });
          renderJob(jobOut, r.jobId);
        } catch (err) { showError(jobOut, err); }
        e.target.disabled = false;
      } }, '⬇ ' + s('downloadFiles')),
      el('span', { class: 'spacer', style: 'flex:1' }),
      el('button', { class: 'danger', onclick: () => askDelete(jobOut, a, reload) }, s('del'))));
}

/**
 * Güncelleme başlat.
 *
 * Projeyi HER ZAMAN açıkça gönderiyoruz. Eskiden düğme yalnızca uygulama
 * klasörünü gönderiyordu ve sunucu sahiplik işaretindeki projeye düşüyordu —
 * yani üstte başka bir proje seçilse bile hep eskisi yayınlanıyordu.
 *
 * Seçili proje bağlı projeden farklıysa SESSİZCE birini seçmiyoruz: ikisi de
 * makul bir niyet olabilir ve yanlış olanı seçmek uygulamanın üstüne başka bir
 * projeyi yazmak demek. Kullanıcı karar veriyor.
 */
function startUpdate(out, app, reload) {
  const selected = ST.deploy.path || null;
  const linked = app.ownerProject || null;

  const run = async (projectPath) => {
    clear(out);
    try {
      const r = await post('app-update', { profile: ST.profile, appRoot: app.path, projectPath });
      renderJob(out, r.jobId, reload);
    } catch (err) { showError(out, err); }
  };

  if (!linked && !selected) { alert(s('noLink')); return; }
  if (!selected || !linked || samePath(selected, linked)) { run(selected || linked); return; }

  clear(out);
  out.append(el('div', { class: 'card', style: 'margin:16px 0 0' },
    el('div', { class: 'msg warn' }, s('projectMismatch')),
    el('h2', {}, s('whichProject')),
    el('div', { class: 'row', style: 'margin-top:10px' },
      el('button', { class: 'primary', onclick: () => run(linked) },
        s('linkedProject') + ': ' + linked.split('/').filter(Boolean).pop()),
      el('button', { onclick: () => run(selected) },
        s('selectedProject') + ': ' + selected.split('/').filter(Boolean).pop())),
    el('p', { class: 'sub', style: 'margin-top:10px' }, linked + '  ·  ' + selected)));
}

function samePath(a, b) {
  const norm = (p) => String(p).replace(/\/+$/, '');
  return norm(a) === norm(b);
}

/** Yeni subdomain. Belge kökü domain adıyla aynı tutuluyor. */
function askNewSubdomain(out, o, root) {
  clear(out);
  const roots = o.domains.filter((d) => d.type === 'main' || d.type === 'addon');
  const rootSel = el('select', {}, ...roots.map((d) => el('option', { value: d.domain }, d.domain)));
  const label = el('input', { placeholder: 'magaza' });
  const go = el('button', { class: 'primary', style: 'margin-top:12px' }, s('createSub'));
  go.addEventListener('click', async () => {
    go.disabled = true;
    try {
      await post('subdomain', { profile: ST.profile, label: label.value, rootDomain: rootSel.value });
      ST.overview = null;
      const c = root; clear(c); viewOverview(c, true);
    } catch (err) { go.disabled = false; showError(out, err); }
  });
  out.append(el('div', { class: 'card', style: 'margin:12px 0' },
    el('label', {}, s('underDomain')), rootSel,
    el('label', {}, s('subLabel')), label, go));
}

/** Subdomain silme — yazarak onay, ve üstünde uygulama varsa sunucu reddediyor. */
function askDeleteSubdomain(out, d, root) {
  clear(out);
  const input = el('input', { placeholder: d.domain });
  const go = el('button', { class: 'danger', style: 'margin-top:12px' }, s('delSub'));
  go.addEventListener('click', async () => {
    go.disabled = true;
    try {
      await api('subdomain', { method: 'DELETE', body: JSON.stringify({
        profile: ST.profile, domain: d.domain, confirm: input.value }) });
      ST.overview = null;
      const c = root; clear(c); viewOverview(c, true);
    } catch (err) { go.disabled = false; showError(out, err); }
  });
  out.append(el('div', { class: 'card', style: 'margin:12px 0' },
    el('div', { class: 'msg warn' }, s('subDeleteWarn').replace('{domain}', d.domain)),
    el('label', {}, s('typeToConfirm')), input, go));
}

/**
 * Uygulama kaldırma.
 *
 * ⚠ Bu fonksiyon HİÇ TANIMLANMAMIŞTI. Kart üzerindeki "Sil" düğmesi onu
 * çağırıyordu, yani tıklayınca konsola ReferenceError düşüyor ve ekranda
 * hiçbir şey olmuyordu — sessiz bir ölü düğme.
 *
 * Dosyaları silmek AYRI ve açık bir tercih: uygulama kaydını kaldırmak
 * kaynak kodu silmek anlamına gelmemeli.
 */
function askDelete(out, app, reload) {
  clear(out);
  const input = el('input', { placeholder: app.path });
  const files = el('input', { type: 'checkbox', style: 'width:auto' });
  const go = el('button', { class: 'danger', style: 'margin-top:12px' }, s('deleteApp'));

  go.addEventListener('click', async () => {
    go.disabled = true;
    try {
      const r = await post('app-delete', {
        profile: ST.profile, appRoot: app.path,
        confirm: input.value, deleteFiles: files.checked });
      renderJob(out, r.jobId, () => { ST.overview = null; reload(); });
    } catch (err) { go.disabled = false; showError(out, err); }
  });

  out.append(el('div', { class: 'card', style: 'margin:16px 0 0' },
    el('div', { class: 'msg warn' }, s('deleteWarn').replace('{name}', app.name)),
    el('label', {}, s('typeToConfirm')), input,
    el('div', { class: 'row', style: 'margin-top:12px' },
      el('label', { style: 'margin:0;text-transform:none;font-size:13px' },
        files, ' ' + s('deleteFiles'))),
    el('div', { class: 'row', style: 'margin-top:12px' },
      go, el('button', { onclick: () => clear(out) }, s('cancel')))));
  setTimeout(() => input.focus(), 30);
}

/* ---------------------------------------------------------------- deploy */
/**
 * Adım şeridi.
 *
 * Yayınlama üç karardan oluşuyor (hangi proje · nereye · onay) ama eskiden
 * hepsi tek ekranda, sırasız duruyordu. Nerede olduğunu ve kaç adım kaldığını
 * göstermek, "karışık" hissinin büyük kısmını tek başına çözüyor.
 */
function stepStrip(active) {
  const keys = ['stepProject', 'stepTarget', 'stepReview'];
  return el('div', { class: 'steps' }, ...keys.map((k, i) =>
    el('div', { class: 'step' + (i === active ? ' on' : i < active ? ' done' : '') },
      el('span', { class: 'n' }, i < active ? '✓' : String(i + 1)),
      s(k))));
}

async function viewDeploy(root) {
  const d = ST.deploy;
  clear(root);

  /* ---- 1. adım: proje ------------------------------------------------- */
  if (!d.path) {
    root.append(stepStrip(0));
    const list = el('div', {});
    root.append(el('div', { class: 'card' },
      el('div', { class: 'sec' },
        el('h2', {}, s('stepProject')),
        el('p', {}, d.relink ? s('relinkTo') : s('stepProjectSub'))),
      d.relink
        ? el('div', { class: 'msg info' }, `${d.relink} → ${d.domain} · ~/${d.appRoot}`)
        : null,
      el('p', { class: 'help' }, s('projectHelp')),
      list));

    api('recent').then((r) => {
      if (r.items.length) {
        list.append(el('label', {}, s('recent')));
        list.append(el('div', { class: 'browse' }, ...r.items.map((i) =>
          el('div', { onclick: () => pick(i.path) }, '📦 ' + i.name,
            el('span', { class: 'muted mono' }, '  ' + i.path)))));
      }
      list.append(el('label', {}, s('browse')));
      const browseBox = el('div', {});
      list.append(browseBox);
      renderBrowse(browseBox, null);
    });
    return;
  }

  /* ---- 2. adım: hedef -------------------------------------------------- */
  root.append(stepStrip(1));

  const projCard = el('div', { class: 'card' });
  root.append(projCard);
  projCard.append(
    el('div', { class: 'row' },
      el('span', { style: 'flex:1' },
        el('b', {}, '📦 ' + d.path.split('/').filter(Boolean).pop()),
        el('div', { class: 'mono muted', style: 'font-size:12px;word-break:break-all' }, d.path)),
      el('button', { onclick: () => { ST.deploy = { relink: d.relink, domain: d.domain, appRoot: d.appRoot }; renderMain(); } }, s('changeProject')),
      el('button', { onclick: () => { ST.deploy = {}; renderMain(); } }, s('cancel'))));

  const info = el('div', {});
  projCard.append(info);

  if (!d.project) {
    info.append(el('p', { class: 'sub' }, s('working')));
    try {
      const r = await api('project?path=' + encodeURIComponent(d.path));
      d.project = r.project; d.plan = r.plan; d.link = r.link;
    } catch (err) { return showError(root, err); }
    return viewDeploy(root);
  }

  clear(info);
  if (!d.project.deployable) {
    info.append(el('div', { class: 'msg err' }, el('strong', {}, s('blockers')),
      ...d.project.blockers.map((b) => el('div', {}, '• ' + b))));
    return;
  }
  const isLaravel = d.project.framework === 'laravel';
  info.append(el('div', { class: 'meta', style: 'margin:12px 0 0' },
    el('span', {}, s('framework') + ': ',
      el('b', {}, isLaravel
        ? 'Laravel ' + (d.project.laravelVersion ?? '')
        : 'Next.js ' + (d.project.nextVersion ?? '') + ' · ' + (d.project.router ?? ''))),
    isLaravel ? null : el('span', {}, s('startup') + ': ', el('b', {}, d.project.startupFile)),
    d.plan ? el('span', {}, s('package') + ': ',
      el('b', {}, d.plan.files + ' ' + s('files') + ' · ' + bytes(d.plan.bytes))) : null));
  for (const w of d.project.warnings) info.append(el('div', { class: 'msg warn' }, w));
  if (d.plan?.skippedEnv?.length) {
    info.append(el('div', { class: 'msg info' }, s('envExcluded') + ': ' + d.plan.skippedEnv.join(', ')));
  }

  /* hedef */
  if (!ST.overview) {
    try { ST.overview = await api('overview/' + encodeURIComponent(ST.profile)); }
    catch (err) { return showError(root, err); }
  }
  const o = ST.overview;

  // Laravel'in hedef adımı bambaşka: klasör seçilmiyor, migration ve vendor
  // kipi seçiliyor. Ayrı bir fonksiyona bırakmak ikisini de okunur tutuyor.
  if (isLaravel) return viewDeployLaravel(root, d, o);

  const targetCard = el('div', { class: 'card' },
    el('div', { class: 'sec' },
      el('h2', {}, s('stepTarget')),
      el('p', {}, s('stepTargetSub'))));
  const domSel = el('select', {},
    ...o.domains.filter((x) => x.type !== 'parked').map((x) =>
      el('option', { value: x.domain, selected: x.domain === (d.domain ?? (d.link && d.link.domain)) }, x.domain + ' — ' + x.typeLabel)));
  /*
   * Kayıtlı bağlantı varsa onu kullan — kullanıcı her seferinde klasör adını
   * elle yazmak zorunda kalmasın. `suggest()` yalnızca HİÇ bağlantı yokken,
   * yani gerçekten yeni bir uygulama kurulurken devreye giriyor.
   */
  const linked = d.link ?? {};
  const rootIn = el('input', { placeholder: 'myappnext' });
  const hint = el('div', {});

  /*
   * Klasör adı seçme SIRASI — ve bu sıra pahalıya mal olan bir hatadan geliyor.
   *
   * Eskiden burada doğrudan `suggest()` çağrılıyordu, yani domainde ZATEN bir
   * uygulama olsa bile yeni bir ad uyduruluyordu. Sonuç: kullanıcı deploy
   * ediyor, "başarılı" yazısını görüyor, ama site değişmiyor — çünkü paket
   * hiç servis edilmeyen yeni bir klasöre gitmiş oluyor.
   *
   * Doğru sıra: kayıtlı bağlantı → domaindeki MEVCUT uygulama → yeni ad.
   */
  function pickRoot(domain) {
    if (d.appRoot) return { value: d.appRoot, why: null };
    if (linked.appRoot) return { value: linked.appRoot, why: null };
    const existing = o.apps.find((a) => a.domain === domain);
    if (existing) return { value: existing.path, why: existing };
    return { value: suggest(domain, o.apps), why: null };
  }

  function applyRoot() {
    const r = pickRoot(domSel.value);
    rootIn.value = r.value;
    clear(hint);
    if (r.why) {
      hint.append(el('div', { class: 'msg info' },
        s('domainHasApp').replace('{name}', r.why.name).replace('{path}', r.why.path)));
    }
  }
  domSel.addEventListener('change', applyRoot);
  applyRoot();

  const noBuild = el('input', { type: 'checkbox', style: 'width:auto' });
  const adopt = el('input', { type: 'checkbox', style: 'width:auto' });
  const out = el('div', {});

  const checkBtn = el('button', { class: 'primary' }, s('next') + ' →');
  checkBtn.addEventListener('click', async () => {
    checkBtn.disabled = true;
    clear(out);
    try {
      const pf = await post('preflight', {
        profile: ST.profile, domain: domSel.value, appRoot: rootIn.value, adopt: adopt.checked });
      renderConfirm(out, pf, {
        domain: domSel.value, appRoot: rootIn.value,
        noBuild: noBuild.checked, adopt: adopt.checked });
      out.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    } catch (err) { showError(out, err); }
    checkBtn.disabled = false;
  });

  targetCard.append(
    el('label', {}, s('domain')), domSel,
    el('p', { class: 'help' }, s('domainHelp')),
    el('label', {}, s('appRoot')), rootIn,
    el('p', { class: 'help' }, s('appRootHelp')), hint,
    el('label', {}, s('actions')),
    el('div', {},
      el('label', { style: 'margin:0 0 6px;text-transform:none;font-size:13px;color:var(--fg)' },
        noBuild, ' ' + s('noBuild')),
      el('p', { class: 'help', style: 'margin:0 0 10px 22px' }, s('noBuildHelp')),
      el('label', { style: 'margin:0 0 6px;text-transform:none;font-size:13px;color:var(--fg)' },
        adopt, ' ' + s('adopt')),
      el('p', { class: 'help', style: 'margin:0 0 4px 22px' }, s('adoptHelp'))),
    el('div', { class: 'row', style: 'margin-top:18px' }, checkBtn),
    out);
  root.append(targetCard);

  function pick(p) {
    // relink kipinde hedef korunuyor; yalnızca kaynak klasör değişiyor.
    ST.deploy = { path: p, relink: d.relink, domain: d.domain, appRoot: d.appRoot };
    renderMain();
  }
  async function renderBrowse(box, start) {
    clear(box);
    let r;
    try { r = await api('browse' + (start ? '?path=' + encodeURIComponent(start) : '')); }
    catch (err) { return showError(box, err); }
    box.append(el('div', { class: 'mono muted', style: 'margin-bottom:6px' }, r.path));
    const list = el('div', { class: 'browse' });
    if (r.parent) list.append(el('div', { onclick: () => renderBrowse(box, r.parent) }, '⬆ ' + s('up')));
    for (const e of r.entries) {
      list.append(el('div', { onclick: () => renderBrowse(box, e.path) },
        (e.isProject ? '📦 ' : '📁 ') + e.name));
    }
    box.append(list);

/**
 * Laravel'in hedef adımı.
 *
 * Next.js'ten iki temel farkı var ve ikisi de kullanıcının karar yükünü
 * AZALTIYOR:
 *   · Uygulama klasörü seçilmiyor — belge kökünün kendisi. Yanlış klasöre
 *     kurma ihtimali yapısal olarak yok.
 *   · Onun yerine migration ve vendor kipi soruluyor; bunlar Next.js'te
 *     olmayan, Laravel'de olmazsa olmaz kararlar.
 */
async function viewDeployLaravel(root, d, o) {
  const domSel = el('select', {}, ...o.domains.filter((x) => x.type !== 'parked').map((x) =>
    el('option', { value: x.domain, selected: x.domain === (d.domain ?? (d.link && d.link.domain)) },
      x.domain + ' — ' + x.typeLabel)));

  const folder = el('div', { class: 'mono muted' });
  const applyFolder = () => {
    const dom = o.domains.find((x) => x.domain === domSel.value);
    folder.textContent = '~/' + ((dom && dom.docroot) || '?') + '   ' + s('lvAuto');
  };
  domSel.addEventListener('change', applyFolder);
  applyFolder();

  const migrate = el('select', {},
    el('option', { value: 'migrate', selected: true }, s('mgMigrate')),
    el('option', { value: 'none' }, s('mgNone')),
    el('option', { value: 'migrate-seed' }, s('mgMigrateSeed')),
    el('option', { value: 'fresh-seed' }, s('mgFreshSeed')));
  const migrateWarn = el('div', {});
  migrate.addEventListener('change', () => {
    clear(migrateWarn);
    if (migrate.value === 'fresh-seed') {
      migrateWarn.append(el('div', { class: 'msg warn' }, s('lvFreshWarn')));
    }
  });

  const vendorSel = el('select', {},
    el('option', { value: 'auto', selected: true }, s('vnAuto')),
    el('option', { value: 'always' }, s('vnAlways')),
    el('option', { value: 'server' }, s('vnServer')));
  const keepDebug = el('input', { type: 'checkbox', style: 'width:auto' });

  /* --- veritabanı --- */
  const dbMode = el('select', {},
    el('option', { value: 'skip', selected: true }, s('lvDbSkip')),
    el('option', { value: 'new' }, s('lvDbNew')),
    el('option', { value: 'existing' }, s('lvDbExisting')));
  const dbBox = el('div', {});
  const dbRefs = {};
  let dbData = null;

  const renderDb = async () => {
    clear(dbBox);
    for (const k of Object.keys(dbRefs)) delete dbRefs[k];
    if (dbMode.value === 'skip') return;

    if (dbMode.value === 'new') {
      const name = el('input', { placeholder: 'magaza' });
      dbBox.append(el('label', {}, s('dbNameLabel')), name, el('p', { class: 'help' }, s('dbNameHint')));
      dbRefs.newName = name;
      return;
    }

    dbBox.append(el('p', { class: 'sub' }, s('working')));
    if (!dbData) {
      try { dbData = await api('db/' + encodeURIComponent(ST.profile)); }
      catch (err) { clear(dbBox); return showError(dbBox, err); }
    }
    clear(dbBox);

    const dbSel = el('select', {}, ...dbData.databases.map((x) =>
      el('option', { value: x.name }, x.name + ' — ' + bytes(x.size))));
    const userMode = el('select', {},
      el('option', { value: 'new', selected: true }, s('lvDbUserNew')),
      el('option', { value: 'existing' }, s('lvDbUserExisting')));
    const userBox = el('div', {});

    const renderUser = () => {
      clear(userBox);
      delete dbRefs.uSel;
      delete dbRefs.pass;
      if (userMode.value === 'new') return;
      const chosen = dbData.databases.find((x) => x.name === dbSel.value);
      const users = (chosen && chosen.users) || [];
      const uSel = el('select', {}, ...users.map((u) => el('option', { value: u }, u)));
      const pass = el('input', { type: 'password' });
      userBox.append(el('label', {}, s('dbUser')), uSel, el('label', {}, s('lvDbPassword')), pass);
      dbRefs.uSel = uSel;
      dbRefs.pass = pass;
    };
    userMode.addEventListener('change', renderUser);
    dbSel.addEventListener('change', renderUser);

    dbBox.append(el('label', {}, s('database')), dbSel,
      el('label', {}, s('lvDbUser')), userMode, userBox);
    dbRefs.dbSel = dbSel;
    dbRefs.userMode = userMode;
    renderUser();
  };
  dbMode.addEventListener('change', renderDb);

  /** Seçilen veritabanı kipini, deploy'a verilecek şekle çevirir. */
  const collectDb = () => {
    if (dbMode.value === 'skip') return null;
    if (dbMode.value === 'new') {
      return { mode: 'new', name: (dbRefs.newName && dbRefs.newName.value.trim()) || '' };
    }
    const database = dbRefs.dbSel && dbRefs.dbSel.value;
    if (!database) return null;
    if (dbRefs.userMode && dbRefs.userMode.value === 'new') {
      return { mode: 'new', name: database, user: database + '_app' };
    }
    return {
      mode: 'existing',
      database,
      user: dbRefs.uSel && dbRefs.uSel.value,
      password: (dbRefs.pass && dbRefs.pass.value) || '',
      host: dbData && dbData.server.host,
      port: dbData && dbData.server.port,
    };
  };

  const out = el('div', {});
  const nextBtn = el('button', { class: 'primary' }, s('next') + ' →');
  nextBtn.addEventListener('click', async () => {
    nextBtn.disabled = true;
    clear(out);
    try {
      const pf = await post('laravel-preflight', { profile: ST.profile, domain: domSel.value });
      renderLaravelConfirm(out, pf, {
        domain: domSel.value,
        laravel: { migrate: migrate.value, vendor: vendorSel.value, keepDebug: keepDebug.checked },
        db: collectDb(),
      });
      out.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    } catch (err) { showError(out, err); }
    nextBtn.disabled = false;
  });

  root.append(el('div', { class: 'card' },
    el('div', { class: 'sec' },
      el('h2', {}, s('stepTarget')),
      el('p', {}, s('stepTargetSub'))),
    el('label', {}, s('domain')), domSel,
    el('p', { class: 'help' }, s('domainHelp')),
    el('label', {}, s('lvFolder')), folder,
    el('p', { class: 'help' }, s('lvServed') + ': public/ — ' + s('lvViaHt')),

    el('div', { class: 'sec', style: 'margin:22px 0 10px' }, el('h2', {}, s('lvTitle'))),
    el('label', {}, s('lvMigrate')), migrate, migrateWarn,
    el('label', {}, s('lvVendor')), vendorSel,
    el('label', {}, s('lvDb')), dbMode, dbBox,
    el('p', { class: 'help', style: 'margin-top:10px' }, s('lvEnvNote')),
    el('div', { class: 'row', style: 'margin-top:14px' },
      el('label', { style: 'margin:0;text-transform:none;font-size:13px;color:var(--fg)' },
        keepDebug, ' ' + s('lvKeepDebug'))),
    el('div', { class: 'row', style: 'margin-top:18px' }, nextBtn),
    out));
}

/** Laravel kontrol adımı — neyin silineceği ve neyin kalacağı açıkça yazılı. */
function renderLaravelConfirm(out, pf, form) {
  clear(out);
  const box = el('div', { class: 'card', style: 'margin:18px 0 0' });

  box.append(
    stepStrip(2),
    el('div', { class: 'sec' },
      el('h2', {}, s('stepReview')),
      el('p', {}, s('reviewIntro'))),

      el('dt', {}, s('domain')), el('dd', {}, pf.target.domain),
      el('dt', {}, s('lvFolder')), el('dd', { class: 'mono' }, '~/' + pf.appRoot),
      el('dt', {}, s('stepReview')), el('dd', {},
        el('span', { class: 'pill ' + (pf.first ? 'warn' : 'ok') },
          pf.first ? s('lvFirst') : s('lvUpdate')))));

  let confirmIn = null;
  if (pf.count) {
    box.append(el('div', { class: 'msg warn' },
      el('strong', {}, s('dangerTitle')),
      el('div', {}, s('lvNotEmpty').replace('{count}', pf.count)),
      el('div', { class: 'mono muted', style: 'margin-top:6px;word-break:break-all' },
        pf.sample.join('  ')),
      el('div', { class: 'muted', style: 'margin-top:6px' }, s('lvKept'))));
    box.append(el('label', {}, s('typeToConfirm')));
    confirmIn = el('input', { placeholder: pf.appRoot });
    box.append(confirmIn);
    setTimeout(() => confirmIn.focus(), 40);
  } else {
    box.append(el('div', { class: 'msg info' }, s('firstDeployHint')));
  }

  const go = el('button', { class: pf.count ? 'danger' : 'primary', style: 'margin-top:16px' },
    '🚀 ' + s('deployNow'));
  go.addEventListener('click', async () => {
    go.disabled = true;
    try {
      /*
       * Veritabanı ÖNCE hazırlanıyor, deploy sonra.
       *
       * Sunucudaki `.env`'e yazılacak bilgiler yayın başlamadan elde olmalı;
       * yoksa migration çalışırken bağlantı bilgisi henüz yazılmamış olur.
       */
      let db = null;
      if (form.db && form.db.mode === 'new') {
        db = await post('db-create', { profile: ST.profile, name: form.db.name, user: form.db.user });
      } else if (form.db && form.db.mode === 'existing') {
        db = {
          database: form.db.database, user: form.db.user,
          password: form.db.password || null,
          host: form.db.host, port: form.db.port,
        };
      }

      const r = await post('deploy', {
        profile: ST.profile, projectPath: ST.deploy.path,
        domain: form.domain, laravel: form.laravel, db,
        confirm: confirmIn ? confirmIn.value : undefined,
      });
      renderJob(out, r.jobId);
    } catch (err) { go.disabled = false; showError(box, err); }
  });

  box.append(el('div', { class: 'row' }, go,
    el('button', { onclick: () => clear(out) }, '← ' + s('back'))));
  out.append(box);
}

function suggest(domain, apps) {
  const base = (domain.split('.')[0] || 'app').replace(/[^a-z0-9]/gi, '');
  let c = base + 'next', n = 2;
  while (apps.some((a) => a.path === c)) { c = base + 'next' + n; n++; }
  return c;
}

/* ------------------------------------------------------------------- job */
function renderJob(out, jobId, onDone) {
  clear(out);
  const log = el('div', { class: 'log' });
  const head = el('div', { class: 'row', style: 'margin-bottom:10px' }, el('strong', {}, s('working')));
  const bar = el('progress', { class: 'hide' });
  out.append(el('div', { class: 'card', style: 'margin:16px 0 0' }, head, bar, log));

  const line = (cls, text) => {
    log.append(el('div', { class: cls }, text));
    log.scrollTop = log.scrollHeight;
  };

  // EventSource özel başlık gönderemez; yalnızca bu okuma ucu için jetonu
  // sorguyla taşıyoruz (sunucu tarafında da böyle bekleniyor).
  const es = new EventSource('/api/jobs/' + jobId + '/events?t=' + encodeURIComponent(TOKEN));
  es.onerror = () => { /* sunucu kapanınca sessizce biter */ };
  es.onmessage = (m) => {
    const e = JSON.parse(m.data);
    if (e.type === 'progress') {
      bar.classList.remove('hide');
      bar.max = e.total || 0; bar.value = e.sent || 0;
      head.textContent = bytes(e.sent) + ' / ' + bytes(e.total);
      return;
    }
    if (e.type === 'step') {
      // Paket boyutu ham bayt olarak geliyor; biçimlendirme arayüzün işi.
      const text = e.key === 'deploy.packed'
        ? e.text.replace(String(e.params.size), bytes(e.params.size))
        : e.text;
      line('s', '▸ ' + text);
    }
    else if (e.type === 'warn') line('w', '! ' + e.text);
    else if (e.type === 'info') line('', '  ' + e.text);
    else if (e.type === 'remote') line('', '  ' + e.text + (e.pct ? ' (' + e.pct + '%)' : ''));
    else if (e.type === 'output') line('', e.text.trimEnd());
    else if (e.type === 'done') {
      line('d', '✓ ' + s('live'));
      clear(head); head.append(el('span', { class: 'pill ok' }, s('live')));
      es.close();
      api('jobs/' + jobId).then((j) => {
        if (j.result?.url) {
          head.append(el('a', { href: j.result.url, target: '_blank', rel: 'noreferrer' }, j.result.url));
        }
        /*
         * İndirme biten bir işte dosyanın NEREDE olduğunu söylemek yetmiyor;
         * kullanıcı onu bulmak istiyor. Düğme dosyayı açmıyor, klasörde
         * SEÇİLİ gösteriyor — bir .sql.gz dosyasını açmak istediği şey değil.
         */
        if (j.result?.path) {
          line('d', '✓ ' + s('downloadedTo').replace('{path}', j.result.path));
          const reveal = el('button', {}, '📂 ' + s('revealInFinder'));
          reveal.addEventListener('click', async () => {
            try { await post('reveal', { path: j.result.path }); }
            catch (err) { line('e', '! ' + err.message); }
          });
          head.append(reveal);
        }
        ST.overview = null;
        if (onDone) setTimeout(onDone, 1200);
      });
    } else if (e.type === 'failed') {
      line('e', '✗ ' + (e.text || s('failed')));
      clear(head); head.append(el('span', { class: 'pill bad' }, s('failed')));
      es.close();
    }
  };
}

function fmtStamp(x) {
  const m = String(x).match(/^(\d{4})(\d{2})(\d{2})(?:-(\d{2})(\d{2})(\d{2}))?$/);
  return m ? m[3] + '.' + m[2] + '.' + m[1] + (m[4] ? ' ' + m[4] + ':' + m[5] : '') : x;
}
