  const preview = el('div', { class: 'muted mono', style: 'margin-top:6px;min-height:18px' }, '');
  const createOut = el('div', {});
  const refreshPreview = () => {
    const v = nameIn.value.trim();
    preview.textContent = v ? s('willBe') + ': ' + withPrefix(d.restrictions.prefix, v) : '';
  };
  nameIn.addEventListener('input', refreshPreview);

  const createBtn = el('button', { class: 'primary', style: 'margin-top:12px' }, s('create'));
  const doCreate = async () => {
    if (!nameIn.value.trim()) return;
    createBtn.disabled = true;
    clear(createOut);
    try {
      const r = await post('db-create', { profile: ST.profile, name: nameIn.value.trim() });
      nameIn.value = '';
      refreshPreview();
      await renderDbResult(createOut, r);
    } catch (err) { showError(createOut, err); }
    finally { createBtn.disabled = false; }
  };
  createBtn.addEventListener('click', doCreate);
  nameIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') doCreate(); });

  root.append(el('div', { class: 'card' },
    el('h2', {}, s('newDb')),
    el('p', { class: 'sub' }, s('newDbNote')),
    el('label', {}, s('dbNameLabel')), nameIn,
    preview,
    el('div', { class: 'muted', style: 'font-size:12px;margin-top:4px' }, s('dbNameHint')),
    createBtn,
    createOut));

  /* --- veritabanları --- */
  const dropOut = el('div', {});
  root.append(el('div', { class: 'card' },
    el('h2', {}, s('dbs')),
    d.databases.length === 0 ? el('p', { class: 'sub' }, s('noDbs')) :
      el('table', {},
        el('thead', {}, el('tr', {}, el('th', {}, s('database')), el('th', {}, s('size')),
          el('th', {}, s('dbUsers')), el('th', {}, s('actions')))),
        el('tbody', {}, ...d.databases.map((db) => el('tr', {},
          el('td', { class: 'mono' }, db.name),
          el('td', { class: 'muted' }, bytes(db.size)),
          el('td', { class: 'muted mono' }, db.users.join(', ') || s('none')),
          el('td', {}, el('div', { class: 'row' },
            pma(pmaFor(db.name), 'phpMyAdmin'),
            el('button', { title: s('backupDownloadSub'), onclick: async (e) => {
              e.target.disabled = true;
              clear(dropOut);
              try {
                const r = await post('db-backup', { profile: ST.profile, database: db.name });
                renderJob(dropOut, r.jobId);
              } catch (err) { showError(dropOut, err); }
              e.target.disabled = false;
            } }, '⬇ ' + s('backupDownload')),
            el('button', { class: 'danger', onclick: () => askDrop(dropOut, 'db-delete', 'database', db.name, reload) }, s('del')))))))),
    dropOut));

  /* --- MySQL kullanıcıları --- */
  const userOut = el('div', {});
  root.append(el('div', { class: 'card' },
    el('h2', {}, s('dbUsers')),
    d.users.length === 0 ? el('p', { class: 'sub' }, s('noDbUsers')) :
      el('table', {},
        el('tbody', {}, ...d.users.map((u) => el('tr', {},
          el('td', { class: 'mono' }, u.name),
          // cPanel bu listeyi list_users'ta veriyor; boş dönen eski sürümlerde
          // veritabanı listesinden geriye doğru türetiyoruz.
          el('td', { class: 'muted mono' },
            (u.databases || []).join(', ') ||
              d.databases.filter((db) => db.users.includes(u.name)).map((db) => db.name).join(', ') ||
              s('none')),
          el('td', { style: 'text-align:right' }, el('div', { class: 'row', style: 'justify-content:flex-end' },
            el('button', { onclick: async (e) => {
              e.target.disabled = true;
              clear(userOut);
              try {
                const r = await post('db-password', { profile: ST.profile, user: u.name });
                userOut.append(el('div', { class: 'card', style: 'margin:16px 0 0' },
                  el('div', { class: 'row' },
                    el('code', { style: 'flex:1;word-break:break-all' }, r.password), copyBtn(r.password)),
                  el('div', { class: 'msg warn', style: 'margin-top:12px' }, s('passOnce'))));
              } catch (err) { showError(userOut, err); }
              finally { e.target.disabled = false; }
            } }, s('newPassword')),
            el('button', { class: 'danger', onclick: () => askDrop(userOut, 'db-user-delete', 'user', u.name, reload) }, s('del')))))))),
    userOut));

  /* --- sunucudaki .env --- */
  await envCard(root).catch(() => {});
}

/**
 * Yıkıcı işlem: adı BİREBİR yazmadan olmaz.
 *
 * Veritabanı silmenin yedeği yok — klasör silmekten daha geri alınamaz bir iş.
 * Onay sunucuda da denetleniyor; bu kutu yalnızca kullanıcı içindir.
 */
function askDrop(out, route, field, name, done) {
  clear(out);
  const input = el('input', { placeholder: name });
  const go = el('button', { class: 'danger', style: 'margin-top:12px' }, s('del'));
  go.addEventListener('click', async () => {
    go.disabled = true;
    try {
      await post(route, { profile: ST.profile, [field]: name, confirm: input.value });
      done();
    } catch (err) { go.disabled = false; showError(out, err); }
  });
  out.append(el('div', { class: 'card', style: 'margin:16px 0 0' },
    el('div', { class: 'msg warn' }, s('dropWarn').replace('{name}', name)),
    el('label', {}, s('typeToConfirm')), input,
    el('div', { class: 'row', style: 'margin-top:12px' },
      go, el('button', { onclick: () => clear(out) }, s('cancel')))));
  setTimeout(() => input.focus(), 30);
}

/**
 * Kurulum sonucu.
 *
 * Şifre BİR KEZ gösteriliyor — cPanel de bizde de saklanmıyor. Bu yüzden aynı
 * ekranda hem kopyalama hem de doğrudan `.env` dosyasına yazma var: kullanıcı
 * bu kartı kapattığında bağlantı dizesi ya kaydedilmiş olmalı ya da yeniden
 * üretilmesi gerekecek.
 */
async function renderDbResult(out, r) {
  clear(out);
  const card = el('div', { class: 'card', style: 'margin:16px 0 0' },
    el('div', { class: 'msg info' }, s('ready') + ': ' + r.database),
    r.dbExisted ? el('div', { class: 'msg warn' }, s('dbExistedNote')) : null,
    r.userExisted ? el('div', { class: 'msg warn' }, s('userExistedNote')) : null,
    el('dl', { class: 'kv' },
      el('dt', {}, s('database')), el('dd', { class: 'mono' }, r.database),
      el('dt', {}, s('dbUser')), el('dd', { class: 'mono' }, r.user),
      r.password ? el('dt', {}, s('dbPassword')) : null,
      r.password ? el('dd', { class: 'mono' }, r.password) : null));
  out.append(card);

  if (!r.url) return;
  card.append(
    el('label', {}, 'DATABASE_URL'),
    el('div', { class: 'row' },
      el('code', { style: 'flex:1;word-break:break-all' }, r.url), copyBtn(r.url)),
    el('div', { class: 'msg warn', style: 'margin-top:12px' }, s('passOnce')));

  /* Bağlantı dizesini uygulamaya taşı — asıl işi bitiren adım bu. */
  const msg = el('div', {});
  const apps = await appsForEnv().catch(() => []);
  const sel = el('select', { style: 'width:auto;min-width:200px' },
    el('option', { value: '' }, s('pickApp')),
    ...apps.map((a) => el('option', { value: a.path }, a.name + ' · ~/' + a.path)));

  const write = async (btn, fn, label) => {
    btn.disabled = true;
    clear(msg);
    try {
      await fn();
      msg.append(el('div', { class: 'msg info' }, s('envWritten').replace('{file}', label())));
    } catch (err) { showError(msg, err); }
    finally { btn.disabled = false; }
  };

  const serverBtn = el('button', { class: 'primary' }, s('writeEnv'));
  serverBtn.addEventListener('click', () => {
    if (!sel.value) return;
    write(serverBtn,
      () => post('env', { profile: ST.profile, appRoot: sel.value, file: '.env',
        entries: { DATABASE_URL: r.url } }),
      () => '~/' + sel.value + '/.env');
  });

  const row = el('div', { class: 'row', style: 'margin-top:12px' }, sel, serverBtn);
  if (ST.deploy.path) {
    const localBtn = el('button', {}, s('writeLocalEnv'));
    localBtn.addEventListener('click', () => write(localBtn,
      () => post('env-local', { projectPath: ST.deploy.path, file: '.env.local',
        entries: { DATABASE_URL: r.url } }),
      () => ST.deploy.path + '/.env.local'));
    row.append(localBtn);
  }
  card.append(row, msg);
}

/**
 * Sunucudaki ortam dosyası.
 *
 * Değerler MASKELİ geliyor; "Göster" ayrı bir istek. Ekran paylaşımında bir
 * `DATABASE_URL`'in düz görünmesi, onu paylaşmakla aynı şey.
 */
async function envCard(root) {
  const apps = await appsForEnv();
  if (!apps.length) return;

  const appSel = el('select', { style: 'width:auto;min-width:180px' },
    ...apps.map((a) => el('option', { value: a.path }, a.name)));
  const fileSel = el('select', { style: 'width:auto' },
    ...['.env', '.env.production', '.env.local'].map((f) => el('option', { value: f }, f)));
  const body = el('div', {});
  let reveal = false;

  const load = async () => {
    clear(body);
    body.append(el('p', { class: 'sub' }, s('working')));
    let r;
    try {
      r = await api('env?profile=' + encodeURIComponent(ST.profile) +
        '&appRoot=' + encodeURIComponent(appSel.value) +
        '&file=' + encodeURIComponent(fileSel.value) + (reveal ? '&reveal=1' : ''));
    } catch (err) { clear(body); return showError(body, err); }
    clear(body);

    if (!r.exists && !r.entries.length) body.append(el('p', { class: 'sub' }, s('noEnv')));
    else body.append(el('table', {},
      el('thead', {}, el('tr', {}, el('th', {}, s('key')), el('th', {}, s('value')), el('th', {}))),
      el('tbody', {}, ...r.entries.map((e) => el('tr', {},
        el('td', { class: 'mono' }, e.key),
        el('td', { class: 'mono muted', style: 'word-break:break-all' }, e.value),
        el('td', { style: 'text-align:right' },
          el('button', { class: 'link', onclick: async (ev) => {
            ev.target.disabled = true;
            try { await post('env', { profile: ST.profile, appRoot: appSel.value, file: fileSel.value, remove: e.key }); await load(); }
            catch (err) { ev.target.disabled = false; showError(body, err); }
          } }, s('del'))))))));

    const k = el('input', { placeholder: s('key'), style: 'max-width:220px' });
    const v = el('input', { placeholder: s('value') });
    const add = el('button', {}, s('addVar'));
    add.addEventListener('click', async () => {
      if (!k.value.trim()) return;
      add.disabled = true;
      try {
        await post('env', { profile: ST.profile, appRoot: appSel.value, file: fileSel.value,
          entries: { [k.value.trim()]: v.value } });
        await load();
      } catch (err) { add.disabled = false; showError(body, err); }
    });
    body.append(el('div', { class: 'row', style: 'margin-top:12px' }, k, v, add,
      el('button', { onclick: () => { reveal = !reveal; load(); } }, reveal ? s('hide') : s('reveal'))));
  };

  appSel.addEventListener('change', load);
  fileSel.addEventListener('change', load);

  root.append(el('div', { class: 'card' },
    el('div', { class: 'row' },
      el('h2', { style: 'flex:1' }, s('envTitle')), appSel, fileSel),
    el('p', { class: 'sub' }, s('envNote')),
    body));
  await load();
}

/**
 * Hesap DÜZENLEME.
 *
 * Eskiden yoktu: token iptal edildiyse, sunucu adı ya da kullanıcı adı
 * değiştiyse tek çare hesabı silip yeniden eklemekti — ve bu, sunucuda öksüz
 * bir tam yetki token'ı bırakıyordu.
 *
 * Şifre alanı BOŞ bırakılabilir: yalnızca doldurulduğunda yeni token üretilir.
 */
function renderEditProfile(out, p, { focusPassword = false } = {}) {
  clear(out);
  const host = el('input', { value: p.host });
  const port = el('input', { type: 'number', value: String(p.port) });
  const user = el('input', { value: p.user });
  const pass = el('input', { type: 'password' });
  const save = el('input', { type: 'checkbox', style: 'width:auto' });
  save.checked = Boolean(p.hasPassword);
  const msg = el('div', {});
  const go = el('button', { class: 'primary', style: 'margin-top:14px' }, s('save'));

  go.addEventListener('click', async () => {
    go.disabled = true;
    clear(msg);
    try {
      const r = await api('profiles/' + encodeURIComponent(p.name), {
        method: 'PATCH',
        body: JSON.stringify({
          host: host.value, port: Number(port.value) || 2083, user: user.value,
          password: pass.value || undefined,
          // Kutu işaretliyse ama yeni şifre girilmediyse, kayıtlı şifre olduğu
          // gibi kalır; kutu KALDIRILDIYSA kayıtlı şifre silinir.
          savePassword: save.checked,
        }),
      });
      ST.profiles = r.profiles;
      if (ST.profile === p.name) ST.profile = r.profiles.find((x) => x.host === host.value)?.name ?? ST.profile;
      ST.overview = null;
      renderMain();
    } catch (err) { go.disabled = false; showError(msg, err); }
  });

  out.append(el('div', { class: 'card', style: 'margin:12px 0' },
    el('div', { class: 'sec' }, el('h2', {}, s('editAccount')), el('p', {}, s('editAccountHint'))),
    el('div', { class: 'grid2' },
      el('div', {}, el('label', {}, s('host')), host),
      el('div', {}, el('label', {}, s('port')), port)),
    el('label', {}, s('user')), user,
    el('label', {}, s('newCpanelPassword')), pass,
    el('p', { class: 'help' }, s('newCpanelPasswordHint')),
    el('div', { class: 'row', style: 'margin-top:12px' },
      el('label', { style: 'margin:0;text-transform:none;font-size:13px;color:var(--fg)' },
        save, ' ' + s('storePassword'))),
    el('p', { class: 'help', style: 'margin-left:22px' }, s('storePasswordHint')),
    el('div', { class: 'row' }, go, el('button', { onclick: () => clear(out) }, s('cancel'))),
    msg));

  setTimeout(() => (focusPassword ? pass : host).focus(), 40);
}

/**
 * Hesap ekleme formu — TEK bir yerde.
 *
 * Hem karşılama ekranı hem Ayarlar sekmesi bunu kullanıyor. İki kopya
 * tutmak, birinde düzeltilen bir davranışın diğerinde kalması demekti.
 */
function renderAddProfile(root, { autofocus = false, askMaster = false, onDone = null } = {}) {
  const host = el('input', { placeholder: 'sunucu.example.com' });
  const user = el('input', { placeholder: 'cpaneluser' });
  const port = el('input', { type: 'number', value: '2083' });
  const pass = el('input', { type: 'password' });
  const master = el('input', { type: 'password' });
  // Varsayılan AÇIK: kullanıcı tek tıkla phpMyAdmin/Dosya Yöneticisi bekliyor.
  // Kapatmak tek tık, ve kapatınca bu ekranlar cPanel girişine yönlendiriyor.
  const savePass = el('input', { type: 'checkbox', style: 'width:auto' });
  savePass.checked = true;
  const out = el('div', {});
  const btn = el('button', { class: 'primary', style: 'margin-top:16px' }, s('add'));

  const submit = async () => {
    btn.disabled = true;
    clear(out);
    try {
      /*
       * Ana şifre YALNIZCA ilk hesapta soruluyor: kasa henüz yok, kurulması
       * gerekiyor. Sonrakilerde kasa zaten açık ve TEK — her hesap için ayrı
       * şifre istemek "şifrem global olsun" beklentisinin tam tersiydi.
       */
      const r = await post('profiles', {
        host: host.value, user: user.value, port: Number(port.value) || 2083,
        password: pass.value, savePassword: savePass.checked,
        master: askMaster ? master.value : undefined });
      ST.profiles = r.profiles;
      if (!ST.profile) ST.profile = r.profiles[0]?.name ?? null;
      pass.value = '';
      ST.overview = null;
      (onDone ?? renderMain)();
    } catch (err) { showError(out, err); }
    btn.disabled = false;
  };
  btn.addEventListener('click', submit);
  for (const input of [host, user, pass, master]) {
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
  }

  root.append(el('div', { class: 'card' },
    el('div', { class: 'sec' },
      el('h2', {}, s('addProfile')),
      el('p', {}, s('passwordNote'))),
    el('div', { class: 'grid2' },
      el('div', {}, el('label', {}, s('host')), host,
        el('p', { class: 'help' }, 'srv12.example.com · sunucu.firmaniz.com')),
      el('div', {}, el('label', {}, s('port')), port,
        el('p', { class: 'help' }, '2083'))),
    el('label', {}, s('user')), user,
    el('label', {}, s('password')), pass,
    el('div', { class: 'row', style: 'margin-top:10px' },
      el('label', { style: 'margin:0;text-transform:none;font-size:13px;color:var(--fg)' },
        savePass, ' ' + s('storePassword'))),
    el('p', { class: 'help', style: 'margin-left:22px' }, s('storePasswordHint')),
    askMaster ? el('label', {}, s('masterNew')) : null,
    askMaster ? master : null,
    askMaster ? el('p', { class: 'help' }, s('masterNewHelp')) : null,
    btn, out));

  if (autofocus) setTimeout(() => host.focus(), 40);
}

/* ------------------------------------------------------------- settings */
async function viewSettings(root) {
  clear(root);

  /* --- hesaplar --- */
  const card = el('div', { class: 'card' }, el('h2', {}, s('profiles')));
  if (!ST.profiles.length) {
    card.append(el('p', { class: 'sub' }, s('noProfilesYet')));
  } else {
    const removeProfileRow = (p) => {
      const btn = el('button', {}, s('remove'));
      btn.addEventListener('click', async () => {
        if (!confirm(s('removeConfirm').replace('{name}', p.name))) return;
        btn.disabled = true;
        try {
          const r = await api('profiles/' + encodeURIComponent(p.name), { method: 'DELETE' });
          ST.profiles = r.profiles;
          if (ST.profile === p.name) ST.profile = r.profiles[0]?.name ?? null;
          ST.overview = null;
          renderMain();
        } catch (err) {
          btn.disabled = false;
          alert(err.message);
        }
      });
      const editBtn = el('button', {}, s('edit'));
      const testBtn = el('button', {}, s('testConn'));
      const out = el('div', {});

      editBtn.addEventListener('click', () => renderEditProfile(out, p));
      testBtn.addEventListener('click', async () => {
        testBtn.disabled = true;
        clear(out);
        try {
          const r = await post('profiles/' + encodeURIComponent(p.name) + '/test');
          out.append(el('div', { class: 'msg ' + (r.ok ? 'info' : 'err') },
            r.ok
              ? el('span', {}, '✓ ' + s('connOk').replace('{user}', r.user)
                  + (r.domain ? ' · ' + r.domain : ''))
              : el('span', {}, '✕ ' + s('connBad') + ' — ' + r.error)));
          if (!r.ok) renderEditProfile(out, p, { focusPassword: true });
        } catch (err) { showError(out, err); }
        testBtn.disabled = false;
      });

      return el('tr', {},
        el('td', {},
          el('div', { class: 'mono' }, p.user + '@' + p.host + ':' + p.port),
          el('div', { class: 'muted', style: 'font-size:11.5px' },
            (p.tokenName || s('none')),
            p.hasPassword ? el('span', { class: 'pill ok', style: 'margin-left:8px' }, '⚡ ' + s('autoLoginOn')) : null),
          out),
        el('td', { style: 'text-align:right;white-space:nowrap' },
          el('div', { class: 'row', style: 'justify-content:flex-end' }, testBtn, editBtn, btn)));
    };
    card.append(el('table', {}, el('tbody', {}, ...ST.profiles.map(removeProfileRow))));
  }
  root.append(card);

  /* --- cPanel şifresi --- */
  /*
   * Sunucudaki hesabın şifresi. cPanel ESKİ ŞİFREYİ istiyor ve bu iyi:
   * kasası açık bir arayüzün, kullanıcının onayı olmadan cPanel şifresini
   * değiştirebilmesi doğru olmazdı.
   */
  if (ST.profile) {
    const oldP = el('input', { type: 'password' });
    const newP = el('input', { type: 'password' });
    const newP2 = el('input', { type: 'password' });
    const pwOut = el('div', {});
    const pwBtn = el('button', { class: 'primary', style: 'margin-top:14px' }, s('changePassword'));

    pwBtn.addEventListener('click', async () => {
      clear(pwOut);
      if (newP.value !== newP2.value) {
        return showError(pwOut, new Error(s('passwordMismatch')));
      }
      pwBtn.disabled = true;
      try {
        await post('account-password', {
          profile: ST.profile, oldPassword: oldP.value, newPassword: newP.value });
        oldP.value = newP.value = newP2.value = '';
        pwOut.append(el('div', { class: 'msg info' }, s('passwordChanged')));
        // Kasadaki kopya sunucuda güncellendi; profil listesini tazeliyoruz.
        const st = await api('status');
        ST.profiles = st.profiles;
      } catch (err) { showError(pwOut, err); }
      pwBtn.disabled = false;
    });

    root.append(el('div', { class: 'card' },
      el('div', { class: 'sec' },
        el('h2', {}, s('changePassword')),
        el('p', {}, s('changePasswordSub'))),
      el('label', {}, s('currentPassword')), oldP,
      el('div', { class: 'grid2' },
        el('div', {}, el('label', {}, s('newPassword')), newP),
        el('div', {}, el('label', {}, s('newPasswordAgain')), newP2)),
      pwBtn, pwOut));
  }

  /* --- hesap ekle --- */
  renderAddProfile(root, {});

  /* --- tercihler --- */
  let prefs = {};
  try { prefs = (await api('preferences')).preferences; } catch { /* yok say */ }

  const uiSel = el('select', {},
    el('option', { value: 'terminal', selected: prefs.ui === 'terminal' }, s('uiTerminal')),
    el('option', { value: 'web', selected: prefs.ui === 'web' }, s('uiWeb')));
  const langSel = el('select', {},
    el('option', { value: '', selected: !prefs.lang }, s('auto')),
    el('option', { value: 'tr', selected: prefs.lang === 'tr' }, 'Türkçe'),
    el('option', { value: 'en', selected: prefs.lang === 'en' }, 'English'));
  const prefOut = el('div', {});

  const savePrefs = async () => {
    try {
      const r = await post('preferences', { ui: uiSel.value, lang: langSel.value || null });
      LANG = r.lang || LANG;
      clear(prefOut); prefOut.append(el('div', { class: 'msg info' }, s('saved')));
      renderMain();
    } catch (err) { showError(prefOut, err); }
  };
  uiSel.addEventListener('change', savePrefs);
  langSel.addEventListener('change', savePrefs);

  root.append(el('div', { class: 'card' },
    el('label', {}, s('uiMode')), uiSel,
    el('label', {}, s('language')), langSel,
    prefOut));
}

/* --------------------------------------------------------------- e-posta */
/**
 * E-posta hesapları.
 *
 * Bağlantı ayarları SUNUCUDAN okunuyor, varsayılmıyor: hostlar sunucu adını
 * ve portları değiştirebiliyor ve yanlış bir "mail.domain.com:465" kullanıcıyı
 * saatlerce uğraştırıyor.
 */
async function viewMail(root) {
  clear(root);
  root.append(el('div', { class: 'card' }, s('working')));
  let d;
  try { d = await api('mail/' + encodeURIComponent(ST.profile)); }
  catch (err) { clear(root); return showError(root, err); }
  clear(root);

  const reload = () => { const r = root; clear(r); viewMail(r); };
  const out = el('div', {});
  const listCard = el('div', { class: 'card' });

  function renderList() {
    clear(listCard);
    listCard.append(el('div', { class: 'sec' },
      el('h2', {}, s('mailAccounts')), el('p', {}, s('mailAccountsSub'))));

    if (!d.accounts.length) {
      listCard.append(el('div', { class: 'empty' },
        el('div', { class: 'ico' }, '✉️'),
        el('h3', {}, s('noMail')),
        el('p', {}, s('noMailBody'))));
      return;
    }

    listCard.append(el('table', {},
      el('thead', {}, el('tr', {}, el('th', {}, s('address')), el('th', {}, s('used')),
        el('th', {}, s('quota')), el('th', {}, s('actions')))),
      el('tbody', {}, ...d.accounts.map((a) => el('tr', {},
        el('td', { class: 'mono' }, a.email),
        el('td', { class: 'muted' }, bytes(a.used)),
        el('td', { class: 'muted' }, a.quota === null ? s('quotaUnlimited') : a.quota + ' MB'),
        el('td', {}, el('div', { class: 'row' },
          el('button', { onclick: () => showMailSettings(out, a.email) }, s('mailSettings')),
          el('button', { onclick: async (e) => {
            e.target.disabled = true;
            clear(out);
            try {
              const r = await post('mail-password', { profile: ST.profile, email: a.email });
              showSecret(out, [[s('address'), a.email]], r.password);
            } catch (err) { showError(out, err); }
            e.target.disabled = false;
          } }, s('newPassword')),
          el('button', {
            class: 'danger',
            onclick: () => askTypedDelete(out, {
              route: 'mail-delete', field: 'email', value: a.email,
              warn: s('mailDeleteWarn').replace('{name}', a.email), done: reload,
            }),
          }, s('del')))))))));
  }

  const local = el('input', { placeholder: 'info' });
  const domSel = el('select', { style: 'width:auto;min-width:180px' },
    ...d.domains.map((x) => el('option', { value: x }, '@' + x)));
  const quota = el('input', { type: 'number', value: '0', style: 'max-width:160px' });
  const createOut = el('div', {});
  const createBtn = el('button', { class: 'primary', style: 'margin-top:14px' }, s('create'));

  createBtn.addEventListener('click', async () => {
    if (!local.value.trim() || !domSel.value) return;
    createBtn.disabled = true;
    clear(createOut);
    try {
      const r = await post('mail-create', {
        profile: ST.profile, user: local.value.trim(), domain: domSel.value,
        quota: Number(quota.value) || 0,
      });
      local.value = '';
      showSecret(createOut, [[s('address'), r.email]], r.password);
      try { d = await api('mail/' + encodeURIComponent(ST.profile)); } catch (e) { /* liste eski kalsın */ }
      renderList();
    } catch (err) { showError(createOut, err); }
    createBtn.disabled = false;
  });

  root.append(el('div', { class: 'card' },
    el('div', { class: 'sec' }, el('h2', {}, s('newMail'))),
    d.domains.length
      ? el('div', {},
          el('label', {}, s('address')),
          el('div', { class: 'row' }, el('div', { style: 'flex:1' }, local), domSel),
          el('label', {}, s('quota')), quota,
          el('p', { class: 'help' }, '0 = ' + s('quotaUnlimited')),
          createBtn)
      : el('div', { class: 'msg warn' }, s('noMailDomains')),
    createOut));

  renderList();
  root.append(listCard, out);
}

/** Posta istemcisi ayarları — sunucunun söylediği değerler. */
async function showMailSettings(out, address) {
  clear(out);
  out.append(el('div', { class: 'card', style: 'margin:16px 0 0' }, s('working')));
  let r;
  try {
    r = await api('mail-settings?profile=' + encodeURIComponent(ST.profile) +
      '&email=' + encodeURIComponent(address));
  } catch (err) { clear(out); return showError(out, err); }
  clear(out);

  const block = (title, cfg) => el('div', {},
    el('label', {}, title),
    el('dl', { class: 'kv' },
      el('dt', {}, s('server')), el('dd', { class: 'mono' }, cfg.host || s('none')),
      el('dt', {}, s('incoming')), el('dd', { class: 'mono' }, cfg.imap === null ? s('none') : cfg.imap),
      el('dt', {}, s('incomingPop')), el('dd', { class: 'mono' }, cfg.pop3 === null ? s('none') : cfg.pop3),
      el('dt', {}, s('outgoing')), el('dd', { class: 'mono' }, cfg.smtp === null ? s('none') : cfg.smtp)));

  out.append(el('div', { class: 'card', style: 'margin:16px 0 0' },
    el('div', { class: 'sec' },
      el('h2', {}, s('mailSettings') + ' — ' + address),
      el('p', {}, s('mailSettingsSub'))),
    el('dl', { class: 'kv' },
      el('dt', {}, s('username')), el('dd', { class: 'mono' }, r.username || address)),
    el('div', { class: 'grid2', style: 'margin-top:10px' },
      block(s('secure'), r.secure), block(s('insecure'), r.plain)),
    el('div', { class: 'row', style: 'margin-top:14px' },
      el('button', { onclick: () => clear(out) }, s('close')))));
}

/* ------------------------------------------------------------------- FTP */
async function viewFtp(root) {
  clear(root);
  root.append(el('div', { class: 'card' }, s('working')));
  let d;
  try { d = await api('ftp/' + encodeURIComponent(ST.profile)); }
  catch (err) { clear(root); return showError(root, err); }
  clear(root);

  const reload = () => { const r = root; clear(r); viewFtp(r); };
  const out = el('div', {});

  const user = el('input', { placeholder: 'deploy' });
  const dir = el('input', { placeholder: 'public_html' });
  const quota = el('input', { type: 'number', value: '0', style: 'max-width:160px' });
  const createOut = el('div', {});
  const createBtn = el('button', { class: 'primary', style: 'margin-top:14px' }, s('create'));

  createBtn.addEventListener('click', async () => {
    if (!user.value.trim()) return;
    createBtn.disabled = true;
    clear(createOut);
    try {
      const r = await post('ftp-create', {
        profile: ST.profile, user: user.value.trim(),
        dir: dir.value.trim(), quota: Number(quota.value) || 0,
      });
      showSecret(createOut, [
        [s('ftpLogin'), r.login],
        [s('server'), d.server.host + ':' + d.server.port],
      ], r.password);
    } catch (err) { showError(createOut, err); }
    createBtn.disabled = false;
  });

  root.append(el('div', { class: 'card' },
    el('div', { class: 'sec' },
      el('h2', {}, s('newFtp')),
      el('p', {}, s('server') + ': ' + (d.server.host || '?') + ':' + d.server.port)),
    d.server.enabled ? null : el('div', { class: 'msg warn' }, s('ftpDisabled')),
    el('label', {}, s('user')), user,
    el('label', {}, s('ftpDir')), dir,
    el('p', { class: 'help' }, s('ftpDirHelp')),
    el('label', {}, s('quota')), quota,
    el('p', { class: 'help' }, '0 = ' + s('quotaUnlimited')),
    createBtn, createOut));

  const listCard = el('div', { class: 'card' },
    el('div', { class: 'sec' }, el('h2', {}, s('ftpAccounts')), el('p', {}, s('ftpAccountsSub'))));

  if (!d.accounts.length) {
    listCard.append(el('div', { class: 'empty' },
      el('div', { class: 'ico' }, '📡'),
      el('h3', {}, s('noFtp')),
      el('p', {}, s('noFtpBody'))));
  } else {
    listCard.append(el('table', {},
      el('thead', {}, el('tr', {}, el('th', {}, s('ftpLogin')), el('th', {}, s('folder')),
        el('th', {}, s('quota')), el('th', {}, s('actions')))),
      el('tbody', {}, ...d.accounts.map((a) => el('tr', {},
        el('td', { class: 'mono' }, a.user),
        el('td', { class: 'muted mono' }, a.dir || '~'),
        el('td', { class: 'muted' }, a.quota === null ? s('quotaUnlimited') : a.quota + ' MB'),
        el('td', {}, el('div', { class: 'row' },
          el('button', { onclick: async (e) => {
            e.target.disabled = true;
            clear(out);
            try {
              const r = await post('ftp-password', { profile: ST.profile, user: a.user });
              showSecret(out, [[s('ftpLogin'), a.user]], r.password);
            } catch (err) { showError(out, err); }
            e.target.disabled = false;
          } }, s('newPassword')),
          // Ana FTP hesabı silinemez; cPanel de reddediyor.
          a.type === 'main' ? null : el('button', {
            class: 'danger',
            onclick: () => askTypedDelete(out, {
              route: 'ftp-delete', field: 'user', value: a.user,
              warn: s('ftpDeleteWarn').replace('{name}', a.user), done: reload,
            }),
          }, s('del')))))))));
  }
  root.append(listCard, out);
}

/* ------------------------------------------------------- ortak yardımcılar */

/**
 * Bir kez gösterilecek sır (şifre) kartı.
 *
 * cPanel de biz de bu şifreyi sonradan okuyamıyoruz; kullanıcı bu kartı
 * kapattığında ya kaydetmiş olmalı ya da yenisini üretmeli. Kopyalama
 * düğmesi bu yüzden burada.
 */
function showSecret(out, rows, password) {
  clear(out);
  const card = el('div', { class: 'card', style: 'margin:16px 0 0' },
    el('dl', { class: 'kv' }, ...rows.flatMap(function (pair) {
      return [el('dt', {}, pair[0]), el('dd', { class: 'mono' }, pair[1])];
    })));
  if (password) {
    card.append(
      el('label', {}, s('dbPassword')),
      el('div', { class: 'row' },
        el('code', { style: 'flex:1;word-break:break-all' }, password), copyBtn(password)),
      el('div', { class: 'msg warn', style: 'margin-top:12px' }, s('passOnce')));
  }
  card.append(el('div', { class: 'row', style: 'margin-top:12px' },
    el('button', { onclick: () => clear(out) }, s('close'))));
  out.append(card);
}

/** Adı birebir yazmadan silinmeyen her şey için ortak onay kutusu. */
function askTypedDelete(out, opts) {
  clear(out);
  const input = el('input', { placeholder: opts.value });
  const go = el('button', { class: 'danger', style: 'margin-top:12px' }, s('del'));
  go.addEventListener('click', async () => {
    go.disabled = true;
    try {
      const body = { profile: ST.profile, confirm: input.value };
      body[opts.field] = opts.value;
      await post(opts.route, body);
      opts.done();
    } catch (err) { go.disabled = false; showError(out, err); }
  });
  out.append(el('div', { class: 'card', style: 'margin:16px 0 0' },
    el('div', { class: 'msg warn' }, opts.warn),
    el('label', {}, s('typeToConfirm')), input,
    el('div', { class: 'row', style: 'margin-top:12px' },
      go, el('button', { onclick: () => clear(out) }, s('cancel')))));
  setTimeout(() => input.focus(), 30);
}

/* ----------------------------------------------------------------- logs */
async function viewLogs(root, { append = false } = {}) {
  if (!append) clear(root);
  const holder = el('div', {}, el('div', { class: 'card' }, s('working')));
  root.append(holder);
  const appRoot = ST.overview?.apps?.[0]?.path ?? '';
  let r;
  try {
    r = await api('logs?profile=' + encodeURIComponent(ST.profile) +
      (appRoot ? '&appRoot=' + encodeURIComponent(appRoot) : ''));
  } catch (err) { clear(holder); return showError(holder, err); }
  clear(holder);
  root = holder;

  root.append(el('div', { class: 'card' },
    el('div', { class: 'sec' }, el('h2', {}, s('logsSection'))),
    r.runs.length === 0 ? el('p', { class: 'sub' }, s('none')) :
      el('div', {}, ...r.runs.map((run) => el('div', { style: 'margin-bottom:14px' },
        el('div', { class: 'row' },
          el('span', { class: 'pill ' + (run.done ? (run.ok ? 'ok' : 'bad') : 'warn') },
            run.done ? (run.ok ? '✓' : '✗') : (run.progress ?? 0) + '%'),
          el('code', {}, run.step ?? '')),
        run.output ? el('div', { class: 'log', style: 'height:180px' }, String(run.output).slice(-4000)) : null)))));

  if (r.history?.length) {
    root.append(el('div', { class: 'card' },
      el('h2', {}, s('history')),
      el('table', {},
        el('thead', {}, el('tr', {}, el('th', {}, s('date')), el('th', {}, s('version')),
          el('th', {}, s('package')), el('th', {}, s('status')))),
        el('tbody', {}, ...r.history.slice(-15).reverse().map((h) => el('tr', {},
          el('td', { class: 'muted' }, new Date(h.date).toLocaleString()),
          el('td', { class: 'mono' }, h.version ?? ''),
          el('td', {}, (h.files ?? '') + ' ' + s('files') + ' · ' + bytes(h.size ?? 0)),
          el('td', {}, el('span', { class: 'pill ' + (h.ok === false ? 'bad' : 'ok') },
            h.ok === false ? '✗' : '✓'))))))));
  }
}

/* ------------------------------------------------------------ kalp atışı */
/*
 * Terminal, bu atışlar kesilince geri döner.
 *
 * `beforeunload` + `sendBeacon` yerine düzenli atış kullanıyoruz: beacon
 * sekme çöktüğünde, ağ koptuğunda veya tarayıcı onu düşürdüğünde hiç gelmez.
 * Atışın YOKLUĞU ise her durumda doğru sinyal.
 */
let beatTimer = null;
function startHeartbeat() {
  const beat = () => post('heartbeat').catch(() => {});
  beat();
  beatTimer = setInterval(beat, 4000);
  // Sekme arka plana alınınca tarayıcılar zamanlayıcıyı yavaşlatır; geri
  // gelince hemen bir atış gönderip gereksiz çıkışı önlüyoruz.
  document.addEventListener('visibilitychange', () => { if (!document.hidden) beat(); });
}
function stopHeartbeat() { if (beatTimer) clearInterval(beatTimer); beatTimer = null; }

startHeartbeat();
boot().catch((e) => { app.append(el('div', { class: 'msg err' }, e.message)); });
</script>
