/**
 * Sunucu terminali.
 *
 * Gerçek bir pty DEĞİL: komutlar cron ile başlatılan uzun ömürlü worker'a
 * dosya bırakılarak gönderiliyor (SSH yok, paylaşımlı hostingde olmadığı için).
 * Yani istek/yanıt — etkileşimli programlar (vim, top) burada çalışmaz, onlar
 * için cPanel'in kendi terminali var.
 *
 * `cd` sonraki komuta taşınıyor; dizin sunucu tarafında tutuluyor.
 */
function viewTerminal(root) {
  clear(root);
  if (!ST.profile) { root.append(el('div', { class: 'empty' }, s('pickAccount'))); return; }

  const out = el('div', { class: 'log', style: 'min-height:340px;max-height:56vh' });
  const promptLabel = el('span', { class: 'mono muted' }, '~');
  const input = el('input', {
    placeholder: s('tmCmd'), spellcheck: 'false', autocomplete: 'off',
    style: 'flex:1;font-family:ui-monospace,monospace',
  });
  const runBtn = el('button', { class: 'primary' }, s('tmRun'));
  const histBox = el('div', { class: 'row', style: 'margin-top:8px' });

  // İstemci tarafı geçmiş gezinme durumu (yukarı/aşağı ok).
  let history = [];
  let cursor = -1;

  const line = (text, cls) => {
    out.append(el('div', { class: cls || null }, text));
    out.scrollTop = out.scrollHeight;
  };

  const renderHistory = () => {
    clear(histBox);
    if (!history.length) return;
    histBox.append(el('span', { class: 'help' }, s('tmRecent')));
    for (const cmd of history) {
      histBox.append(el('button', {
        class: 'chip', title: cmd,
        onclick: () => { input.value = cmd; input.focus(); },
      }, cmd.length > 28 ? cmd.slice(0, 27) + '…' : cmd));
    }
  };

  /*
   * Hazır komutlar KOMUTU ÇALIŞTIRMIYOR, giriş satırına yazıyor.
   *
   * Tek tıkla `migrate` koşturmak, bu araçta daha önce şikâyet edilen
   * "kafasına göre karar alma" davranışının aynısı olurdu. Kullanıcı görüp
   * Enter'a basıyor.
   */
  const shortcuts = [
    ['optimize:clear', '"$PHP" artisan optimize:clear'],
    ['config:cache', '"$PHP" artisan config:cache'],
    ['migrate', '"$PHP" artisan migrate --force'],
    ['queue:restart', '"$PHP" artisan queue:restart'],
    ['storage:link', '"$PHP" artisan storage:link'],
    ['laravel.log', 'tail -n 50 storage/logs/laravel.log'],
    ['restart (Node)', 'touch tmp/restart.txt'],
    ['disk', 'du -sh * 2>/dev/null | sort -h | tail -20'],
  ];
  const shortcutBox = el('div', { class: 'row', style: 'margin-top:6px' },
    ...shortcuts.map(([label, cmd]) => el('button', {
      class: 'chip', title: cmd,
      onclick: () => { input.value = cmd; input.focus(); },
    }, label)));

  const setBusy = (busy) => { runBtn.disabled = busy; input.disabled = busy; };

  const run = async () => {
    const cmd = input.value.trim();
    if (!cmd) return;
    setBusy(true);
    line(promptLabel.textContent + ' $ ' + cmd, 's');
    input.value = '';
    cursor = -1;

    try {
      const r = await post('shell', { profile: ST.profile, command: cmd });
      await new Promise((resolve) => {
        const es = new EventSource('/api/jobs/' + r.jobId + '/events?t=' + TOKEN);
        es.onmessage = (ev) => {
          const e = JSON.parse(ev.data);
          if (e.type === 'output' && e.text) {
            for (const l of String(e.text).replace(/\n$/, '').split('\n')) line(l);
          } else if (e.type === 'remote' && e.text) {
            line(e.text, 'w');
          } else if (e.type === 'done') {
            const res = e.result || {};
            if (res.exitCode) line(s('tmExit').replace('{code}', res.exitCode), 'e');
            if (res.prompt) promptLabel.textContent = res.prompt;
            if (res.history) { history = res.history; renderHistory(); }
            es.close(); resolve();
          } else if (e.type === 'failed') {
            line((e.error && e.error.message) || 'error', 'e');
            if (e.error && e.error.hint) line(e.error.hint, 'e');
            es.close(); resolve();
          }
        };
        es.onerror = () => { es.close(); resolve(); };
      });
    } catch (err) {
      line(err.message, 'e');
      if (err.hint) line(err.hint, 'e');
    }
    setBusy(false);
    input.focus();
  };

  runBtn.addEventListener('click', run);
  input.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') { ev.preventDefault(); run(); return; }
    // Yukarı/aşağı: geçmişte gezinme — kabuk alışkanlığı.
    if (ev.key === 'ArrowUp' && history.length) {
      ev.preventDefault();
      cursor = Math.min(cursor + 1, history.length - 1);
      input.value = history[cursor] || '';
    } else if (ev.key === 'ArrowDown') {
      ev.preventDefault();
      cursor = Math.max(cursor - 1, -1);
      input.value = cursor === -1 ? '' : (history[cursor] || '');
    }
  });

  const resetBtn = el('button', {
    onclick: async () => {
      const r = await post('shell-reset', { profile: ST.profile });
      promptLabel.textContent = r.prompt;
      line(s('tmReset'), 'w');
    },
  }, s('tmHome'));

  root.append(el('div', { class: 'card' },
    el('div', { class: 'sec' }, el('h2', {}, s('terminal')), el('p', {}, s('tmSub'))),
    out,
    el('div', { class: 'row', style: 'margin-top:10px' }, promptLabel, input, runBtn),
    shortcutBox,
    histBox,
    el('div', { class: 'row', style: 'margin-top:14px' },
      resetBtn,
      el('a', {
        href: cpanelUrl('terminal', {}, null), target: '_blank', rel: 'noreferrer',
        class: 'button',
      }, s('tmCpanel'))),
    el('p', { class: 'help' }, s('tmNote'))));

  // Açılışta istem satırı ve geçmiş.
  api('shell-state?profile=' + encodeURIComponent(ST.profile)).then((r) => {
    promptLabel.textContent = r.prompt;
    history = r.history || [];
    renderHistory();
  }).catch(() => {});

  input.focus();
}


/**
 * DOSYA TARAYICISI — solda yerel, sağda sunucu.
 *
 * Çift tık iki panelde de aynı ada giriyor. Sunucuda o klasör yoksa
 * GİRMİYOR: kullanıcı boş bir panele bakıp "dosyalarım nerede" demek yerine
 * "önce gönder" uyarısı görüyor.
 */
function viewExplorer(root) {
  clear(root);
  if (!ST.profile) { root.append(el('div', { class: 'empty' }, s('pickAccount'))); return; }

  const st = ST.explorer || (ST.explorer = { local: null, remote: null });
  const out = el('div', {});

  const leftBox = el('div', {});
  const rightBox = el('div', {});
  const sel = { local: new Set(), remote: new Set() };

  const reloadBoth = () => { drawLocal(); drawRemote(); };

  /** Bir panelin liste gövdesi. */
  const pane = (side, data, onOpen) => {
    const box = el('div', { class: 'browse', style: 'max-height:46vh' });
    if (data.parent) {
      box.append(el('div', { onclick: () => onOpen(data.parent) }, '⬆ ..'));
    }
    for (const e of data.entries) {
      const cb = el('input', { type: 'checkbox', style: 'width:auto;margin:0 8px 0 0' });
      cb.checked = sel[side].has(e.name);
      cb.addEventListener('click', (ev) => {
        ev.stopPropagation();
        if (cb.checked) sel[side].add(e.name); else sel[side].delete(e.name);
      });
      const row = el('div', { style: 'display:flex;align-items:center;gap:2px' },
        cb,
        el('span', { style: 'flex:1' }, (e.type === 'dir' ? '📁 ' : '📄 ') + e.name),
        e.type === 'file' ? el('span', { class: 'help' }, bytes(e.size || 0)) : null);
      row.addEventListener('dblclick', () => {
        if (e.type === 'dir') twinOpen(side, e.name);
        else if (side === 'remote') openEditor(e.name);
      });
      box.append(row);
    }
    if (!data.entries.length) box.append(el('div', { class: 'help' }, s('fbEmpty')));
    return box;
  };

  /*
   * ÇİFT TIK — İKİ PANELİ BİRDEN.
   *
   * Kullanıcının istediği davranış bu: soldaki klasöre girince sağda da aynı
   * klasöre girsin. Sunucuda yoksa girmiyoruz ve sebebini söylüyoruz.
   */
  const twinOpen = async (side, name) => {
    const nextLocal = side === 'local' ? joinPath(st.local.path, name) : joinPath(st.local.path, name);
    const nextRemote = joinPath(st.remote.path, name);
    clear(out);

    if (side === 'local') {
      await loadLocal(nextLocal);
      const ok = st.remote.entries.some((e) => e.name === name && e.type === 'dir');
      if (ok) await loadRemote(nextRemote);
      else out.append(el('div', { class: 'msg warn' }, s('fbNoTwin').replace('{name}', name)));
    } else {
      await loadRemote(nextRemote);
      const ok = st.local.entries.some((e) => e.name === name && e.type === 'dir');
      if (ok) await loadLocal(nextLocal);
    }
    sel.local.clear(); sel.remote.clear();
    reloadBoth();
  };

  const loadLocal = async (p) => {
    st.local = await api('browse?files=1' + (p ? '&path=' + encodeURIComponent(p) : ''));
  };
  const loadRemote = async (p) => {
    st.remote = await api('remote-browse?profile=' + encodeURIComponent(ST.profile)
      + (p ? '&path=' + encodeURIComponent(p) : ''));
  };

  const drawLocal = () => {
    clear(leftBox);
    leftBox.append(
      el('div', { class: 'sec' }, el('h2', {}, s('fbLocal')), el('p', { class: 'mono help' }, st.local.path)),
      pane('local', st.local, async (p) => { await loadLocal(p); sel.local.clear(); drawLocal(); }),
      el('div', { class: 'row', style: 'margin-top:10px' },
        el('button', { class: 'primary', onclick: () => doTransfer('up') }, '→ ' + s('fbSend'))));
  };

  const drawRemote = () => {
    clear(rightBox);
    rightBox.append(
      el('div', { class: 'sec' }, el('h2', {}, s('fbRemote')), el('p', { class: 'mono help' }, st.remote.path)),
      pane('remote', st.remote, async (p) => { await loadRemote(p); sel.remote.clear(); drawRemote(); }),
      el('div', { class: 'row', style: 'margin-top:10px' },
        el('button', { class: 'primary', onclick: () => doTransfer('down') }, '← ' + s('fbGet')),
        el('button', { class: 'danger', onclick: doDelete }, s('remove'))));
  };

  /* --------------------------------------------------------------- işlemler */

  const doTransfer = async (direction) => {
    const up = direction === 'up';
    const items = [...(up ? sel.local : sel.remote)];
    clear(out);
    if (!items.length) { out.append(el('div', { class: 'msg warn' }, s('fbPick'))); return; }

    // ÖZET ÖNCE — kaç dosya, ne kadar, riskli bir şey var mı.
    let note = '';
    if (up) {
      const plan = await post('transfer-plan', { localDir: st.local.path, items });
      note = s('fbPlan').replace('{count}', plan.count).replace('{size}', bytes(plan.bytes));
      if (plan.dotenv.length) note += '\n⚠ ' + s('fbEnvWarn').replace('{list}', plan.dotenv.join(', '));
      if (plan.skipped.length) note += '\n' + s('fbSkip').replace('{list}', plan.skipped.join(', '));
    } else {
      note = s('fbGetPlan').replace('{count}', items.length).replace('{dir}', st.local.path);
    }

    if (!confirm(note + '\n\n' + (up ? s('fbOverwrite') : s('fbSure')))) return;

    const r = await post('transfer', {
      profile: ST.profile, direction,
      localDir: st.local.path, remoteDir: st.remote.path, items,
    });
    renderJob(out, r.jobId, async () => {
      sel.local.clear(); sel.remote.clear();
      await loadLocal(st.local.path); await loadRemote(st.remote.path);
      reloadBoth();
    });
  };

  const doDelete = async () => {
    const items = [...sel.remote];
    clear(out);
    if (items.length !== 1) { out.append(el('div', { class: 'msg warn' }, s('fbOne'))); return; }
    // Adını YAZARAK onay: silme geri alınamıyor.
    const typed = prompt(s('fbDelAsk').replace('{name}', items[0]));
    if (typed === null) return;
    try {
      await post('remote-delete', {
        profile: ST.profile, remoteDir: st.remote.path, items, confirm: typed,
      });
      sel.remote.clear();
      await loadRemote(st.remote.path);
      drawRemote();
      out.append(el('div', { class: 'msg ok' }, s('fbDeleted')));
    } catch (err) { showError(out, err); }
  };

  const openEditor = async (name) => {
    clear(out);
    try {
      const full = joinPath(st.remote.path, name);
      const r = await api('remote-file?profile=' + encodeURIComponent(ST.profile)
        + '&path=' + encodeURIComponent(full));
      const ta = el('textarea', {
        rows: '18', spellcheck: 'false',
        style: 'width:100%;font-family:ui-monospace,monospace;font-size:12px',
      });
      ta.value = r.content;
      const msg = el('div', {});
      const save = el('button', { class: 'primary' }, s('save'));
      save.addEventListener('click', async () => {
        save.disabled = true; clear(msg);
        try {
          await post('remote-file', {
            profile: ST.profile, path: full, content: ta.value, expectedHash: r.hash,
          });
          msg.append(el('div', { class: 'msg ok' }, s('fbSaved')));
        } catch (err) { showError(msg, err); }
        save.disabled = false;
      });
      out.append(el('div', { class: 'card' },
        el('div', { class: 'sec' }, el('h2', {}, '✎ ' + name), el('p', { class: 'mono help' }, full)),
        ta,
        el('div', { class: 'row', style: 'margin-top:10px' },
          save, el('button', { onclick: () => clear(out) }, s('cancel'))),
        msg));
    } catch (err) { showError(out, err); }
  };

  /* ------------------------------------------------------------------ kur */
  const grid = el('div', { class: 'grid2' }, leftBox, rightBox);
  root.append(el('div', { class: 'card' },
    el('p', { class: 'help' }, s('fbHelp')), grid), out);

  (async () => {
    try {
      if (!st.local) await loadLocal(null);
      if (!st.remote) await loadRemote(null);
      reloadBoth();
    } catch (err) { showError(root, err); }
  })();
}

/** İki yol parçasını birleştirir (hem yerel hem uzak; ikisi de / kullanıyor). */
function joinPath(base, name) {
  const b = String(base || '').replace(/\/+$/, '');
  return b + '/' + name;
}

/**
 * Laravel sitesi kartı.
 *
 * Node uygulamasından iki farkı var ve ikisi de PHP'nin doğasından:
 *   · Başlat/durdur/yeniden başlat YOK — ortada yönetilen bir süreç yok,
 *     isteği sunucunun kendi PHP işleyicisi karşılıyor.
 *   · Durum noktası yok; "çalışıyor mu" sorusunun karşılığı sitenin kendisi.
 */
function siteCard(site, jobOut, reload) {
  return el('div', { class: 'app' },
    el('div', { class: 'top' },
      el('span', { class: 'name' }, '🐘 ' + site.domain),
      el('a', { href: 'https://' + site.domain, target: '_blank', rel: 'noreferrer' }, s('open')),
      el('span', { class: 'pill' }, 'Laravel'),
      el('span', { class: 'pill ok' }, s('mine'))),

    el('div', { class: 'meta' },
      el('span', {}, s('folder') + ': ', el('b', {}, '~/' + site.appRoot)),
      site.ownerProject ? el('span', {}, s('linkedTo') + ': ', el('b', {}, site.ownerProject)) : null,
      site.version ? el('span', {}, s('version') + ': ', el('b', {}, site.version)) : null),

    el('div', { class: 'row' },
      el('button', {
        class: site.ownerProject ? 'primary' : '',
        title: site.ownerProject || s('noLink'),
        /*
         * ⚠ BAĞLI PROJE ÖNCE GELİR.
         *
         * İlk hâli `ST.deploy.path || site.ownerProject` yazıyordu: sihirbazda
         * seçili olan proje, sitenin bağlı olduğu projeyi SESSİZCE eziyordu.
         * Next.js projesi seçiliyken Laravel sitesinde "Güncelle"ye basmak,
         * sunucuya Next.js projesini Laravel'in belge kökü ile göndermek
         * demekti — sunucu Laravel dalını atlıyor ve "uygulama klasörü belge
         * kökünden ayrı olmalı" hatasına düşüyordu.
         *
         * Daha kötüsü: eşleşen bir durumda YANLIŞ PROJEYİ o klasörün üstüne
         * yazabilirdi. Node uygulamalarındaki `startUpdate` bunu zaten doğru
         * yapıyor — farklıysa hangisi diye soruyor. Aynı işlevi kullanıyoruz.
         */
        onclick: () => askLaravelUpdate(jobOut, site, reload),
      }, '⬆ ' + s('update')),
      el('a', { href: cpanelUrl('files', { dir: site.appRoot }, site.filesUrl), target: '_blank', rel: 'noreferrer' },
        el('button', {}, '📂 ' + s('appFiles'))),
      el('button', { onclick: async (e) => {
        e.target.disabled = true;
        clear(jobOut);
        try {
          const r = await post('files-download', { profile: ST.profile, path: site.appRoot });
          renderJob(jobOut, r.jobId);
        } catch (err) { showError(jobOut, err); }
        e.target.disabled = false;
      } }, '⬇ ' + s('downloadFiles'))));
}

/** Tek bir uygulamanın kartı: durumu, adresi ve yapılabilecek her şey. */
function appCard(a, jobOut, reload) {
  const on = /start|run/i.test(String(a.status ?? (a.enabled ? 'started' : 'stopped')));

  // Bu işler CloudLinux'ta worker'dan geçiyor ve 5-60 sn sürebiliyor;
  // kullanıcı ne olduğunu görmeli. Hepsi iş olarak koşup log akıtıyor.
  const act = (action) => async (e) => {
    e.target.disabled = true;
    try {
      const r = await post('app-action', { profile: ST.profile, appRoot: a.path, action });
      renderJob(jobOut, r.jobId, reload);
    } catch (err) { e.target.disabled = false; showError(jobOut, err); }
  };

  return el('div', { class: 'app' },
    el('div', { class: 'top' },
      el('span', { class: 'name' }, el('span', { class: 'dot ' + (on ? 'on' : 'off') }), a.name),
      a.domain
        ? el('a', { href: 'https://' + a.domain, target: '_blank', rel: 'noreferrer' }, a.domain)
        : el('span', { class: 'muted' }, s('none')),
      el('span', { class: 'pill ' + (on ? 'ok' : 'warn') }, on ? s('running') : s('stopped')),
      a.owned ? el('span', { class: 'pill ok' }, s('mine')) : el('span', { class: 'pill' }, s('external'))),

    el('div', { class: 'meta' },
      el('span', {}, s('folder') + ': ', el('b', {}, '~/' + a.path)),
      a.nodeVersion ? el('span', {}, 'Node: ', el('b', {}, a.nodeVersion)) : null,
      a.ownerProject ? el('span', {}, s('linkedTo') + ': ', el('b', {}, a.ownerProject)) : null),

    el('div', { class: 'row' },
      el('button', {
        class: a.ownerProject ? 'primary' : '',
        title: a.ownerProject || s('noLink'),
        onclick: () => startUpdate(jobOut, a, reload),
      }, '⬆ ' + s('update')),
      el('button', { onclick: act('restart') }, '↻ ' + s('restart')),
      el('button', { onclick: act(on ? 'stop' : 'start') }, on ? '⏹ ' + s('stop') : '▶ ' + s('start')),
      el('a', {
        href: cpanelUrl('files', { dir: a.path }, a.filesUrl),
        target: '_blank', rel: 'noreferrer',
      }, el('button', {}, '📂 ' + s('appFiles'))),
      el('button', {
        title: s('changeProject'),
        onclick: () => {
          // Hedef sabit (domain + app-root), yalnızca KAYNAK klasör yeniden
          // seçiliyor. Uygulamayı başka bir yerel projeye bağlamak ya da makine
          // değiştirdikten sonra yeniden eşlemek için.
          ST.deploy = { path: null, domain: a.domain, appRoot: a.path, relink: a.name };
          ST.tab = 'deploy';
          renderMain();
        },
      }, s('changeProject')),
      el('button', { title: s('backupDownloadSub'), onclick: async (e) => {
        e.target.disabled = true;
        clear(jobOut);
        try {
          const r = await post('files-download', { profile: ST.profile, path: a.path });
          renderJob(jobOut, r.jobId);
        } catch (err) { showError(jobOut, err); }
        e.target.disabled = false;
      } }, '⬇ ' + s('downloadFiles')),
      el('span', { class: 'spacer', style: 'flex:1' }),
      el('button', { class: 'danger', onclick: () => askDelete(jobOut, a, reload) }, s('del'))));
}

/**
 * Güncelleme başlat.
 *
 * Projeyi HER ZAMAN açıkça gönderiyoruz. Eskiden düğme yalnızca uygulama
 * klasörünü gönderiyordu ve sunucu sahiplik işaretindeki projeye düşüyordu —
 * yani üstte başka bir proje seçilse bile hep eskisi yayınlanıyordu.
 *
 * Seçili proje bağlı projeden farklıysa SESSİZCE birini seçmiyoruz: ikisi de
 * makul bir niyet olabilir ve yanlış olanı seçmek uygulamanın üstüne başka bir
 * projeyi yazmak demek. Kullanıcı karar veriyor.
 */
function startUpdate(out, app, reload) {
  const selected = ST.deploy.path || null;
  const linked = app.ownerProject || null;

  const run = async (projectPath) => {
    clear(out);
    try {
      const r = await post('app-update', { profile: ST.profile, appRoot: app.path, projectPath });
      renderJob(out, r.jobId, reload);
    } catch (err) { showError(out, err); }
  };

  if (!linked && !selected) { alert(s('noLink')); return; }
  if (!selected || !linked || samePath(selected, linked)) { run(selected || linked); return; }

  clear(out);
  out.append(el('div', { class: 'card', style: 'margin:16px 0 0' },
    el('div', { class: 'msg warn' }, s('projectMismatch')),
    el('h2', {}, s('whichProject')),
    el('div', { class: 'row', style: 'margin-top:10px' },
      el('button', { class: 'primary', onclick: () => run(linked) },
        s('linkedProject') + ': ' + linked.split('/').filter(Boolean).pop()),
      el('button', { onclick: () => run(selected) },
        s('selectedProject') + ': ' + selected.split('/').filter(Boolean).pop())),
    el('p', { class: 'sub', style: 'margin-top:10px' }, linked + '  ·  ' + selected)));
}

function samePath(a, b) {
  const norm = (p) => String(p).replace(/\/+$/, '');
  return norm(a) === norm(b);
}

/** Yeni subdomain. Belge kökü domain adıyla aynı tutuluyor. */
function askNewSubdomain(out, o, root) {
  clear(out);
  const roots = o.domains.filter((d) => d.type === 'main' || d.type === 'addon');
  const rootSel = el('select', {}, ...roots.map((d) => el('option', { value: d.domain }, d.domain)));
  const label = el('input', { placeholder: 'magaza' });
  const go = el('button', { class: 'primary', style: 'margin-top:12px' }, s('createSub'));
  go.addEventListener('click', async () => {
    go.disabled = true;
    try {
      await post('subdomain', { profile: ST.profile, label: label.value, rootDomain: rootSel.value });
      ST.overview = null;
      const c = root; clear(c); viewOverview(c, true);
    } catch (err) { go.disabled = false; showError(out, err); }
  });
  out.append(el('div', { class: 'card', style: 'margin:12px 0' },
    el('label', {}, s('underDomain')), rootSel,
    el('label', {}, s('subLabel')), label, go));
}

/** Subdomain silme — yazarak onay, ve üstünde uygulama varsa sunucu reddediyor. */
function askDeleteSubdomain(out, d, root) {
  clear(out);
  const input = el('input', { placeholder: d.domain });
  const go = el('button', { class: 'danger', style: 'margin-top:12px' }, s('delSub'));
  go.addEventListener('click', async () => {
    go.disabled = true;
    try {
      await api('subdomain', { method: 'DELETE', body: JSON.stringify({
        profile: ST.profile, domain: d.domain, confirm: input.value }) });
      ST.overview = null;
      const c = root; clear(c); viewOverview(c, true);
    } catch (err) { go.disabled = false; showError(out, err); }
  });
  out.append(el('div', { class: 'card', style: 'margin:12px 0' },
    el('div', { class: 'msg warn' }, s('subDeleteWarn').replace('{domain}', d.domain)),
    el('label', {}, s('typeToConfirm')), input, go));
}

/**
 * Uygulama kaldırma.
 *
 * ⚠ Bu fonksiyon HİÇ TANIMLANMAMIŞTI. Kart üzerindeki "Sil" düğmesi onu
 * çağırıyordu, yani tıklayınca konsola ReferenceError düşüyor ve ekranda
 * hiçbir şey olmuyordu — sessiz bir ölü düğme.
 *
 * Dosyaları silmek AYRI ve açık bir tercih: uygulama kaydını kaldırmak
 * kaynak kodu silmek anlamına gelmemeli.
 */
function askDelete(out, app, reload) {
  clear(out);
  const input = el('input', { placeholder: app.path });
  const files = el('input', { type: 'checkbox', style: 'width:auto' });
  const go = el('button', { class: 'danger', style: 'margin-top:12px' }, s('deleteApp'));

  go.addEventListener('click', async () => {
    go.disabled = true;
    try {
      const r = await post('app-delete', {
        profile: ST.profile, appRoot: app.path,
        confirm: input.value, deleteFiles: files.checked });
      renderJob(out, r.jobId, () => { ST.overview = null; reload(); });
    } catch (err) { go.disabled = false; showError(out, err); }
  });

  out.append(el('div', { class: 'card', style: 'margin:16px 0 0' },
    el('div', { class: 'msg warn' }, s('deleteWarn').replace('{name}', app.name)),
    el('label', {}, s('typeToConfirm')), input,
    el('div', { class: 'row', style: 'margin-top:12px' },
      el('label', { style: 'margin:0;text-transform:none;font-size:13px' },
        files, ' ' + s('deleteFiles'))),
    el('div', { class: 'row', style: 'margin-top:12px' },
      go, el('button', { onclick: () => clear(out) }, s('cancel')))));
  setTimeout(() => input.focus(), 30);
}

/* ---------------------------------------------------------------- deploy */
/**
 * Adım şeridi.
 *
 * Yayınlama üç karardan oluşuyor (hangi proje · nereye · onay) ama eskiden
 * hepsi tek ekranda, sırasız duruyordu. Nerede olduğunu ve kaç adım kaldığını
 * göstermek, "karışık" hissinin büyük kısmını tek başına çözüyor.
 */
function stepStrip(active) {
  const keys = ['stepProject', 'stepTarget', 'stepReview'];
  return el('div', { class: 'steps' }, ...keys.map((k, i) =>
    el('div', { class: 'step' + (i === active ? ' on' : i < active ? ' done' : '') },
      el('span', { class: 'n' }, i < active ? '✓' : String(i + 1)),
      s(k))));
}

async function viewDeploy(root) {
  const d = ST.deploy;
  clear(root);

  /* ---- 1. adım: proje ------------------------------------------------- */
  if (!d.path) {
    root.append(stepStrip(0));
    const list = el('div', {});
    root.append(el('div', { class: 'card' },
      el('div', { class: 'sec' },
        el('h2', {}, s('stepProject')),
        el('p', {}, d.relink ? s('relinkTo') : s('stepProjectSub'))),
      d.relink
        ? el('div', { class: 'msg info' }, `${d.relink} → ${d.domain} · ~/${d.appRoot}`)
        : null,
      el('p', { class: 'help' }, s('projectHelp')),
      list));

    api('recent').then((r) => {
      if (r.items.length) {
        list.append(el('label', {}, s('recent')));
        list.append(el('div', { class: 'browse' }, ...r.items.map((i) =>
          el('div', { onclick: () => pick(i.path) }, '📦 ' + i.name,
            el('span', { class: 'muted mono' }, '  ' + i.path)))));
      }
      list.append(el('label', {}, s('browse')));
      const browseBox = el('div', {});
      list.append(browseBox);
      renderBrowse(browseBox, null);
    });
    return;
  }

  /* ---- 2. adım: hedef -------------------------------------------------- */
  root.append(stepStrip(1));

  const projCard = el('div', { class: 'card' });
  root.append(projCard);
  projCard.append(
    el('div', { class: 'row' },
      el('span', { style: 'flex:1' },
        el('b', {}, '📦 ' + d.path.split('/').filter(Boolean).pop()),
        el('div', { class: 'mono muted', style: 'font-size:12px;word-break:break-all' }, d.path)),
      el('button', { onclick: () => { ST.deploy = { relink: d.relink, domain: d.domain, appRoot: d.appRoot }; renderMain(); } }, s('changeProject')),
      el('button', { onclick: () => { ST.deploy = {}; renderMain(); } }, s('cancel'))));

  const info = el('div', {});
  projCard.append(info);

  if (!d.project) {
    info.append(el('p', { class: 'sub' }, s('working')));
    try {
      const r = await api('project?path=' + encodeURIComponent(d.path));
      d.project = r.project; d.plan = r.plan; d.link = r.link;
    } catch (err) { return showError(root, err); }
    return viewDeploy(root);
  }

  clear(info);
  if (!d.project.deployable) {
    info.append(el('div', { class: 'msg err' }, el('strong', {}, s('blockers')),
      ...d.project.blockers.map((b) => el('div', {}, '• ' + b))));
    return;
  }
  const isLaravel = d.project.framework === 'laravel';
  info.append(el('div', { class: 'meta', style: 'margin:12px 0 0' },
    el('span', {}, s('framework') + ': ',
      el('b', {}, isLaravel
        ? 'Laravel ' + (d.project.laravelVersion ?? '')
        : 'Next.js ' + (d.project.nextVersion ?? '') + ' · ' + (d.project.router ?? ''))),
    isLaravel ? null : el('span', {}, s('startup') + ': ', el('b', {}, d.project.startupFile)),
    d.plan ? el('span', {}, s('package') + ': ',
      el('b', {}, d.plan.files + ' ' + s('files') + ' · ' + bytes(d.plan.bytes))) : null));
  for (const w of d.project.warnings) info.append(el('div', { class: 'msg warn' }, w));
  if (d.plan?.skippedEnv?.length) {
    info.append(el('div', { class: 'msg info' }, s('envExcluded') + ': ' + d.plan.skippedEnv.join(', ')));
  }

  /* hedef */
  if (!ST.overview) {
    try { ST.overview = await api('overview/' + encodeURIComponent(ST.profile)); }
    catch (err) { return showError(root, err); }
  }
  const o = ST.overview;

  // Laravel'in hedef adımı bambaşka: klasör seçilmiyor, migration ve vendor
  // kipi seçiliyor. Ayrı bir fonksiyona bırakmak ikisini de okunur tutuyor.
  if (isLaravel) return viewDeployLaravel(root, d, o);

  const targetCard = el('div', { class: 'card' },
    el('div', { class: 'sec' },
      el('h2', {}, s('stepTarget')),
      el('p', {}, s('stepTargetSub'))));
  /*
   * "Yeni subdomain" seçeneği BURADA, hedef adımının içinde.
   *
   * Eskiden yalnızca Panel'deydi: yeni bir proje yayınlamak isteyen kullanıcı
   * sihirbazı yarıda bırakıp Panel'e gidiyor, subdomain açıyor, sonra baştan
   * başlıyordu. Karar burada verildiğine göre seçenek de burada olmalı.
   */
  const domSel = el('select', {},
    ...o.domains.filter((x) => x.type !== 'parked').map((x) =>
      el('option', { value: x.domain, selected: x.domain === (d.domain ?? (d.link && d.link.domain)) }, x.domain + ' — ' + x.typeLabel)),
    el('option', { value: '__new__' }, '+ ' + s('newSubdomain')));
  /*
   * Kayıtlı bağlantı varsa onu kullan — kullanıcı her seferinde klasör adını
   * elle yazmak zorunda kalmasın. `suggest()` yalnızca HİÇ bağlantı yokken,
   * yani gerçekten yeni bir uygulama kurulurken devreye giriyor.
   */
  const linked = d.link ?? {};
  const rootIn = el('input', { placeholder: 'myappnext' });
  const hint = el('div', {});

  /*
   * Klasör adı seçme SIRASI — ve bu sıra pahalıya mal olan bir hatadan geliyor.
   *
   * Eskiden burada doğrudan `suggest()` çağrılıyordu, yani domainde ZATEN bir
   * uygulama olsa bile yeni bir ad uyduruluyordu. Sonuç: kullanıcı deploy
   * ediyor, "başarılı" yazısını görüyor, ama site değişmiyor — çünkü paket
   * hiç servis edilmeyen yeni bir klasöre gitmiş oluyor.
   *
   * Doğru sıra: kayıtlı bağlantı → domaindeki MEVCUT uygulama → yeni ad.
   */
  function pickRoot(domain) {
    if (d.appRoot) return { value: d.appRoot, why: null };
    if (linked.appRoot) return { value: linked.appRoot, why: null };
    const existing = o.apps.find((a) => a.domain === domain);
    if (existing) return { value: existing.path, why: existing };
    return { value: suggest(domain, o.apps), why: null };
  }

  /*
   * "Yeni subdomain" seçilince form YERİNDE açılıyor.
   *
   * Oluşturulduğu anda domain listesi tazeleniyor ve yeni subdomain seçili
   * hâle geliyor; kullanıcı sihirbazda kaldığı yerden devam ediyor.
   */
  const newSubBox = el('div', {});
  function askNewSub() {
    clear(newSubBox);
    const roots = o.domains.filter((x) => x.type === 'main' || x.type === 'addon');
    const rootSel = el('select', {}, ...roots.map((x) => el('option', { value: x.domain }, x.domain)));
    const label = el('input', { placeholder: 'magaza' });
    const msg = el('div', {});
    const go = el('button', { class: 'primary', style: 'margin-top:12px' }, s('createSub'));

    go.addEventListener('click', async () => {
      const name = label.value.trim().toLowerCase();
      if (!name) return;
      go.disabled = true;
      clear(msg);
      try {
        await post('subdomain', { profile: ST.profile, label: name, rootDomain: rootSel.value });
        const full = name + '.' + rootSel.value;
        // Liste tazelenmeli: yeni subdomain seçilebilir olmalı ve belge kökü
        // bilgisi (Laravel için şart) gelmeli.
        ST.overview = await api('overview/' + encodeURIComponent(ST.profile) + '?refresh=1');
        ST.deploy.domain = full;
        renderMain();
      } catch (err) { go.disabled = false; showError(msg, err); }
    });

    newSubBox.append(el('div', { class: 'card', style: 'margin:12px 0' },
      el('div', { class: 'sec' }, el('h2', {}, s('newSubdomain'))),
      el('label', {}, s('underDomain')), rootSel,
      el('label', {}, s('subLabel')), label,
      el('p', { class: 'help' }, s('subLabelHelp')),
      el('div', { class: 'row', style: 'margin-top:12px' },
        go, el('button', { onclick: () => { domSel.selectedIndex = 0; applyRoot(); } }, s('cancel'))),
      msg));
    setTimeout(() => label.focus(), 30);
  }

  function applyRoot() {
    clear(newSubBox);
    if (domSel.value === '__new__') {
      rootIn.value = '';
      clear(hint);
      askNewSub();
      return;
    }
    const r = pickRoot(domSel.value);
    rootIn.value = r.value;
    clear(hint);
    if (r.why) {
      hint.append(el('div', { class: 'msg info' },
        s('domainHasApp').replace('{name}', r.why.name).replace('{path}', r.why.path)));
    }
  }
  domSel.addEventListener('change', applyRoot);
  applyRoot();

  const noBuild = el('input', { type: 'checkbox', style: 'width:auto' });
  const adopt = el('input', { type: 'checkbox', style: 'width:auto' });
  const out = el('div', {});

  const checkBtn = el('button', { class: 'primary' }, s('next') + ' →');
  checkBtn.addEventListener('click', async () => {
    checkBtn.disabled = true;
    clear(out);
    try {
      const pf = await post('preflight', {
        profile: ST.profile, domain: domSel.value, appRoot: rootIn.value, adopt: adopt.checked });
      renderConfirm(out, pf, {
        domain: domSel.value, appRoot: rootIn.value,
        noBuild: noBuild.checked, adopt: adopt.checked });
      out.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    } catch (err) { showError(out, err); }
    checkBtn.disabled = false;
  });

  targetCard.append(
    el('label', {}, s('domain')), domSel,
    el('p', { class: 'help' }, s('domainHelp')), newSubBox,
    el('label', {}, s('appRoot')), rootIn,
    el('p', { class: 'help' }, s('appRootHelp')), hint,
    el('details', { class: 'advanced' },
      el('summary', {},
        el('span', {}, s('advancedOptions')),
        el('span', { class: 'help', style: 'margin-left:auto' }, s('advancedOptionsSub'))),
      el('div', { class: 'advanced-body' },
        el('label', { style: 'text-transform:none;font-size:13px;color:var(--fg)' },
          noBuild, ' ' + s('noBuild')),
        el('p', { class: 'help', style: 'margin:0 0 10px 22px' }, s('noBuildHelp')),
        el('label', { style: 'text-transform:none;font-size:13px;color:var(--fg)' },
          adopt, ' ' + s('adopt')),
        el('p', { class: 'help', style: 'margin:0 0 4px 22px' }, s('adoptHelp')))),
    el('div', { class: 'row', style: 'margin-top:18px' }, checkBtn),
    out);
  root.append(targetCard);

  function pick(p) {
    // relink kipinde hedef korunuyor; yalnızca kaynak klasör değişiyor.
    ST.deploy = { path: p, relink: d.relink, domain: d.domain, appRoot: d.appRoot };
    renderMain();
  }
  async function renderBrowse(box, start) {
    clear(box);
    let r;
    try { r = await api('browse' + (start ? '?path=' + encodeURIComponent(start) : '')); }
    catch (err) { return showError(box, err); }
    box.append(el('div', { class: 'mono muted', style: 'margin-bottom:6px' }, r.path));
    const list = el('div', { class: 'browse' });
    if (r.parent) list.append(el('div', { onclick: () => renderBrowse(box, r.parent) }, '⬆ ' + s('up')));
    for (const e of r.entries) {
      list.append(el('div', { onclick: () => renderBrowse(box, e.path) },
        (e.isProject ? '📦 ' : '📁 ') + e.name));
    }
    box.append(list);
    box.append(el('button', { style: 'margin-top:10px', onclick: () => pick(r.path) }, s('selectThis')));
  }
}

/**
 * Laravel'in hedef adımı.
 *
 * Next.js'ten iki temel farkı var ve ikisi de kullanıcının karar yükünü
 * AZALTIYOR:
 *   · Uygulama klasörü seçilmiyor — belge kökünün kendisi. Yanlış klasöre
 *     kurma ihtimali yapısal olarak yok.
 *   · Onun yerine migration ve vendor kipi soruluyor; bunlar Next.js'te
 *     olmayan, Laravel'de olmazsa olmaz kararlar.
 */
async function viewDeployLaravel(root, d, o) {
  const domSel = el('select', {}, ...o.domains.filter((x) => x.type !== 'parked').map((x) =>
    el('option', { value: x.domain, selected: x.domain === (d.domain ?? (d.link && d.link.domain)) },
      x.domain + ' — ' + x.typeLabel)));

  const folder = el('div', { class: 'mono muted' });
  const applyFolder = () => {
    const dom = o.domains.find((x) => x.domain === domSel.value);
    folder.textContent = '~/' + ((dom && dom.docroot) || '?') + '   ' + s('lvAuto');
  };
  domSel.addEventListener('change', applyFolder);
  applyFolder();

  const migrate = el('select', {},
    el('option', { value: 'migrate', selected: true }, s('mgMigrate')),
    el('option', { value: 'none' }, s('mgNone')),
    el('option', { value: 'migrate-seed' }, s('mgMigrateSeed')),
    el('option', { value: 'fresh-seed' }, s('mgFreshSeed')));
  const migrateWarn = el('div', {});
  migrate.addEventListener('change', () => {
    clear(migrateWarn);
    if (migrate.value === 'fresh-seed') {
      migrateWarn.append(el('div', { class: 'msg warn' }, s('lvFreshWarn')));
    }
  });

  const vendorSel = el('select', {},
    el('option', { value: 'auto', selected: true }, s('vnAuto')),
    el('option', { value: 'always' }, s('vnAlways')),
    el('option', { value: 'server' }, s('vnServer')));
  const keepDebug = el('input', { type: 'checkbox', style: 'width:auto' });
  // Yayın sonrası temizlik — varsayılan açık; log sıfırlıyor, veriye dokunmuyor.
  const cleanUp = el('input', { type: 'checkbox', style: 'width:auto' });
  cleanUp.checked = true;

  /* --- veritabanı --- */
  const dbMode = el('select', {},
    el('option', { value: 'skip', selected: true }, s('lvDbSkip')),
    el('option', { value: 'new' }, s('lvDbNew')),
    el('option', { value: 'existing' }, s('lvDbExisting')));
  const dbBox = el('div', {});
  const dbRefs = {};
  let dbData = null;

  const renderDb = async () => {
    clear(dbBox);
    for (const k of Object.keys(dbRefs)) delete dbRefs[k];
    if (dbMode.value === 'skip') return;

    if (dbMode.value === 'new') {
      const name = el('input', { placeholder: 'magaza' });
      dbBox.append(el('label', {}, s('dbNameLabel')), name, el('p', { class: 'help' }, s('dbNameHint')));
      dbRefs.newName = name;
      return;
    }

    dbBox.append(el('p', { class: 'sub' }, s('working')));
    if (!dbData) {
      try { dbData = await api('db/' + encodeURIComponent(ST.profile)); }
      catch (err) { clear(dbBox); return showError(dbBox, err); }
    }
    clear(dbBox);

    const dbSel = el('select', {}, ...dbData.databases.map((x) =>
      el('option', { value: x.name }, x.name + ' — ' + bytes(x.size))));
    const userMode = el('select', {},
      el('option', { value: 'new', selected: true }, s('lvDbUserNew')),
      el('option', { value: 'existing' }, s('lvDbUserExisting')));
    const userBox = el('div', {});

    const renderUser = () => {
      clear(userBox);
      delete dbRefs.uSel;
      delete dbRefs.pass;
      if (userMode.value === 'new') return;
      const chosen = dbData.databases.find((x) => x.name === dbSel.value);
      const users = (chosen && chosen.users) || [];
      const uSel = el('select', {}, ...users.map((u) => el('option', { value: u }, u)));
      const pass = el('input', { type: 'password' });
      userBox.append(el('label', {}, s('dbUser')), uSel, el('label', {}, s('lvDbPassword')), pass);
      dbRefs.uSel = uSel;
      dbRefs.pass = pass;
    };
    userMode.addEventListener('change', renderUser);
    dbSel.addEventListener('change', renderUser);

    dbBox.append(el('label', {}, s('database')), dbSel,
      el('label', {}, s('lvDbUser')), userMode, userBox);
    dbRefs.dbSel = dbSel;
    dbRefs.userMode = userMode;
    renderUser();
  };
  dbMode.addEventListener('change', renderDb);

  /** Seçilen veritabanı kipini, deploy'a verilecek şekle çevirir. */
  const collectDb = () => {
    if (dbMode.value === 'skip') return null;
    if (dbMode.value === 'new') {
      return { mode: 'new', name: (dbRefs.newName && dbRefs.newName.value.trim()) || '' };
    }
    const database = dbRefs.dbSel && dbRefs.dbSel.value;
    if (!database) return null;
    if (dbRefs.userMode && dbRefs.userMode.value === 'new') {
      return { mode: 'new', name: database, user: database + '_app' };
    }
    return {
      mode: 'existing',
      database,
      user: dbRefs.uSel && dbRefs.uSel.value,
      password: (dbRefs.pass && dbRefs.pass.value) || '',
      host: dbData && dbData.server.host,
      port: dbData && dbData.server.port,
    };
  };

  const out = el('div', {});
  const nextBtn = el('button', { class: 'primary' }, s('next') + ' →');
  nextBtn.addEventListener('click', async () => {
    nextBtn.disabled = true;
    clear(out);
    try {
      const pf = await post('laravel-preflight', { profile: ST.profile, domain: domSel.value });
      renderLaravelConfirm(out, pf, {
        domain: domSel.value,
        laravel: {
          migrate: migrate.value, vendor: vendorSel.value,
          keepDebug: keepDebug.checked, clean: cleanUp.checked,
        },
        db: collectDb(),
      });
      out.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    } catch (err) { showError(out, err); }
    nextBtn.disabled = false;
  });

  root.append(el('div', { class: 'card' },
    el('div', { class: 'sec' },
      el('h2', {}, s('stepTarget')),
      el('p', {}, s('stepTargetSub'))),
    el('label', {}, s('domain')), domSel,
    el('p', { class: 'help' }, s('domainHelp')),
    el('label', {}, s('lvFolder')), folder,
    el('p', { class: 'help' }, s('lvServed') + ': public/ — ' + s('lvViaHt')),

    el('details', { class: 'advanced' },
      el('summary', {},
        el('span', {}, s('advancedOptions')),
        el('span', { class: 'help', style: 'margin-left:auto' }, s('advancedOptionsSub'))),
      el('div', { class: 'advanced-body' },
        el('div', { class: 'sec', style: 'margin:18px 0 8px' }, el('h2', {}, s('lvTitle'))),
        el('label', {}, s('lvMigrate')), migrate, migrateWarn,
        el('label', {}, s('lvVendor')), vendorSel,
        el('label', {}, s('lvDb')), dbMode, dbBox,
        el('p', { class: 'help', style: 'margin-top:10px' }, s('lvEnvNote')),
        el('div', { class: 'row', style: 'margin-top:14px' },
          el('label', { style: 'margin:0;text-transform:none;font-size:13px;color:var(--fg)' },
            keepDebug, ' ' + s('lvKeepDebug'))),
        el('div', { class: 'row', style: 'margin-top:10px' },
          el('label', { style: 'margin:0;text-transform:none;font-size:13px;color:var(--fg)' },
            cleanUp, ' ' + s('lvClean'))),
        el('p', { class: 'help' }, s('lvCleanHelp')))),
    el('div', { class: 'row', style: 'margin-top:18px' }, nextBtn),
    out));
}

/** Laravel kontrol adımı — neyin silineceği ve neyin kalacağı açıkça yazılı. */
function renderLaravelConfirm(out, pf, form) {
  clear(out);
  const box = el('div', { class: 'card', style: 'margin:18px 0 0' });

  box.append(
    stepStrip(2),
    el('div', { class: 'sec' },
      el('h2', {}, s('stepReview')),
      el('p', {}, s('reviewIntro'))),
    el('dl', { class: 'kv' },
      el('dt', {}, s('domain')), el('dd', {}, pf.target.domain),
      el('dt', {}, s('lvFolder')), el('dd', { class: 'mono' }, '~/' + pf.appRoot),
      el('dt', {}, s('stepReview')), el('dd', {},
        el('span', { class: 'pill ' + (pf.first ? 'warn' : 'ok') },
          pf.first ? s('lvFirst') : s('lvUpdate')))));

  let confirmIn = null;
  if (pf.count) {
    box.append(el('div', { class: 'msg warn' },
      el('strong', {}, s('dangerTitle')),
      el('div', {}, s('lvNotEmpty').replace('{count}', pf.count)),
      el('div', { class: 'mono muted', style: 'margin-top:6px;word-break:break-all' },
        pf.sample.join('  ')),
      el('div', { class: 'muted', style: 'margin-top:6px' }, s('lvKept'))));
    box.append(el('label', {}, s('typeToConfirm')));
    confirmIn = el('input', { placeholder: pf.appRoot });
    box.append(confirmIn);
    setTimeout(() => confirmIn.focus(), 40);
  } else {
    box.append(el('div', { class: 'msg info' }, s('firstDeployHint')));
  }

  const go = el('button', { class: pf.count ? 'danger' : 'primary', style: 'margin-top:16px' },
    '🚀 ' + s('deployNow'));
  go.addEventListener('click', async () => {
    go.disabled = true;
    try {
      /*
       * Veritabanı ÖNCE hazırlanıyor, deploy sonra.
       *
       * Sunucudaki `.env`'e yazılacak bilgiler yayın başlamadan elde olmalı;
       * yoksa migration çalışırken bağlantı bilgisi henüz yazılmamış olur.
       */
      let db = null;
      if (form.db && form.db.mode === 'new') {
        db = await post('db-create', { profile: ST.profile, name: form.db.name, user: form.db.user });
      } else if (form.db && form.db.mode === 'existing') {
        db = {
          database: form.db.database, user: form.db.user,
          password: form.db.password || null,
          host: form.db.host, port: form.db.port,
        };
      }

      const r = await post('deploy', {
        profile: ST.profile, projectPath: ST.deploy.path,
        domain: form.domain, laravel: form.laravel, db,
        confirm: confirmIn ? confirmIn.value : undefined,
      });
      renderJob(out, r.jobId);
    } catch (err) { go.disabled = false; showError(box, err); }
  });

  box.append(el('div', { class: 'row' }, go,
    el('button', { onclick: () => clear(out) }, '← ' + s('back'))));
  out.append(box);
}

function suggest(domain, apps) {
  const base = (domain.split('.')[0] || 'app').replace(/[^a-z0-9]/gi, '');
  let c = base + 'next', n = 2;
  while (apps.some((a) => a.path === c)) { c = base + 'next' + n; n++; }
  return c;
}

/**
 * 3. adım: kontrol.
 *
 * Bu ekranın tek işi, kullanıcının "onayla" demeden önce NE OLACAĞINI
 * okumasını sağlamak. Eskiden yalnızca iki satır anahtar/değer ve bir uyarı
 * kutusu vardı; hangi dosyaların korunacağı ya da klasörün dolu olduğu
 * hiçbir yerde yazmıyordu.
 */
function renderConfirm(out, pf, form) {
  clear(out);
  const box = el('div', { class: 'card', style: 'margin:18px 0 0' });

  box.append(
    stepStrip(2),
    el('div', { class: 'sec' },
      el('h2', {}, s('stepReview')),
      el('p', {}, s('reviewIntro'))),
    el('dl', { class: 'kv' },
      el('dt', {}, s('domain')), el('dd', {},
        pf.target.domain,
        pf.target.kind === 'new-subdomain' ? el('span', { class: 'pill warn' }, s('newSub')) : null),
      el('dt', {}, s('appRoot')), el('dd', { class: 'mono' },
        '~/' + pf.appRoot,
        pf.dirExists ? null : el('span', { class: 'pill' }, s('newApp')))));

  if (pf.target.kind === 'new-subdomain') {
    box.append(el('div', { class: 'msg info' }, s('newSub') + ': ' + pf.target.domain));
  }
  if (pf.otherApps?.length) {
    box.append(el('div', { class: 'msg info' }, s('otherApps') + ': ' +
      pf.otherApps.map((a) => a.name).join(', ')));
  }
  if (pf.ownership && pf.ownership.owned === false) {
    box.append(el('div', { class: 'msg err' }, el('strong', {}, pf.ownership.error),
      pf.ownership.hint ? el('div', { class: 'muted' }, pf.ownership.hint) : null));
    out.append(box);
    return;
  }

  let confirmIn = null;
  if (pf.destructive) {
    /* Yazarak onay — tek tıkla üzerine yazma YOK. Sunucu da bunu doğruluyor. */
    box.append(el('div', { class: 'msg warn' },
      el('strong', {}, s('dangerTitle')),
      el('div', {}, s('overwriteWarn')),
      // Neyin KALACAĞINI söylemek, uyarıyı okunur kılan şey: kullanıcı
      // ".env dosyam gidiyor mu?" sorusunu burada cevaplanmış bulmalı.
      el('div', { class: 'muted', style: 'margin-top:6px' },
        s('preserved') + ': .env · .env.local · .env.production · node_modules')));
    box.append(el('label', {}, s('typeToConfirm')));
    confirmIn = el('input', { placeholder: pf.appRoot });
    box.append(confirmIn);
    setTimeout(() => confirmIn.focus(), 40);
  } else {
    box.append(el('div', { class: 'msg info' }, s('firstDeployHint')));
  }

  const go = el('button', { class: pf.destructive ? 'danger' : 'primary', style: 'margin-top:16px' },
    '🚀 ' + s('deployNow'));
  go.addEventListener('click', async () => {
    go.disabled = true;
    try {
      const r = await post('deploy', {
        profile: ST.profile, projectPath: ST.deploy.path,
        domain: form.domain, appRoot: pf.appRoot,
        noBuild: form.noBuild, adopt: form.adopt,
        confirm: confirmIn ? confirmIn.value : undefined,
      });
      renderJob(out, r.jobId);
    } catch (err) { go.disabled = false; showError(box, err); }
  });
  box.append(el('div', { class: 'row' }, go,
    el('button', { onclick: () => clear(out) }, '← ' + s('back'))));
  out.append(box);
}

/* ------------------------------------------------------------------- job */
function renderJob(out, jobId, onDone) {
  clear(out);
  const log = el('div', { class: 'log' });
  const head = el('div', { class: 'row', style: 'margin-bottom:10px' }, el('strong', {}, s('working')));
  const bar = el('progress', { class: 'hide' });
  out.append(el('div', { class: 'card', style: 'margin:16px 0 0' }, head, bar, log));

  const line = (cls, text) => {
    log.append(el('div', { class: cls }, text));
    log.scrollTop = log.scrollHeight;
  };

  // EventSource özel başlık gönderemez; yalnızca bu okuma ucu için jetonu
  // sorguyla taşıyoruz (sunucu tarafında da böyle bekleniyor).
  const es = new EventSource('/api/jobs/' + jobId + '/events?t=' + encodeURIComponent(TOKEN));
  es.onerror = () => { /* sunucu kapanınca sessizce biter */ };
  es.onmessage = (m) => {
    const e = JSON.parse(m.data);
    if (e.type === 'progress') {
      bar.classList.remove('hide');
      bar.max = e.total || 0; bar.value = e.sent || 0;
      head.textContent = bytes(e.sent) + ' / ' + bytes(e.total);
      return;
    }
    if (e.type === 'step') {
      // Paket boyutu ham bayt olarak geliyor; biçimlendirme arayüzün işi.
      const text = e.key === 'deploy.packed'
        ? e.text.replace(String(e.params.size), bytes(e.params.size))
        : e.text;
      line('s', '▸ ' + text);
    }
    else if (e.type === 'warn') line('w', '! ' + e.text);
    else if (e.type === 'info') line('', '  ' + e.text);
    else if (e.type === 'remote') line('', '  ' + e.text + (e.pct ? ' (' + e.pct + '%)' : ''));
    else if (e.type === 'output') line('', e.text.trimEnd());
    else if (e.type === 'job') line('', '  ' + s('jobStarted').replace('{id}', e.jobId || jobId));
    else if (e.type === 'done') {
      line('d', '✓ ' + s('live'));
      clear(head); head.append(el('span', { class: 'pill ok' }, s('live')));
      es.close();
      api('jobs/' + jobId).then((j) => {
        if (j.result?.url) {
          head.append(el('a', { href: j.result.url, target: '_blank', rel: 'noreferrer' }, j.result.url));
        }
        /*
         * İndirme biten bir işte dosyanın NEREDE olduğunu söylemek yetmiyor;
         * kullanıcı onu bulmak istiyor. Düğme dosyayı açmıyor, klasörde
         * SEÇİLİ gösteriyor — bir .sql.gz dosyasını açmak istediği şey değil.
         */
        if (j.result?.path) {
          line('d', '✓ ' + s('downloadedTo').replace('{path}', j.result.path));
          const reveal = el('button', {}, '📂 ' + s('revealInFinder'));
          reveal.addEventListener('click', async () => {
            try { await post('reveal', { path: j.result.path }); }
            catch (err) { line('e', '! ' + err.message); }
          });
          head.append(reveal);
        }
        ST.overview = null;
        if (onDone) setTimeout(onDone, 1200);
      });
    } else if (e.type === 'failed') {
      line('e', '✗ ' + (e.text || s('failed')));
      // Sunucudaki komutun kendi çıktısı: hatanın SEBEBİNİ söyleyen tek yer.
      if (e.hint) for (const l of String(e.hint).split('\n')) line('e', '  ' + l);
      clear(head); head.append(el('span', { class: 'pill bad' }, s('failed')));
      es.close();
    }
  };
}

async function viewBackups(root) {

function fmtStamp(x) {
  const m = String(x).match(/^(\d{4})(\d{2})(\d{2})(?:-(\d{2})(\d{2})(\d{2}))?$/);
  return m ? m[3] + '.' + m[2] + '.' + m[1] + (m[4] ? ' ' + m[4] + ':' + m[5] : '') : x;
}

function askRestore(out, b) {
  clear(out);

        profile: ST.profile, appRoot: b.appRoot, backup: b.name, confirm: input.value });
      renderJob(out, r.jobId);
    } catch (err) { go.disabled = false; showError(out, err); }

  out.append(el('div', { class: 'card', style: 'margin:16px 0 0' },
    el('div', { class: 'msg warn' }, s('rollbackWarn')),

/* ------------------------------------------------------------- database */
/*
 * Veritabanı sekmesi.
 *
 * cPanel'de bir Next.js uygulamasına veritabanı bağlamak dört ekran sürüyor:
 * "Create Database", "Create User", "Add User To Database", yetki kutuları —
 * ve sonunda bağlantı dizesini elle kuruyorsun. Buradaki tek alan o dördünün
 * yerine geçiyor.
 *
 * Bu işlemler İŞ (job) olarak koşmuyor: cPanel'in MySQL UAPI'si tam, yani
 * cron köprüsü yok, bekleme yok, hepsi tek turda bitiyor.
 */
const withPrefix = (p, n) => (!p || String(n).startsWith(p) ? String(n) : p + n);

function copyBtn(text) {
  const b = el('button', {}, s('copy'));
  b.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      // Pano izni yoksa metni yine de kullanıcıya ULAŞTIR — sessizce başarısız
      // olmak, şifresini bir daha göremeyeceği anlamına gelir.
      window.prompt(s('copy'), text);
      return;
    }
    b.textContent = s('copied');
    setTimeout(() => { b.textContent = s('copy'); }, 1200);
  });
  return b;
}

async function appsForEnv() {
  if (!ST.overview) ST.overview = await api('overview/' + encodeURIComponent(ST.profile));
  return ST.overview.apps || [];
}

async function viewDatabase(root) {

    u.searchParams.set('goto_uri', '/3rdparty/phpMyAdmin/index.php?db=' + name);

  const pma = (href, label) =>
    el('a', { href, target: '_blank', rel: 'noreferrer' }, el('button', {}, label));

  /* --- sunucu + phpMyAdmin --- */
  root.append(el('div', { class: 'card' },
    el('div', { class: 'row' },
      el('h2', { style: 'flex:1' }, s('database')),
      pma(autoLogin() ? cpanelUrl('phpmyadmin', {}) : d.pmaUrl, s('openPma')),
      el('button', { onclick: reload }, s('refresh'))),
    el('dl', { class: 'kv' },
      el('dt', {}, s('mysqlServer')), el('dd', { class: 'mono' }, d.server.host + ':' + d.server.port),
      el('dt', {}, s('prefixLabel')), el('dd', { class: 'mono' }, d.restrictions.prefix || s('noPrefix'))),
    el('p', { class: 'sub', style: 'margin:12px 0 0' }, s('pmaNote'))));

  const nameIn = el('input', { placeholder: 'shop' });

  const createOut = el('div', {});
  const refreshPreview = () => {
    const v = nameIn.value.trim();

  nameIn.addEventListener('input', refreshPreview);

  const createBtn = el('button', { class: 'primary', style: 'margin-top:12px' }, s('create'));
  const doCreate = async () => {
    if (!nameIn.value.trim()) return;
    createBtn.disabled = true;
    clear(createOut);
    try {

      nameIn.value = '';
      refreshPreview();
      await renderDbResult(createOut, r);
    } catch (err) { showError(createOut, err); }
    finally { createBtn.disabled = false; }
  };
  createBtn.addEventListener('click', doCreate);
  nameIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') doCreate(); });

  root.append(el('div', { class: 'card' },
    el('h2', {}, s('newDb')),
    el('p', { class: 'sub' }, s('newDbNote')),
    el('label', {}, s('dbNameLabel')), nameIn,
    preview,
    el('div', { class: 'muted', style: 'font-size:12px;margin-top:4px' }, s('dbNameHint')),
    createBtn,
    createOut));

  /* --- veritabanları --- */
  const dropOut = el('div', {});
  root.append(el('div', { class: 'card' },
    el('h2', {}, s('dbs')),
    d.databases.length === 0 ? el('p', { class: 'sub' }, s('noDbs')) :
      el('table', {},
        el('thead', {}, el('tr', {}, el('th', {}, s('database')), el('th', {}, s('size')),
          el('th', {}, s('dbUsers')), el('th', {}, s('actions')))),
        el('tbody', {}, ...d.databases.map((db) => el('tr', {},
          el('td', { class: 'mono' }, db.name),
          el('td', { class: 'muted' }, bytes(db.size)),
          el('td', { class: 'muted mono' }, db.users.join(', ') || s('none')),
          el('td', {}, el('div', { class: 'row' },
            pma(pmaFor(db.name), 'phpMyAdmin'),
            el('button', { title: s('backupDownloadSub'), onclick: async (e) => {
              e.target.disabled = true;
              clear(dropOut);
              try {
                const r = await post('db-backup', { profile: ST.profile, database: db.name });
                renderJob(dropOut, r.jobId);
              } catch (err) { showError(dropOut, err); }
              e.target.disabled = false;
            } }, '⬇ ' + s('backupDownload')),
            el('button', { class: 'danger', onclick: () => askDrop(dropOut, 'db-delete', 'database', db.name, reload) }, s('del')))))))),
    dropOut));

  /* --- MySQL kullanıcıları --- */
  const userOut = el('div', {});
  root.append(el('div', { class: 'card' },
    el('h2', {}, s('dbUsers')),
    d.users.length === 0 ? el('p', { class: 'sub' }, s('noDbUsers')) :
      el('table', {},
        el('tbody', {}, ...d.users.map((u) => el('tr', {},
          el('td', { class: 'mono' }, u.name),

          el('td', { class: 'muted mono' },

              d.databases.filter((db) => db.users.includes(u.name)).map((db) => db.name).join(', ') ||

              e.target.disabled = true;
              clear(userOut);
              try {
                const r = await post('db-password', { profile: ST.profile, user: u.name });
                userOut.append(el('div', { class: 'card', style: 'margin:16px 0 0' },

/**
 * Yıkıcı işlem: adı BİREBİR yazmadan olmaz.
 *
 * Veritabanı silmenin yedeği yok — klasör silmekten daha geri alınamaz bir iş.
 * Onay sunucuda da denetleniyor; bu kutu yalnızca kullanıcı içindir.
 */
function askDrop(out, route, field, name, done) {
  clear(out);
  const input = el('input', { placeholder: name });
  const go = el('button', { class: 'danger', style: 'margin-top:12px' }, s('del'));
  go.addEventListener('click', async () => {
    go.disabled = true;
    try {
      await post(route, { profile: ST.profile, [field]: name, confirm: input.value });
      done();
    } catch (err) { go.disabled = false; showError(out, err); }
  });
  out.append(el('div', { class: 'card', style: 'margin:16px 0 0' },
    el('div', { class: 'msg warn' }, s('dropWarn').replace('{name}', name)),
    el('label', {}, s('typeToConfirm')), input,
    el('div', { class: 'row', style: 'margin-top:12px' },
      go, el('button', { onclick: () => clear(out) }, s('cancel')))));
  setTimeout(() => input.focus(), 30);
}

/**
 * Kurulum sonucu.
 *
 * Şifre BİR KEZ gösteriliyor — cPanel de bizde de saklanmıyor. Bu yüzden aynı
 * ekranda hem kopyalama hem de doğrudan `.env` dosyasına yazma var: kullanıcı
 * bu kartı kapattığında bağlantı dizesi ya kaydedilmiş olmalı ya da yeniden
 * üretilmesi gerekecek.
 */
async function renderDbResult(out, r) {
  clear(out);
  const card = el('div', { class: 'card', style: 'margin:16px 0 0' },
    el('div', { class: 'msg info' }, s('ready') + ': ' + r.database),
    r.dbExisted ? el('div', { class: 'msg warn' }, s('dbExistedNote')) : null,
    r.userExisted ? el('div', { class: 'msg warn' }, s('userExistedNote')) : null,
    el('dl', { class: 'kv' },
      el('dt', {}, s('database')), el('dd', { class: 'mono' }, r.database),
      el('dt', {}, s('dbUser')), el('dd', { class: 'mono' }, r.user),
      r.password ? el('dt', {}, s('dbPassword')) : null,
      r.password ? el('dd', { class: 'mono' }, r.password) : null));
  out.append(card);

  if (!r.url) return;
  card.append(
    el('label', {}, 'DATABASE_URL'),
    el('div', { class: 'row' },
      el('code', { style: 'flex:1;word-break:break-all' }, r.url), copyBtn(r.url)),
    el('div', { class: 'msg warn', style: 'margin-top:12px' }, s('passOnce')));

  /* Bağlantı dizesini uygulamaya taşı — asıl işi bitiren adım bu. */
  const msg = el('div', {});
  const apps = await appsForEnv().catch(() => []);
  const sel = el('select', { style: 'width:auto;min-width:200px' },
    el('option', { value: '' }, s('pickApp')),
    ...apps.map((a) => el('option', { value: a.path }, a.name + ' · ~/' + a.path)));

  const write = async (btn, fn, label) => {
    btn.disabled = true;
    clear(msg);
    try {
      await fn();
      msg.append(el('div', { class: 'msg info' }, s('envWritten').replace('{file}', label())));
    } catch (err) { showError(msg, err); }
    finally { btn.disabled = false; }
  };

  const serverBtn = el('button', { class: 'primary' }, s('writeEnv'));
  serverBtn.addEventListener('click', () => {
    if (!sel.value) return;
    write(serverBtn,
      () => post('env', { profile: ST.profile, appRoot: sel.value, file: '.env',
        entries: { DATABASE_URL: r.url } }),
      () => '~/' + sel.value + '/.env');
  });

  const row = el('div', { class: 'row', style: 'margin-top:12px' }, sel, serverBtn);
  if (ST.deploy.path) {
    const localBtn = el('button', {}, s('writeLocalEnv'));
    localBtn.addEventListener('click', () => write(localBtn,
      () => post('env-local', { projectPath: ST.deploy.path, file: '.env.local',
        entries: { DATABASE_URL: r.url } }),
      () => ST.deploy.path + '/.env.local'));
    row.append(localBtn);
  }
  card.append(row, msg);
}

/**
 * Sunucudaki ortam dosyası.
 *
 * Değerler MASKELİ geliyor; "Göster" ayrı bir istek. Ekran paylaşımında bir
 * `DATABASE_URL`'in düz görünmesi, onu paylaşmakla aynı şey.
 */
async function envCard(root) {
  const apps = await appsForEnv();
  if (!apps.length) return;

  const appSel = el('select', { style: 'width:auto;min-width:180px' },
    ...apps.map((a) => el('option', { value: a.path }, a.name)));
  const fileSel = el('select', { style: 'width:auto' },
    ...['.env', '.env.production', '.env.local'].map((f) => el('option', { value: f }, f)));
  const body = el('div', {});
  let reveal = false;

  const load = async () => {
    clear(body);
    body.append(el('p', { class: 'sub' }, s('working')));
    let r;
    try {
      r = await api('env?profile=' + encodeURIComponent(ST.profile) +
        '&appRoot=' + encodeURIComponent(appSel.value) +
        '&file=' + encodeURIComponent(fileSel.value) + (reveal ? '&reveal=1' : ''));
    } catch (err) { clear(body); return showError(body, err); }
    clear(body);

    if (!r.exists && !r.entries.length) body.append(el('p', { class: 'sub' }, s('noEnv')));
    else body.append(el('table', {},
      el('thead', {}, el('tr', {}, el('th', {}, s('key')), el('th', {}, s('value')), el('th', {}))),
      el('tbody', {}, ...r.entries.map((e) => el('tr', {},
        el('td', { class: 'mono' }, e.key),
        el('td', { class: 'mono muted', style: 'word-break:break-all' }, e.value),
        el('td', { style: 'text-align:right' },
          el('button', { class: 'link', onclick: async (ev) => {
            ev.target.disabled = true;
            try { await post('env', { profile: ST.profile, appRoot: appSel.value, file: fileSel.value, remove: e.key }); await load(); }
            catch (err) { ev.target.disabled = false; showError(body, err); }
          } }, s('del'))))))));

    const k = el('input', { placeholder: s('key'), style: 'max-width:220px' });
    const v = el('input', { placeholder: s('value') });
    const add = el('button', {}, s('addVar'));
    add.addEventListener('click', async () => {
      if (!k.value.trim()) return;
      add.disabled = true;
      try {
        await post('env', { profile: ST.profile, appRoot: appSel.value, file: fileSel.value,
          entries: { [k.value.trim()]: v.value } });
        await load();
      } catch (err) { add.disabled = false; showError(body, err); }
    });
    body.append(el('div', { class: 'row', style: 'margin-top:12px' }, k, v, add,
      el('button', { onclick: () => { reveal = !reveal; load(); } }, reveal ? s('hide') : s('reveal'))));
  };

  appSel.addEventListener('change', load);
  fileSel.addEventListener('change', load);

  root.append(el('div', { class: 'card' },
    el('div', { class: 'row' },
      el('h2', { style: 'flex:1' }, s('envTitle')), appSel, fileSel),
    el('p', { class: 'sub' }, s('envNote')),
    body));
  await load();
}

/**
 * Hesap DÜZENLEME.
 *
 * Eskiden yoktu: token iptal edildiyse, sunucu adı ya da kullanıcı adı
 * değiştiyse tek çare hesabı silip yeniden eklemekti — ve bu, sunucuda öksüz
 * bir tam yetki token'ı bırakıyordu.
 *
 * Şifre alanı BOŞ bırakılabilir: yalnızca doldurulduğunda yeni token üretilir.
 */
function renderEditProfile(out, p, { focusPassword = false } = {}) {
  clear(out);
  const host = el('input', { value: p.host });
  const port = el('input', { type: 'number', value: String(p.port) });
  const user = el('input', { value: p.user });
  const pass = el('input', { type: 'password' });
  const save = el('input', { type: 'checkbox', style: 'width:auto' });
  save.checked = Boolean(p.hasPassword);
  const msg = el('div', {});
  const go = el('button', { class: 'primary', style: 'margin-top:14px' }, s('save'));

  go.addEventListener('click', async () => {
    go.disabled = true;
    clear(msg);
    try {
      const r = await api('profiles/' + encodeURIComponent(p.name), {
        method: 'PATCH',
        body: JSON.stringify({
          host: host.value, port: Number(port.value) || 2083, user: user.value,
          password: pass.value || undefined,
          // Kutu işaretliyse ama yeni şifre girilmediyse, kayıtlı şifre olduğu
          // gibi kalır; kutu KALDIRILDIYSA kayıtlı şifre silinir.
          savePassword: save.checked,
        }),
      });
      ST.profiles = r.profiles;
      if (ST.profile === p.name) ST.profile = r.profiles.find((x) => x.host === host.value)?.name ?? ST.profile;
      ST.overview = null;
      renderMain();
    } catch (err) { go.disabled = false; showError(msg, err); }
  });

  out.append(el('div', { class: 'card', style: 'margin:12px 0' },
    el('div', { class: 'sec' }, el('h2', {}, s('editAccount')), el('p', {}, s('editAccountHint'))),
    el('div', { class: 'grid2' },
      el('div', {}, el('label', {}, s('host')), host),
      el('div', {}, el('label', {}, s('port')), port)),
    el('label', {}, s('user')), user,
    el('label', {}, s('newCpanelPassword')), pass,
    el('p', { class: 'help' }, s('newCpanelPasswordHint')),
    el('div', { class: 'row', style: 'margin-top:12px' },
      el('label', { style: 'margin:0;text-transform:none;font-size:13px;color:var(--fg)' },
        save, ' ' + s('storePassword'))),
    el('p', { class: 'help', style: 'margin-left:22px' }, s('storePasswordHint')),
    el('div', { class: 'row' }, go, el('button', { onclick: () => clear(out) }, s('cancel'))),
    msg));

  setTimeout(() => (focusPassword ? pass : host).focus(), 40);
}

/**
 * Hesap ekleme formu — TEK bir yerde.
 *
 * Hem karşılama ekranı hem Ayarlar sekmesi bunu kullanıyor. İki kopya
 * tutmak, birinde düzeltilen bir davranışın diğerinde kalması demekti.
 */
function renderAddProfile(root, { autofocus = false, askMaster = false, onDone = null } = {}) {
  const host = el('input', { placeholder: 'sunucu.example.com' });
  const user = el('input', { placeholder: 'cpaneluser' });
  const port = el('input', { type: 'number', value: '2083' });
  const pass = el('input', { type: 'password' });
  const master = el('input', { type: 'password' });
  // Varsayılan AÇIK: kullanıcı tek tıkla phpMyAdmin/Dosya Yöneticisi bekliyor.
  // Kapatmak tek tık, ve kapatınca bu ekranlar cPanel girişine yönlendiriyor.
  const savePass = el('input', { type: 'checkbox', style: 'width:auto' });
  savePass.checked = true;
  const out = el('div', {});
  const btn = el('button', { class: 'primary', style: 'margin-top:16px' }, s('add'));

  const submit = async () => {
    btn.disabled = true;
    clear(out);
    try {
      /*
       * Ana şifre YALNIZCA ilk hesapta soruluyor: kasa henüz yok, kurulması
       * gerekiyor. Sonrakilerde kasa zaten açık ve TEK — her hesap için ayrı
       * şifre istemek "şifrem global olsun" beklentisinin tam tersiydi.
       */
      const r = await post('profiles', {
        host: host.value, user: user.value, port: Number(port.value) || 2083,
        password: pass.value, savePassword: savePass.checked,
        master: askMaster ? master.value : undefined });
      ST.profiles = r.profiles;
      if (!ST.profile) ST.profile = r.profiles[0]?.name ?? null;
      pass.value = '';
      ST.overview = null;
      (onDone ?? renderMain)();
    } catch (err) { showError(out, err); }
    btn.disabled = false;
  };
  btn.addEventListener('click', submit);
  for (const input of [host, user, pass, master]) {
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
  }

  root.append(el('div', { class: 'card' },
    el('div', { class: 'sec' },
      el('h2', {}, s('addProfile')),
      el('p', {}, s('passwordNote'))),
    el('div', { class: 'grid2' },
      el('div', {}, el('label', {}, s('host')), host,
        el('p', { class: 'help' }, 'srv12.example.com · sunucu.firmaniz.com')),
      el('div', {}, el('label', {}, s('port')), port,
        el('p', { class: 'help' }, '2083'))),
    el('label', {}, s('user')), user,
    el('label', {}, s('password')), pass,
    el('div', { class: 'row', style: 'margin-top:10px' },
      el('label', { style: 'margin:0;text-transform:none;font-size:13px;color:var(--fg)' },
        savePass, ' ' + s('storePassword'))),
    el('p', { class: 'help', style: 'margin-left:22px' }, s('storePasswordHint')),
    askMaster ? el('label', {}, s('masterNew')) : null,
    askMaster ? master : null,
    askMaster ? el('p', { class: 'help' }, s('masterNewHelp')) : null,
    btn, out));

  if (autofocus) setTimeout(() => host.focus(), 40);
}

/* ------------------------------------------------------------- settings */
/**
 * HESAP ayarları — yalnızca seçili cPanel hesabını ilgilendirenler.
 *
 * Bunlar Ayarlar sekmesindeydi ve orada dil/varsayılan arayüz gibi ARACA ait
 * tercihlerle karışıyordu. Farklı kapsamlar: biri "bu cPanel hesabı",
 * diğeri "bu araç". Başlıktaki hesap seçicinin yanından açılınca hangi hesabı
 * ilgilendirdiği de kendiliğinden belli oluyor.
 */
async function viewAccount(root) {
  clear(root);

  const back = el('button', { onclick: () => { ST.tab = 'overview'; renderMain(); } }, s('backToAccount'));

  if (ST.newAccount || !ST.profile) {
    root.append(el('div', { class: 'row', style: 'margin-bottom:14px' }, back));
    renderAddProfile(root, { autofocus: true, onDone: () => { ST.tab = 'overview'; renderMain(); } });
    return;
  }

  const p = ST.profiles.find((x) => x.name === ST.profile);
  if (!p) { ST.tab = 'overview'; return renderMain(); }

  root.append(el('div', { class: 'row', style: 'margin-bottom:14px' },
    back,
    el('span', { class: 'muted mono' }, p.user + '@' + p.host + ':' + p.port)));

  /* --- bağlantı --- */
  const out = el('div', {});
  const testBtn = el('button', {}, s('testConn'));
  testBtn.addEventListener('click', async () => {
    testBtn.disabled = true;
    clear(out);
    try {
      const r = await post('profiles/' + encodeURIComponent(p.name) + '/test');
      out.append(el('div', { class: 'msg ' + (r.ok ? 'info' : 'err') },
        r.ok
          ? el('span', {}, '✓ ' + s('connOk').replace('{user}', r.user) + (r.domain ? ' · ' + r.domain : ''))
          : el('span', {}, '✕ ' + s('connBad') + ' — ' + r.error)));
      if (!r.ok) renderEditProfile(out, p, { focusPassword: true });
    } catch (err) { showError(out, err); }
    testBtn.disabled = false;
  });

  const removeBtn = el('button', { class: 'danger' }, s('remove'));
  removeBtn.addEventListener('click', async () => {
    if (!confirm(s('removeConfirm').replace('{name}', p.name))) return;
    removeBtn.disabled = true;
    try {
      const r = await api('profiles/' + encodeURIComponent(p.name), { method: 'DELETE' });
      ST.profiles = r.profiles;
      ST.profile = r.profiles[0]?.name ?? null;
      ST.overview = null;
      ST.tab = 'overview';
      renderMain();
    } catch (err) { removeBtn.disabled = false; showError(out, err); }
  });

  root.append(el('div', { class: 'card' },
    el('div', { class: 'sec' },
      el('h2', {}, s('accountSettings')),
      el('p', {}, s('accountSettingsSub').replace('{name}', p.name))),
    el('dl', { class: 'kv' },
      el('dt', {}, s('host')), el('dd', { class: 'mono' }, p.host + ':' + p.port),
      el('dt', {}, s('user')), el('dd', { class: 'mono' }, p.user),
      el('dt', {}, 'token'), el('dd', { class: 'muted mono' }, p.tokenName || s('none')),
      el('dt', {}, s('autoLoginOn')), el('dd', {},
        p.hasPassword ? el('span', { class: 'pill ok' }, '⚡') : el('span', { class: 'pill' }, s('none')))),
    el('div', { class: 'row', style: 'margin-top:14px' },
      testBtn,
      el('button', { onclick: () => renderEditProfile(out, p) }, s('edit')),
      el('span', { style: 'flex:1' }),
      removeBtn),
    out));

  /* --- cPanel şifresi --- */
  /*
   * Sunucudaki hesabın şifresi. cPanel ESKİ ŞİFREYİ istiyor ve bu iyi:
   * kasası açık bir arayüzün, kullanıcının onayı olmadan cPanel şifresini
   * değiştirebilmesi doğru olmazdı.
   */
  const oldP = el('input', { type: 'password' });
  const newP = el('input', { type: 'password' });
  const newP2 = el('input', { type: 'password' });
  const pwOut = el('div', {});
  const pwBtn = el('button', { class: 'primary', style: 'margin-top:14px' }, s('changePassword'));

  pwBtn.addEventListener('click', async () => {
    clear(pwOut);
    if (newP.value !== newP2.value) return showError(pwOut, new Error(s('passwordMismatch')));
    pwBtn.disabled = true;
    try {
      await post('account-password', {
        profile: ST.profile, oldPassword: oldP.value, newPassword: newP.value });
      oldP.value = newP.value = newP2.value = '';
      pwOut.append(el('div', { class: 'msg info' }, s('passwordChanged')));
      const st = await api('status');
      ST.profiles = st.profiles;
    } catch (err) { showError(pwOut, err); }
    pwBtn.disabled = false;
  });

  root.append(el('div', { class: 'card' },
    el('div', { class: 'sec' },
      el('h2', {}, s('changePassword')),
      el('p', {}, s('changePasswordSub'))),
    el('label', {}, s('currentPassword')), oldP,
    el('div', { class: 'grid2' },
      el('div', {}, el('label', {}, s('newPassword')), newP),
      el('div', {}, el('label', {}, s('newPasswordAgain')), newP2)),
    pwBtn, pwOut));
}

/**

 *
 * cPanel de biz de bu şifreyi sonradan okuyamıyoruz; kullanıcı bu kartı
 * kapattığında ya kaydetmiş olmalı ya da yenisini üretmeli. Kopyalama
 * düğmesi bu yüzden burada.
 */
function showSecret(out, rows, password) {
  clear(out);
  const card = el('div', { class: 'card', style: 'margin:16px 0 0' },
    el('dl', { class: 'kv' }, ...rows.flatMap(function (pair) {
      return [el('dt', {}, pair[0]), el('dd', { class: 'mono' }, pair[1])];
    })));
  if (password) {
    card.append(
      el('label', {}, s('dbPassword')),
      el('div', { class: 'row' },
        el('code', { style: 'flex:1;word-break:break-all' }, password), copyBtn(password)),
      el('div', { class: 'msg warn', style: 'margin-top:12px' }, s('passOnce')));
  }
  card.append(el('div', { class: 'row', style: 'margin-top:12px' },
    el('button', { onclick: () => clear(out) }, s('close'))));
  out.append(card);
}

/** Adı birebir yazmadan silinmeyen her şey için ortak onay kutusu. */
function askTypedDelete(out, opts) {
  clear(out);
  const input = el('input', { placeholder: opts.value });
  const go = el('button', { class: 'danger', style: 'margin-top:12px' }, s('del'));
  go.addEventListener('click', async () => {
    go.disabled = true;
    try {
      const body = { profile: ST.profile, confirm: input.value };
      body[opts.field] = opts.value;
      await post(opts.route, body);
      opts.done();
    } catch (err) { go.disabled = false; showError(out, err); }
  });
  out.append(el('div', { class: 'card', style: 'margin:16px 0 0' },
    el('div', { class: 'msg warn' }, opts.warn),
    el('label', {}, s('typeToConfirm')), input,
    el('div', { class: 'row', style: 'margin-top:12px' },
      go, el('button', { onclick: () => clear(out) }, s('cancel')))));
  setTimeout(() => input.focus(), 30);
}

/* ----------------------------------------------------------------- logs */
async function viewLogs(root, { append = false } = {}) {
  if (!append) clear(root);
  const holder = el('div', {}, el('div', { class: 'card' }, s('working')));
  root.append(holder);
  const appRoot = ST.overview?.apps?.[0]?.path ?? '';
  let r;
  try {
    r = await api('logs?profile=' + encodeURIComponent(ST.profile) +
      (appRoot ? '&appRoot=' + encodeURIComponent(appRoot) : ''));
  } catch (err) { clear(holder); return showError(holder, err); }
  clear(holder);
  root = holder;

  root.append(el('div', { class: 'card' },
    el('div', { class: 'sec' }, el('h2', {}, s('logsSection'))),
    r.runs.length === 0 ? el('p', { class: 'sub' }, s('none')) :
      el('div', {}, ...r.runs.map((run) => el('div', { style: 'margin-bottom:14px' },
        el('div', { class: 'row' },
          el('span', { class: 'pill ' + (run.done ? (run.ok ? 'ok' : 'bad') : 'warn') },
            run.done ? (run.ok ? '✓' : '✗') : (run.progress ?? 0) + '%'),
          el('code', {}, run.step ?? '')),
        run.output ? el('div', { class: 'log', style: 'height:180px' }, String(run.output).slice(-4000)) : null)))));

  if (r.history?.length) {
    root.append(el('div', { class: 'card' },
      el('h2', {}, s('history')),
      el('table', {},
        el('thead', {}, el('tr', {}, el('th', {}, s('date')), el('th', {}, s('version')),
          el('th', {}, s('package')), el('th', {}, s('status')))),
        el('tbody', {}, ...r.history.slice(-15).reverse().map((h) => el('tr', {},
          el('td', { class: 'muted' }, new Date(h.date).toLocaleString()),
          el('td', { class: 'mono' }, h.version ?? ''),
          el('td', {}, (h.files ?? '') + ' ' + s('files') + ' · ' + bytes(h.size ?? 0)),
          el('td', {}, el('span', { class: 'pill ' + (h.ok === false ? 'bad' : 'ok') },
            h.ok === false ? '✗' : '✓'))))))));
  }
}

/* ------------------------------------------------------------ kalp atışı */
/*
 * Terminal, bu atışlar kesilince geri döner.
 *
 * `beforeunload` + `sendBeacon` yerine düzenli atış kullanıyoruz: beacon
 * sekme çöktüğünde, ağ koptuğunda veya tarayıcı onu düşürdüğünde hiç gelmez.
 * Atışın YOKLUĞU ise her durumda doğru sinyal.
 */
let beatTimer = null;
function startHeartbeat() {
  const beat = () => post('heartbeat').catch(() => {});
  beat();
  beatTimer = setInterval(beat, 4000);
  // Sekme arka plana alınınca tarayıcılar zamanlayıcıyı yavaşlatır; geri
  // gelince hemen bir atış gönderip gereksiz çıkışı önlüyoruz.
  document.addEventListener('visibilitychange', () => { if (!document.hidden) beat(); });
}
function stopHeartbeat() { if (beatTimer) clearInterval(beatTimer); beatTimer = null; }

startHeartbeat();
boot().catch((e) => { app.append(el('div', { class: 'msg err' }, e.message)); });
</script>
