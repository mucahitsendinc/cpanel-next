<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cpanel-next</title>
<style>
:root{
  --bg:#0e1014; --panel:#161920; --panel2:#1d212a; --line:#282d38;
  --fg:#e8eaf0; --dim:#8b93a5; --accent:#4e9dff; --ok:#3ecf8e; --warn:#f5b544; --bad:#ff6b6b;
  --radius:12px;
  --shadow:0 1px 2px rgba(0,0,0,.28), 0 8px 24px -12px rgba(0,0,0,.5);
  --ring:0 0 0 3px rgba(78,157,255,.28);
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f5f6f8; --panel:#fff; --panel2:#f2f4f7; --line:#e2e6ec;
         --fg:#161a21; --dim:#5f6875; --accent:#0b62c4; --ok:#12855a; --warn:#9a6100; --bad:#c0392b;
         --shadow:0 1px 2px rgba(16,24,40,.05), 0 10px 24px -14px rgba(16,24,40,.18); }
}
/* Hareketi kısıtlayanlar için: geçişler bir süs, engel olmamalı. */
@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important} }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent)}
button{font:inherit;font-weight:500;color:inherit;background:var(--panel2);
  border:1px solid var(--line);border-radius:9px;padding:8px 14px;cursor:pointer;
  transition:border-color .14s ease, background .14s ease, transform .06s ease}
button:hover:not(:disabled){border-color:var(--accent);background:var(--panel)}
button:active:not(:disabled){transform:translateY(1px)}
button:focus-visible,a:focus-visible{outline:none;box-shadow:var(--ring)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.danger{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:600}
button.link{background:none;border:none;padding:2px 4px;color:var(--accent);text-decoration:underline}
input,select{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;padding:9px 11px;width:100%;transition:border-color .14s ease, box-shadow .14s ease}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
input::placeholder{color:var(--dim);opacity:.7}
label{display:block;margin:12px 0 5px;color:var(--dim);font-size:12px;
  text-transform:uppercase;letter-spacing:.5px}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;
  background:color-mix(in srgb, var(--panel) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;flex-wrap:wrap}
header .brand{font-weight:700;letter-spacing:-.3px}
header .spacer{flex:1}
main{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;font-size:15px}
.card p.sub{margin:0 0 14px;color:var(--dim);font-size:13px}
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.tabs button{border-radius:999px;padding:8px 15px}
.tabs button.on{box-shadow:var(--ring)}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--dim);font-weight:600;font-size:11px;
  text-transform:uppercase;letter-spacing:.5px;padding:6px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;
  border:1px solid var(--line);color:var(--dim)}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px}
.kv dt{color:var(--dim)}
.kv dd{margin:0}
.log{background:#0a0c10;color:#d5dae4;border-radius:8px;padding:12px;
  height:340px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12px;white-space:pre-wrap;word-break:break-word}
.log .s{color:#4ea1ff}
.log .e{color:#ff6b6b}
.log .w{color:#f5b544}
.log .d{color:#3ecf8e}
.msg{padding:11px 13px;border-radius:8px;margin-bottom:14px;font-size:13px}
.msg.err{background:rgba(255,107,107,.12);border:1px solid var(--bad)}
.msg.warn{background:rgba(245,181,68,.12);border:1px solid var(--warn)}
.msg.info{background:rgba(78,161,255,.10);border:1px solid var(--accent)}
.center{max-width:400px;margin:12vh auto}
.browse{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.browse div{padding:7px 11px;cursor:pointer;border-bottom:1px solid var(--line);font-size:13px}
.browse div:last-child{border-bottom:none}
.browse div:hover{background:var(--panel2)}
.hide{display:none}
.muted{color:var(--dim)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
progress{width:100%;height:6px}

/* ---------------------------------------------------------------------------
 * Rehberlik katmanı.
 *
 * Arayüz çalışıyordu ama bir cPanel/Node bilgisi VARSAYIYORDU: ekranda altı
 * sekme, jargonlu sütun başlıkları ve tek satır açıklama yoktu. Aşağıdaki
 * sınıflar o boşluğu dolduruyor — her bölümün bir alt başlığı, her boş
 * listenin bir "şimdi ne yapmalıyım" kartı, her teknik terimin bir cümlesi.
 * ------------------------------------------------------------------------ */

/* Bölüm başlığı: büyük başlık + tek satır açıklama */
.sec{margin:0 0 14px}
.sec h2{margin:0 0 3px;font-size:16px;letter-spacing:-.2px}
.sec p{margin:0;color:var(--dim);font-size:13px}

/* Alan altı yardım metni — etiketin altında, girdinin üstünde */
.help{color:var(--dim);font-size:12px;margin:4px 0 0;line-height:1.45}

/* Hızlı işlem kutuları */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;
  padding:13px 14px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--panel2);cursor:pointer;text-decoration:none;color:inherit;width:100%}
.tile{transition:border-color .14s ease, transform .1s ease, box-shadow .14s ease}
.tile:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow)}
.tile b{font-size:13px;font-weight:600}
.tile span{font-size:11.5px;color:var(--dim);line-height:1.35}
.tile .ico{font-size:17px;line-height:1;margin-bottom:3px}

/* Uygulama kartı — yoğun tablo yerine */
.app{border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;margin-bottom:10px;
  background:var(--panel2);transition:border-color .14s ease}
.app:hover{border-color:color-mix(in srgb, var(--accent) 45%, var(--line))}
.app .top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.app .name{font-weight:600;font-size:14px}
.app .meta{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 12px;font-size:12px;color:var(--dim)}
.app .meta b{font-weight:500;color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* Durum noktası */
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dim);
  margin-right:6px;vertical-align:middle}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(62,207,142,.18)}
.dot.off{background:var(--warn);box-shadow:0 0 0 3px rgba(245,181,68,.18)}

/* Boş durum — "liste boş" demek yetmiyor, ne yapılacağını da söylemeli */
.empty{text-align:center;padding:30px 20px;border:1px dashed var(--line);border-radius:var(--radius)}
.empty .ico{font-size:26px;opacity:.55}
.empty h3{margin:10px 0 5px;font-size:14px}
.empty p{margin:0 auto 15px;max-width:430px;color:var(--dim);font-size:13px}

/* Sihirbaz adım şeridi */
.steps{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;padding:8px 13px;border:1px solid var(--line);
  border-radius:999px;font-size:12.5px;color:var(--dim);background:var(--panel)}
.step .n{display:grid;place-items:center;width:19px;height:19px;border-radius:50%;
  background:var(--line);color:var(--fg);font-size:11px;font-weight:600}
.step.on{border-color:var(--accent);color:var(--fg)}
.step.on .n{background:var(--accent);color:#fff}
.step.done{color:var(--ok);border-color:var(--ok)}
.step.done .n{background:var(--ok);color:#fff}

/* Numaralı anlatım (karşılama ekranı) */
.howto{counter-reset:h;margin:0;padding:0;list-style:none}
.howto li{counter-increment:h;position:relative;padding:0 0 14px 34px;font-size:13px}
.howto li::before{content:counter(h);position:absolute;left:0;top:0;width:22px;height:22px;
  display:grid;place-items:center;border-radius:50%;background:var(--panel2);
  border:1px solid var(--line);font-size:11px;font-weight:600}
.howto li b{display:block;margin-bottom:2px;font-size:13.5px}
.howto li span{color:var(--dim)}

/* ---------------------------------------------------------------------------
 * Masaüstü kabuğu.
 *
 * Electron'da başlık çubuğu gizli (`hiddenInset`) — daha derli toplu duruyor
 * ama iki şeyi kendimiz halletmek zorundayız:
 *
 *   1. SÜRÜKLEME. Başlık çubuğu olmayınca pencereyi tutacak yer kalmıyor.
 *      Üst şeridi sürükleme bölgesi yapıyoruz.
 *   2. TRAFİK IŞIKLARI. Kapat/küçült/büyüt düğmeleri içeriğin ÜSTÜNE biniyor;
 *      sol tarafta onlara yer açıyoruz.
 *
 * ⚠ Sürükleme bölgesi içindeki DÜĞMELER tıklanamaz hâle geliyor — sürükleme
 * tıklamayı yutuyor. Hepsini tek tek `no-drag` yapmak gerekiyor.
 *
 * Bu kurallar yalnızca `body.shell-mac` altında: aynı sayfa tarayıcıda da
 * çalışıyor ve orada sol üstte sebepsiz bir boşluk oluşurdu.
 * ------------------------------------------------------------------------ */
body.shell-mac header{
  -webkit-app-region:drag;
  padding-left:92px;   /* trafik ışıkları ~78px, biraz nefes payı */
  padding-top:14px;padding-bottom:14px;
}
body.shell-mac header button,
body.shell-mac header select,
body.shell-mac header a,
body.shell-mac header input{ -webkit-app-region:no-drag }

/* Üst araç çubuğu — cPanel'in kendi ekranlarına bağlantılar */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.toolbar a{text-decoration:none}
.wide{max-width:720px}

/* --------------------------------------------------------------------------
 * Yeni kabuk: sakin bir çalışma alanı ve katmanlı gezinme.
 *
 * Birbirine eşit yedi sekme kullanıcıya yedi ayrı ürün varmış hissi veriyordu.
 * Siteler günlük iş, hizmetler ise gerektiğinde açılan ikincil araçlar. Bu
 * ayrımı yalnız renkle değil, yerleşim ve hiyerarşiyle de anlatıyoruz.
 * ----------------------------------------------------------------------- */
:root{
  --bg:#0c1119;--panel:#131a24;--panel2:#18212d;--panel3:#202b39;
  --line:#293647;--fg:#f2f5f9;--dim:#99a7b8;--accent:#5d9df5;
  --accent-soft:rgba(93,157,245,.13);--ok:#43b98a;--warn:#e4ad54;--bad:#ef756f;
  --danger-soft:rgba(239,117,111,.10);--radius:14px;
  --shadow:0 1px 2px rgba(0,0,0,.22),0 16px 36px -28px rgba(0,0,0,.7);
  --ring:0 0 0 3px rgba(93,157,245,.3);--sidebar:226px;
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#f3f6f9;--panel:#fff;--panel2:#f7f9fb;--panel3:#eef3f7;
    --line:#dce4ec;--fg:#172130;--dim:#657386;--accent:#236fc6;
    --accent-soft:#e9f2fc;--ok:#147858;--warn:#976313;--bad:#bd403b;
    --danger-soft:#fff0ef;--shadow:0 1px 2px rgba(19,33,52,.05),0 18px 42px -32px rgba(19,33,52,.32);
  }
}
html{min-height:100%;background:var(--bg)}
body{min-height:100vh;letter-spacing:.002em}
button,input,select{min-height:40px}
input[type="checkbox"]{min-height:auto;accent-color:var(--accent)}
button{border-radius:10px;padding:8px 13px;background:var(--panel);box-shadow:0 1px 1px rgba(0,0,0,.04)}
button:hover:not(:disabled){background:var(--panel3);border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
button.primary{background:var(--accent);border-color:var(--accent);box-shadow:0 5px 15px -10px var(--accent)}
button.primary:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 88%,#000);border-color:transparent}
button.danger{color:var(--bad);background:var(--danger-soft);border-color:color-mix(in srgb,var(--bad) 44%,var(--line));box-shadow:none}
button.danger:hover:not(:disabled){background:color-mix(in srgb,var(--danger-soft) 72%,var(--bad));border-color:var(--bad)}
input,select{background:var(--panel);border-radius:10px;padding:9px 12px}
label{margin-top:15px;color:var(--dim);font-size:11px;font-weight:700;letter-spacing:.07em}
header{
  min-height:64px;padding:10px 18px;gap:10px;flex-wrap:nowrap;background:var(--panel);
  backdrop-filter:none;box-shadow:0 1px 0 var(--line);position:sticky;top:0
}
header .brand{display:flex;align-items:center;gap:9px;min-width:var(--sidebar);font-size:15px;letter-spacing:-.025em}
.brand-mark{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;font-weight:800;font-size:13px}
.header-account{display:flex;align-items:center;gap:7px;min-width:0}
.header-account select{width:auto;min-width:205px;max-width:285px;background:var(--panel2)}
.header-actions{display:flex;align-items:center;gap:7px}
.project-chip{max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim)}
.icon-button{width:40px;padding:0;display:grid;place-items:center;font-weight:700}
/* Terminal kısayolları ve komut geçmişi — küçük, tıklanabilir etiketler.
   Komutu ÇALIŞTIRMIYORLAR, giriş satırına yazıyorlar (bkz. viewTerminal). */
/* Dosya tarayıcısı iki panel gösteriyor; varsayılan 1050px orada dar kalıyor. */
body.wide-content .content{max-width:1400px}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;width:auto;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;opacity:.9}
.chip:hover{opacity:1}
/* Düğme gibi görünmesi gereken bağlantılar (dışarı açılan cPanel sayfaları). */
a.button{display:inline-block;text-decoration:none}
.ver{font-size:11px;opacity:.55;font-weight:500;margin-left:6px;letter-spacing:.02em}
.app-shell{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);max-width:1440px;margin:0 auto;min-height:calc(100vh - 64px)}
.sidebar{padding:22px 14px 30px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:5px;min-width:0}
.nav-caption{margin:14px 10px 5px;color:var(--dim);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.11em}
.nav-item{width:100%;min-height:42px;display:flex;align-items:center;gap:11px;padding:9px 11px;border:1px solid transparent;background:transparent;box-shadow:none;text-align:left;color:var(--dim);font-weight:600}
.nav-item:hover:not(:disabled){background:var(--panel2);border-color:transparent;color:var(--fg)}
.nav-item.on{color:var(--accent);background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 22%,transparent)}
.nav-item svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-services{margin-top:5px}
.nav-services summary{list-style:none;cursor:pointer}
.nav-services summary::-webkit-details-marker{display:none}
.nav-services summary::after{content:'›';margin-left:auto;font-size:18px;transition:transform .15s ease}
.nav-services[open] summary::after{transform:rotate(90deg)}
.nav-children{margin:3px 0 4px 17px;padding-left:10px;border-left:1px solid var(--line);display:grid;gap:3px}
.nav-children .nav-item{min-height:38px;font-size:13px}
.sidebar-bottom{margin-top:auto;padding-top:18px}
.content{width:100%;max-width:1050px;margin:0 auto;padding:30px 34px 70px;min-width:0}
.page-head{margin:0 0 22px}
.page-head h1{font-size:25px;line-height:1.2;letter-spacing:-.035em;margin:0 0 6px}
.page-head p{margin:0;color:var(--dim);font-size:13px}
main{max-width:none;margin:0;padding:0}
.card{padding:22px;margin-bottom:18px;border-radius:var(--radius);box-shadow:var(--shadow)}
.card h2,.sec h2{font-size:16px;letter-spacing:-.015em}
.sec{margin-bottom:17px}.sec p,.card p.sub{font-size:13px;line-height:1.55}
.tiles{grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
.tile{min-height:112px;padding:16px;background:var(--panel2);border-radius:12px;box-shadow:none}
.tile:hover{transform:none;background:var(--panel3);box-shadow:none}
.tile .ico{font-size:19px}.tile b{font-size:13.5px}.tile span{font-size:12px}
.app{padding:17px 18px;background:var(--panel2);border-radius:12px}
.app .top{align-items:center}.app .name{font-size:15px}.app .meta{margin:10px 0 14px}
.empty{padding:38px 22px;background:var(--panel2);border-style:solid}.empty .ico{font-size:25px}
.steps{counter-reset:none;display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:2px 0 22px}
.step{position:relative;justify-content:center;border:0;border-bottom:2px solid var(--line);border-radius:0;background:transparent;padding:10px 8px 13px}
.step.on{border-color:var(--accent);color:var(--fg)}.step.done{border-color:var(--ok)}
.step .n{width:21px;height:21px}.step.on .n{box-shadow:0 0 0 4px var(--accent-soft)}
.advanced{margin:18px 0 0;border:1px solid var(--line);border-radius:12px;background:var(--panel2);overflow:hidden}
.advanced summary{display:flex;align-items:center;gap:9px;padding:13px 15px;cursor:pointer;font-weight:650;color:var(--fg);list-style:none}
.advanced summary::-webkit-details-marker{display:none}.advanced summary::before{content:'+';display:grid;place-items:center;width:20px;height:20px;border:1px solid var(--line);border-radius:6px;color:var(--dim)}
.advanced[open] summary::before{content:'−'}.advanced-body{padding:2px 16px 16px;border-top:1px solid var(--line)}
.danger-zone{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:var(--danger-soft)}
.msg{border-radius:10px;padding:12px 14px}.msg.err{background:var(--danger-soft)}
.log{border:1px solid #222b37;border-radius:10px}
.browse{background:var(--panel2);border-radius:11px}.browse div{padding:10px 12px}
table{font-size:13px}th{padding:9px 11px}td{padding:11px}
.center{max-width:460px;margin:10vh auto;padding:0 18px}.center .card{padding:28px}
.welcome-shell{max-width:920px;margin:0 auto;padding:8vh 24px 60px}
.welcome-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:18px;align-items:start}
.welcome-intro{padding:31px}.welcome-intro .sec h2{font-size:27px!important;letter-spacing:-.04em}
.howto{margin-top:25px!important}.howto li{padding-left:40px;margin-bottom:8px}.howto li::before{width:26px;height:26px;background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.tabs{display:none}
@media(max-width:980px){.tiles{grid-template-columns:repeat(2,1fr)}.project-chip{max-width:190px}.header-account select{min-width:160px}}
@media(max-width:760px){
  header{flex-wrap:wrap;position:relative;padding:10px 14px}.header-account{order:3;width:100%}.header-account select{flex:1;max-width:none}
  header .brand{min-width:0;margin-right:auto}.project-chip{display:none}.app-shell{display:block;min-height:0}
  .sidebar{position:sticky;top:0;z-index:8;padding:8px 10px;flex-direction:row;overflow:auto;border-right:0;border-bottom:1px solid var(--line);background:var(--panel)}
  .nav-caption,.nav-services,.sidebar-bottom{display:contents}.nav-item{width:auto;white-space:nowrap}.nav-item span{display:inline}
  .nav-children{display:contents}.content{padding:24px 16px 55px}.welcome-grid{grid-template-columns:1fr}.tiles{grid-template-columns:1fr 1fr}
  table{display:block;overflow-x:auto;white-space:nowrap}.steps{font-size:11px}.step{padding-inline:3px}
}
@media(max-width:480px){.tiles{grid-template-columns:1fr}.header-actions button:not(.icon-button){display:none}.content{padding-inline:12px}.card{padding:17px}.page-head h1{font-size:22px}}
</style>
</head>
<body>

/* ------------------------------------------------------------------ api */
async function api(pathname, opts = {}) {
  const res = await fetch('/api/' + pathname, {
    ...opts,
    headers: { 'X-CN-Token': TOKEN, 'Content-Type': 'application/json', ...(opts.headers || {}) },
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || ('HTTP ' + res.status));
    err.hint = data.hint;
    throw err;
  }
  return data;
}
const post = (p, body) => api(p, { method: 'POST', body: JSON.stringify(body || {}) });

/* ----------------------------------------------------------------- util */
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return n;
};
const bytes = (n) => {
  const u = ['B', 'KB', 'MB', 'GB'];
  let v = Number(n || 0), i = 0;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return v.toFixed(v >= 100 || i === 0 ? 0 : 1) + ' ' + u[i];
};
const app = document.getElementById('app');
const clear = (n) => { while (n.firstChild) n.removeChild(n.firstChild); };

let ST = { locked: true, profiles: [], profile: null, tab: 'overview', overview: null, deploy: {} };

/** Masaüstü kabuğunda mıyız? `boot()` sorgu parametresinden belirliyor. */
let DESKTOP = false;

function showError(container, err) {
  container.prepend(el('div', { class: 'msg err' },
    el('strong', {}, err.message),
    err.hint ? el('div', { class: 'muted' }, err.hint) : null));
}

/** Seçili hesabın şifresi kasada var mı — otomatik giriş buna bağlı. */
function autoLogin() {
  const p = ST.profiles.find((x) => x.name === ST.profile);
  return Boolean(p && p.hasPassword);
}

/**
 * cPanel ekranına giden adres.
 *
 * Şifre kasadaysa yerel `/sso` sayfasından geçiyor: o sayfa cPanel'in giriş
 * formuna POST edip oturumu AÇIYOR ve hedefe düşüyor. Şifre yoksa doğrudan
 * cPanel giriş sayfasına `goto_uri` ile gidiliyor — kullanıcı şifresini
 * cPanel'e yazıyor ve yine doğru yere varıyor.
 *
 * `fallback` sunucunun ürettiği şifresiz adres; ikisi de aynı hedefe çıkıyor.
 */
function cpanelUrl(target, params, fallback) {
  if (!autoLogin()) return fallback || '#';
  const q = new URLSearchParams({ t: TOKEN, profile: ST.profile, target });
  for (const [k, v] of Object.entries(params || {})) if (v) q.set(k, v);
  return '/sso?' + q.toString();
}

/* ---------------------------------------------------------------- render */
async function boot() {
  /*
   * Masaüstü kabuğu kendini sorgu parametresiyle tanıtıyor; sürükleme alanı ve
   * trafik ışığı boşluğu yalnızca orada uygulanıyor (bkz. `body.shell-mac`).
   */
  const shell = new URLSearchParams(location.search).get('shell');
  if (shell) document.body.classList.add('shell-' + shell);
  /*
   * Masaüstünde mi çalışıyoruz?
   *
   * Yalnızca görünüm için değil: "Terminale dön" düğmesinin davranışı
   * kabuğa göre TAMAMEN farklı. Tarayıcıda sunucuyu bırakıp terminale
   * dönmek doğru; masaüstünde sunucu uygulamanın KENDİ İÇİNDE ve sayfayı
   * boşaltmak kullanıcıya çalışmayan bir pencere bırakıyor.
   */
  DESKTOP = Boolean(shell);

  const st = await api('status');
  ST.locked = st.locked;
  ST.profiles = st.profiles;
  ST.version = st.version || '';
  LANG = st.lang || LANG;
  if (!ST.profile && st.profiles.length) ST.profile = st.profiles[0].name;
  // Terminalden bir proje dizininde açıldıysa o projeyi hazır seç ve
  // doğrudan yayınla sekmesine düş — kullanıcı zaten onun için geldi.
  if (st.initialProject && !ST.deploy.path) {
    ST.deploy = { path: st.initialProject.path };
    ST.tab = 'deploy';
  }
  /*
   * Hiç hesap yoksa açılacak bir kasa da yok.
   *
   * Kasa her zaman kilitli başladığı için burada yalnızca `locked`'a bakmak,
   * yeni kullanıcıyı "Kasayı aç" ekranına hapsediyordu: girdiği her şifre
   * `no profiles` hatası veriyordu ve ileri gitmenin yolu yoktu.
   */
  if (!st.hasProfiles) return renderWelcome();
  ST.locked ? renderUnlock() : renderMain();
}

function renderUnlock(errMsg) {
  clear(app);
  const box = el('div', { class: 'center' });
  const input = el('input', { type: 'password', autofocus: 'true' });
  const btn = el('button', { class: 'primary', style: 'width:100%;margin-top:14px' }, s('unlock'));

  const submit = async () => {
    btn.disabled = true;
    try {
      const r = await post('unlock', { master: input.value });
      ST.locked = false; ST.profiles = r.profiles;
      ST.profile = r.profiles[0]?.name ?? null;
      renderMain();
    } catch (err) {
      btn.disabled = false;
      renderUnlock(err.message);
    }
  };
  btn.addEventListener('click', submit);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });

  box.append(
    el('div', { class: 'card' },
      el('h2', {}, 'cpanel-next'),
      el('p', { class: 'sub' }, s('masterHint')),
      errMsg ? el('div', { class: 'msg err' }, errMsg) : null,
      el('label', {}, s('master')), input, btn));
  app.append(box);
  setTimeout(() => input.focus(), 30);
}

/**
 * Karşılama ekranı — hiç hesap bağlanmamışken.
 *
 * Eskiden bu durumda kullanıcı doğrudan AYARLAR sekmesine düşüyordu: altı
 * sekme, bir form ve hiçbir açıklama. Aracın ne yaptığını, şifresinin ne
 * olacağını ve sırada ne olduğunu bilmeyen biri için anlaşılır değildi.
 */
function renderWelcome() {
  clear(app);
  const main = el('main', { class: 'welcome-shell' });
  const grid = el('div', { class: 'welcome-grid' });

  grid.append(el('div', { class: 'card welcome-intro' },
    el('div', { class: 'sec' },
      el('h2', { style: 'font-size:20px' }, s('welcomeTitle')),
      el('p', {}, s('welcomeLead'))),
    el('ol', { class: 'howto', style: 'margin-top:18px' },
      el('li', {}, el('b', {}, s('how1')), el('span', {}, s('how1d'))),
      el('li', {}, el('b', {}, s('how2')), el('span', {}, s('how2d'))),
      el('li', {}, el('b', {}, s('how3')), el('span', {}, s('how3d'))))));

  // Hesap ekleme formunu ayarlardan taşımıyoruz, oraya YÖNLENDİRİYORUZ —
  // tek bir form, tek bir doğru yer.
  const box = el('div', {});
  grid.append(box);
  main.append(grid);
  app.append(main);
  // İlk hesapta ana şifre de burada belirleniyor: kasa henüz yok.
  renderAddProfile(box, { autofocus: true, askMaster: true, onDone: () => boot() });
}

  clear(app);
  if (!ST.profiles.length) return renderWelcome();
  const sel = el('select', { style: 'width:auto;min-width:230px',

  /*

  const addBtn = el('button', { class: 'icon-button', title: s('addAccount'), 'aria-label': s('addAccount'), onclick: () => { ST.tab = 'account'; ST.newAccount = true; renderMain(); } }, '+');
  const gearBtn = ST.profile

    : null;

  app.append(el('header', {},
    el('span', { class: 'brand' }, el('span', { class: 'brand-mark' }, 'cn'), el('span', {}, 'cpanel-next'),
      /*
       * Sürüm markanın yanında, her ekranda.
       * Kullanıcı "hangi sürümdeyim" sorusunu sormak zorunda kalmasın;
       * bir hatayı bildirirken ilk sorulan şey bu.

      ST.version ? el('span', { class: 'ver', title: 'cpanel-next v' + ST.version }, 'v' + ST.version) : null),
    el('div', { class: 'header-account' }, sel, addBtn, gearBtn),

    el('div', { class: 'header-actions' }, langBtn,
    el('button', { onclick: async () => { await post('lock'); ST.locked = true; renderUnlock(); } }, s('lock')),
    /*
     * ⚠ AYNI DÜĞME, İKİ KABUKTA İKİ FARKLI ŞEY.
     *
     * Tarayıcıda: sunucu terminalde koşuyor, "terminale dön" onu bırakıp
     * komut satırına geri veriyor ve sekmeyi boşaltmak doğru.
     *
     * Masaüstünde: sunucu uygulamanın KENDİ SÜRECİNDE. Sayfayı boşaltmak
     * kullanıcıya hiçbir şey yapmayan, geri dönüşü de olmayan bir pencere
     * bırakıyordu — "uygulama patladı" diye bildirilen davranış buydu.
     * Orada tek anlamlı karşılık uygulamadan ÇIKMAK; pencere kapanınca
     * main.mjs `window-all-closed` ile süreci de sonlandırıyor.
     */
    el('button', { onclick: async () => {
      const r = await post('exit');
      if (r.jobs && !confirm(s('jobRunning'))) return;
      if (DESKTOP) { stopHeartbeat(); window.close(); return; }
      document.body.innerHTML = '';
      document.body.append(el('div', { class: 'center' },
        el('div', { class: 'card' }, el('h2', {}, 'cpanel-next'), el('p', { class: 'sub' }, s('closed')))));
      stopHeartbeat();
    } }, DESKTOP ? s('quitApp') : s('backToTerminal')))));

  /*
   * Gezinme alanlara göre; veritabanı, e-posta ve FTP günlük akışın içine
   * girmeyen "Hizmetler" altında. Böylece yedi eşit sekme yerine üç ana iş,
   * bir hizmet grubu ve en altta araç ayarları var.
   *
   * TABS sabiti görünüm yönlendirmesinin tek doğruluk kaynağı olarak kalıyor;
   * statik test de yeni bir ekran eklenip eşlemesi unutulmasını böyle yakalar.
   */
  const TABS = ['overview', 'deploy', 'database', 'mail', 'ftp', 'explorer', 'terminal', 'history', 'settings'];
  const go = (k) => { ST.tab = k; renderMain(); };
  const navItem = (k) => el('button', {
    class: 'nav-item' + (ST.tab === k ? ' on' : ''),
    'aria-current': ST.tab === k ? 'page' : null,
    onclick: () => go(k),
  }, navIcon(k), el('span', {}, s(k)));
  const services = ['database', 'mail', 'ftp'];
  const sidebar = el('aside', { class: 'sidebar', 'aria-label': s('navigation') },
    el('div', { class: 'nav-caption' }, s('sitesGroup')),
    navItem('overview'), navItem('deploy'), navItem('explorer'), navItem('terminal'), navItem('history'),
    el('details', { class: 'nav-services', open: services.includes(ST.tab) ? 'true' : null },
      el('summary', { class: 'nav-item' }, navIcon('services'), el('span', {}, s('services'))),
      el('div', { class: 'nav-children' }, ...services.map(navItem))),
    el('div', { class: 'sidebar-bottom' },
      el('div', { class: 'nav-caption' }, s('toolGroup')),
      navItem('settings')));

  const main = el('main', { class: 'content' });
  const body = el('div', {});
  const titleKey = ST.tab === 'account' ? 'accountSettings' : ST.tab;
  const subKey = ST.tab === 'account'
    ? 'accountSettingsSub'
    : 'tab' + ST.tab[0].toUpperCase() + ST.tab.slice(1) + 'Sub';
  main.append(el('div', { class: 'page-head' },
    el('h1', {}, s(titleKey)),
    el('p', {}, ST.tab === 'account'
      ? s(subKey).replace('{name}', ST.profile || '')
      : s(subKey))), body);
  // Geniş düzen yalnızca iki panelli ekranda.
  document.body.classList.toggle('wide-content', ST.tab === 'explorer');
  app.append(el('div', { class: 'app-shell' }, sidebar, main));

  if (ST.tab === 'account') {
    viewAccount(body);
    return;
  }

  ({ overview: viewOverview, deploy: viewDeploy, database: viewDatabase, mail: viewMail,
     ftp: viewFtp, explorer: viewExplorer, terminal: viewTerminal, history: viewHistory, settings: viewSettings })[ST.tab](body);
}

/**
 * Laravel güncellemesi — NE OLACAĞI ÖNCE GÖSTERİLİYOR.
 *
 * "Güncelle" tek tık ve o tıkla veritabanı şeması değişebilir. Bunu sessizce
 * yapmak kullanıcının vermediği bir kararı onun adına vermek olurdu; varsayılan
 * artık "migration çalıştırma" ve kip her güncellemede ekranda seçilebiliyor.
 *
 * Seçim bu çalıştırma için geçerli. Kalıcı tercih `.cpanel-next.json` içindeki
 * `laravel.migrate` alanı — sunucu ayar gelmediğinde oradan okuyor, yani iki
 * ön yüz aynı kaynağa bakıyor.
 */

/**
 * Kullanıcının kendi terminal komutları.
 *
 * Kaynak projenin `.cpanel-next.json` dosyası — yayınla güncelleme AYNI
 * dosyayı okuyor, yani burada kaydedilen bir komut her iki akışta da
 * geçerli. "Yayınlarken ayarladım, güncellerken yok" durumu bu yüzden
 * oluşmuyor.
 */
function hookEditor(projectPath) {
  const box = el('div', {});
  const areas = {};
  const STAGES = [
    ['preInstall', s('hkPre')],
    ['postInstall', s('hkPost')],
    ['postStart', s('hkEnd')],
  ];

  const msg = el('div', {});
  const save = el('button', { style: 'margin-top:10px' }, s('save'));

  save.addEventListener('click', async () => {
    save.disabled = true;
    clear(msg);
    try {
      // Boş satırlar atılıyor; kullanıcı listeyi rahatça düzenleyebilsin.
      const hooks = {};
      for (const [stage] of STAGES) {
        const lines = areas[stage].value.split('\n').map((l) => l.trim()).filter(Boolean);
        if (lines.length) hooks[stage] = lines;
      }
      const r = await post('hooks', { path: projectPath, hooks });
      for (const w of r.warnings ?? []) msg.append(el('div', { class: 'msg warn' }, w));
      msg.append(el('div', { class: 'msg ok' }, s('hkSaved')));
    } catch (err) { showError(msg, err); }
    save.disabled = false;
  });

  const body = el('div', {});
  for (const [stage, label] of STAGES) {
    const ta = el('textarea', { rows: '3', spellcheck: 'false',
      style: 'width:100%;font-family:ui-monospace,monospace;font-size:12px' });
    areas[stage] = ta;
    body.append(el('label', {}, label), ta);
  }
  body.append(el('p', { class: 'help' }, s('hkHelp')), save, msg);

  // Mevcut tanımlar yükleniyor.
  post('hooks', { path: projectPath }).then((r) => {
    for (const [stage] of STAGES) areas[stage].value = (r.hooks?.[stage] ?? []).join('\n');
  }).catch(() => {});

  box.append(el('details', { class: 'advanced' },
    el('summary', {}, el('span', {}, s('hkTitle')),
      el('span', { class: 'help', style: 'margin-left:auto' }, s('hkSub'))),
    el('div', { class: 'advanced-body' }, body)));
  return box;
}
